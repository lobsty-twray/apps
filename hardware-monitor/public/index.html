<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="http://shared-assets:3000/design-tokens.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hardware Monitor - Tech with Ray</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --card-bg: rgba(255,255,255,0.03);
      --card-border: rgba(255,255,255,0.08);
      --card-blur: 20px;
      --purple: #7c3aed;
      --blue: #2563eb;
      --pink: #ec4899;
      --orange: #f59e0b;
      --glow-purple: 0 0 30px rgba(124,58,237,0.3);
      --glow-blue: 0 0 30px rgba(59,130,246,0.3);
}
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { font-size:16px; }
    body {
      font-family:'Inter',system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      min-height:100dvh;
      overflow-x:hidden;
      padding-bottom:80px;
    }
    body::before {
      content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
      background:radial-gradient(circle at 30% 20%, rgba(124,58,237,0.08) 0%, transparent 50%),
                 radial-gradient(circle at 70% 80%, rgba(59,130,246,0.06) 0%, transparent 50%);
      z-index:0;pointer-events:none;
    }

    /* Header */
    .header {
      position:sticky;top:0;z-index:100;
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      background:rgba(10,10,15,0.8);
      border-bottom:1px solid var(--card-border);
      padding:16px 20px;
    }
    .header-inner { max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between; }
    .header h1 {
      font-size:1.25rem;font-weight:700;
      background:linear-gradient(135deg,var(--purple),var(--blue));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .header .status-dot {
      width:10px;height:10px;border-radius:50%;
      background:#ef4444;
      transition:background 0.3s,box-shadow 0.3s;
    }
    .header .status-dot.connected {
      background:var(--green);
      box-shadow:0 0 10px rgba(16,185,129,0.6);
      animation:pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%,100%{box-shadow:0 0 10px rgba(16,185,129,0.6)}
      50%{box-shadow:0 0 20px rgba(16,185,129,0.9)}
    }

    /* Main grid */
    .main { max-width:1200px;margin:0 auto;padding:16px;position:relative;z-index:1; }
    .grid {
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }

    /* Cards */
    .card {
      background:var(--card-bg);
      backdrop-filter:blur(var(--card-blur));-webkit-backdrop-filter:blur(var(--card-blur));
      border:1px solid var(--card-border);
      border-radius:20px;
      padding:20px;
      transition:transform 0.3s,box-shadow 0.3s,border-color 0.3s;
      animation:fadeInUp 0.6s ease both;
    }
    .card:active { transform:scale(0.98); }
    @keyframes fadeInUp {
      from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}
    }
    .card:nth-child(1){animation-delay:0s}
    .card:nth-child(2){animation-delay:0.08s}
    .card:nth-child(3){animation-delay:0.16s}
    .card:nth-child(4){animation-delay:0.24s}
    .card:nth-child(5){animation-delay:0.32s}
    .card:nth-child(6){animation-delay:0.40s}

    .card-title {
      font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;
      color:var(--text-dim);margin-bottom:16px;
      display:flex;align-items:center;gap:8px;
    }
    .card-title .icon { font-size:1rem; }

    /* Gauge Ring */
    .gauge-wrap { display:flex;justify-content:center;align-items:center;position:relative; }
    .gauge-svg { transform:rotate(-90deg); }
    .gauge-bg { fill:none;stroke:rgba(255,255,255,0.06);stroke-linecap:round; }
    .gauge-fill { fill:none;stroke-linecap:round;transition:stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1),stroke 0.5s; }
    .gauge-center {
      position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    .gauge-value { font-size:2rem;font-weight:800;line-height:1; }
    .gauge-label { font-size:0.7rem;color:var(--text-dim);margin-top:4px;text-transform:uppercase;letter-spacing:0.05em; }

    /* Gauge row */
    .gauge-row {
      display:grid;grid-template-columns:1fr 1fr;gap:12px;
    }
    .gauge-row .gauge-wrap { flex-direction:column; }

    /* Stats list */
    .stat-list { display:flex;flex-direction:column;gap:10px; }
    .stat-item {
      display:flex;justify-content:space-between;align-items:center;
      padding:10px 14px;
      background:rgba(255,255,255,0.03);
      border-radius:12px;
      min-height:44px;
    }
    .stat-item-label { color:var(--text-dim);font-size:0.85rem; }
    .stat-item-value { font-weight:600;font-size:0.95rem; }

    /* Mini progress */
    .mini-bar { width:100%;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin-top:6px; }
    .mini-fill {
      height:100%;border-radius:3px;
      transition:width 0.8s cubic-bezier(0.4,0,0.2,1);
      background:linear-gradient(90deg,var(--purple),var(--blue));
    }

    /* Core grid */
    .cores-grid {
      display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:12px;
    }
    .core-bar {
      height:40px;border-radius:8px;background:rgba(255,255,255,0.04);
      position:relative;overflow:hidden;display:flex;align-items:flex-end;
    }
    .core-fill {
      width:100%;border-radius:8px;
      transition:height 0.6s cubic-bezier(0.4,0,0.2,1),background 0.5s;
      background:linear-gradient(0deg,var(--purple),var(--blue));
    }
    .core-label {
      position:absolute;width:100%;text-align:center;
      font-size:0.55rem;font-weight:600;color:rgba(255,255,255,0.5);
      top:2px;
    }

    /* Network live */
    .net-values {
      display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;
    }
    .net-box {
      text-align:center;padding:14px 10px;
      background:rgba(255,255,255,0.03);border-radius:14px;
    }
    .net-box .dir { font-size:0.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em; }
    .net-box .speed { font-size:1.3rem;font-weight:700;margin-top:4px; }
    .net-box.rx .speed { color:var(--green); }
    .net-box.tx .speed { color:var(--orange); }

    /* Disk items */
    .disk-item { margin-bottom:10px; }
    .disk-item:last-child { margin-bottom:0; }
    .disk-header { display:flex;justify-content:space-between;margin-bottom:4px; }
    .disk-mount { font-size:0.85rem;color:var(--text-dim); }
    .disk-pct { font-size:0.85rem;font-weight:600; }
    .disk-size { font-size:0.7rem;color:var(--text-dim);margin-top:2px; }

    /* Sparkline canvas */
    .sparkline-wrap { height:60px;margin-top:12px;position:relative; }
    .sparkline-wrap canvas { width:100%!important;height:100%!important; }

    /* Bottom nav */
    .bottom-nav {
      position:fixed;bottom:0;left:0;right:0;z-index:100;
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      background:rgba(10,10,15,0.85);
      border-top:1px solid var(--card-border);
      display:flex;justify-content:space-around;align-items:center;
      padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));
    }
    .nav-item {
      display:flex;flex-direction:column;align-items:center;gap:2px;
      padding:8px 16px;border-radius:12px;
      font-size:0.65rem;color:var(--text-dim);
      transition:color 0.2s,background 0.2s;
      cursor:pointer;min-width:56px;min-height:44px;
      justify-content:center;
    }
    .nav-item.active { color:var(--purple);background:rgba(124,58,237,0.1); }
    .nav-item .nav-icon { font-size:1.2rem; }

    /* Section visibility */
    .section { display:none; }
    .section.active { display:block; }

    /* Shimmer */
    @keyframes shimmer {
      0%{background-position:-200% 0}100%{background-position:200% 0}
    }
    .shimmer {
      background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.04) 50%,transparent 100%);
      background-size:200% 100%;
      animation:shimmer 2s infinite;
    }

    /* Temp color coding */
    .temp-cool { color:var(--blue); }
    .temp-warm { color:var(--orange); }
    .temp-hot { color:var(--red); }

    /* Responsive */
    @media (min-width:480px) {
      .main { padding:20px; }
      .gauge-value { font-size:2.2rem; }
    }
    @media (min-width:768px) {
      .grid { grid-template-columns:repeat(2,1fr);gap:20px; }
      .header h1 { font-size:1.5rem; }
      body { padding-bottom:0; }
      .bottom-nav { display:none; }
      .section { display:block!important; }
    }
    @media (min-width:1024px) {
      .grid { grid-template-columns:repeat(3,1fr); }
      .card { padding:24px; }
      .card:hover { border-color:rgba(124,58,237,0.3);box-shadow:var(--glow-purple); }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <h1>⚡ Hardware Monitor</h1>
    <div class="status-dot" id="statusDot" title="Disconnected"></div>
  </div>
</header>

<main class="main">
  <!-- Overview Section -->
  <div class="section active" id="sec-overview">
    <div class="grid">
      <!-- CPU Gauge -->
      <div class="card">
        <div class="card-title"><span class="icon">🔥</span> CPU</div>
        <div class="gauge-wrap">
          <svg class="gauge-svg" width="160" height="160" viewBox="0 0 160 160">
            <circle class="gauge-bg" cx="80" cy="80" r="68" stroke-width="12"/>
            <circle class="gauge-fill" id="cpuRing" cx="80" cy="80" r="68" stroke-width="12"
              stroke="url(#gradPurple)" stroke-dasharray="427.26" stroke-dashoffset="427.26"/>
            <defs><linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#3b82f6"/>
            </linearGradient></defs>
          </svg>
          <div class="gauge-center">
            <span class="gauge-value" id="cpuVal">0</span>
            <span class="gauge-label">CPU %</span>
          </div>
        </div>
        <div class="cores-grid" id="coresGrid"></div>
      </div>

      <!-- Memory Gauge -->
      <div class="card">
        <div class="card-title"><span class="icon">🧠</span> Memory</div>
        <div class="gauge-wrap">
          <svg class="gauge-svg" width="160" height="160" viewBox="0 0 160 160">
            <circle class="gauge-bg" cx="80" cy="80" r="68" stroke-width="12"/>
            <circle class="gauge-fill" id="memRing" cx="80" cy="80" r="68" stroke-width="12"
              stroke="url(#gradPink)" stroke-dasharray="427.26" stroke-dashoffset="427.26"/>
            <defs><linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#7c3aed"/>
            </linearGradient></defs>
          </svg>
          <div class="gauge-center">
            <span class="gauge-value" id="memVal">0</span>
            <span class="gauge-label">RAM %</span>
          </div>
        </div>
        <div class="stat-list" style="margin-top:12px">
          <div class="stat-item">
            <span class="stat-item-label">Used</span>
            <span class="stat-item-value" id="memUsed">—</span>
          </div>
          <div class="stat-item">
            <span class="stat-item-label">Total</span>
            <span class="stat-item-value" id="memTotal">—</span>
          </div>
        </div>
      </div>

      <!-- GPU -->
      <div class="card">
        <div class="card-title"><span class="icon">🎮</span> GPU</div>
        <div class="gauge-row">
          <div class="gauge-wrap">
            <svg class="gauge-svg" width="120" height="120" viewBox="0 0 120 120">
              <circle class="gauge-bg" cx="60" cy="60" r="48" stroke-width="10"/>
              <circle class="gauge-fill" id="gpuRing" cx="60" cy="60" r="48" stroke-width="10"
                stroke="url(#gradGreen)" stroke-dasharray="301.59" stroke-dashoffset="301.59"/>
              <defs><linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#3b82f6"/>
              </linearGradient></defs>
            </svg>
            <div class="gauge-center">
              <span class="gauge-value" id="gpuVal" style="font-size:1.5rem">0</span>
              <span class="gauge-label">GPU %</span>
            </div>
          </div>
          <div class="gauge-wrap">
            <svg class="gauge-svg" width="120" height="120" viewBox="0 0 120 120">
              <circle class="gauge-bg" cx="60" cy="60" r="48" stroke-width="10"/>
              <circle class="gauge-fill" id="gpuTempRing" cx="60" cy="60" r="48" stroke-width="10"
                stroke="url(#gradTemp)" stroke-dasharray="301.59" stroke-dashoffset="301.59"/>
              <defs><linearGradient id="gradTemp" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ef4444"/>
              </linearGradient></defs>
            </svg>
            <div class="gauge-center">
              <span class="gauge-value" id="gpuTempVal" style="font-size:1.5rem">—</span>
              <span class="gauge-label">°C</span>
            </div>
          </div>
        </div>
        <div class="stat-list" style="margin-top:12px">
          <div class="stat-item">
            <span class="stat-item-label">Model</span>
            <span class="stat-item-value" id="gpuModel" style="font-size:0.8rem">—</span>
          </div>
          <div class="stat-item">
            <span class="stat-item-label">VRAM</span>
            <span class="stat-item-value" id="gpuVram">—</span>
          </div>
        </div>
      </div>

      <!-- Temperatures -->
      <div class="card">
        <div class="card-title"><span class="icon">🌡️</span> Temperatures</div>
        <div class="gauge-row">
          <div class="gauge-wrap">
            <svg class="gauge-svg" width="120" height="120" viewBox="0 0 120 120">
              <circle class="gauge-bg" cx="60" cy="60" r="48" stroke-width="10"/>
              <circle class="gauge-fill" id="tempMainRing" cx="60" cy="60" r="48" stroke-width="10"
                stroke="url(#gradTemp2)" stroke-dasharray="301.59" stroke-dashoffset="301.59"/>
              <defs><linearGradient id="gradTemp2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#ef4444"/>
              </linearGradient></defs>
            </svg>
            <div class="gauge-center">
              <span class="gauge-value" id="tempMainVal" style="font-size:1.5rem">—</span>
              <span class="gauge-label">CPU °C</span>
            </div>
          </div>
          <div class="gauge-wrap">
            <svg class="gauge-svg" width="120" height="120" viewBox="0 0 120 120">
              <circle class="gauge-bg" cx="60" cy="60" r="48" stroke-width="10"/>
              <circle class="gauge-fill" id="tempMaxRing" cx="60" cy="60" r="48" stroke-width="10"
                stroke="url(#gradTemp3)" stroke-dasharray="301.59" stroke-dashoffset="301.59"/>
              <defs><linearGradient id="gradTemp3" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ef4444"/>
              </linearGradient></defs>
            </svg>
            <div class="gauge-center">
              <span class="gauge-value" id="tempMaxVal" style="font-size:1.5rem">—</span>
              <span class="gauge-label">Max °C</span>
            </div>
          </div>
        </div>
        <div id="coreTemps" class="stat-list" style="margin-top:12px"></div>
      </div>

      <!-- Network -->
      <div class="card">
        <div class="card-title"><span class="icon">🌐</span> Network</div>
        <div class="net-values">
          <div class="net-box rx">
            <div class="dir">↓ Download</div>
            <div class="speed" id="netRx">0 B/s</div>
          </div>
          <div class="net-box tx">
            <div class="dir">↑ Upload</div>
            <div class="speed" id="netTx">0 B/s</div>
          </div>
        </div>
        <div class="sparkline-wrap"><canvas id="netSparkline"></canvas></div>
      </div>

      <!-- Storage -->
      <div class="card">
        <div class="card-title"><span class="icon">💾</span> Storage</div>
        <div class="stat-list" id="diskList"></div>
      </div>
    </div>
  </div>
</main>

<nav class="bottom-nav">
  <div class="nav-item active" data-section="sec-overview">
    <span class="nav-icon">📊</span>
    <span>Overview</span>
  </div>
  <div class="nav-item" onclick="scrollToCard(0)">
    <span class="nav-icon">🔥</span>
    <span>CPU</span>
  </div>
  <div class="nav-item" onclick="scrollToCard(2)">
    <span class="nav-icon">🎮</span>
    <span>GPU</span>
  </div>
  <div class="nav-item" onclick="scrollToCard(4)">
    <span class="nav-icon">🌐</span>
    <span>Network</span>
  </div>
</nav>

<script>
  // Helpers
  const $ = id => document.getElementById(id);
  const CIRC_BIG = 2 * Math.PI * 68;   // 427.26
  const CIRC_SM  = 2 * Math.PI * 48;   // 301.59

  function setRing(el, pct, circ) {
    const offset = circ - (circ * Math.min(pct,100) / 100);
    el.style.strokeDashoffset = offset;
  }

  function fmtBytes(b) {
    if (!b || b===0) return '0 B';
    const u=['B','KB','MB','GB','TB'];
    const i=Math.floor(Math.log(b)/Math.log(1024));
    return (b/Math.pow(1024,i)).toFixed(i>1?1:0)+' '+u[i];
  }

  function tempClass(t) {
    if (!t) return '';
    if (t < 50) return 'temp-cool';
    if (t < 75) return 'temp-warm';
    return 'temp-hot';
  }

  // Sparkline data
  const sparkRx=[], sparkTx=[], SPARK_MAX=40;
  let netCanvas, netCtx;

  function drawSparkline() {
    if (!netCtx) return;
    const c=netCanvas, w=c.width, h=c.height;
    netCtx.clearRect(0,0,w,h);
    if (sparkRx.length < 2) return;
    const allVals=[...sparkRx,...sparkTx];
    const max=Math.max(...allVals,1);
    function drawLine(data,color,alpha) {
      netCtx.beginPath();
      netCtx.strokeStyle=color;
      netCtx.lineWidth=2;
      netCtx.lineJoin='round';
      data.forEach((v,i)=>{
        const x=(i/(data.length-1))*w;
        const y=h-(v/max)*h*0.9-2;
        i===0?netCtx.moveTo(x,y):netCtx.lineTo(x,y);
      });
      netCtx.stroke();
      // Fill
      netCtx.lineTo(w,h);netCtx.lineTo(0,h);netCtx.closePath();
      netCtx.fillStyle=color.replace('1)',alpha+')');
      netCtx.fill();
    }
    drawLine(sparkRx,'rgba(16,185,129,1)','0.1');
    drawLine(sparkTx,'rgba(245,158,11,1)','0.08');
  }

  // Nav scroll
  function scrollToCard(i) {
    const cards=document.querySelectorAll('.card');
    if(cards[i]) cards[i].scrollIntoView({behavior:'smooth',block:'start'});
  }

  // WebSocket
  let ws, reconTimer;
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);
    ws.onopen = () => {
      $('statusDot').classList.add('connected');
      $('statusDot').title = 'Connected';
    };
    ws.onclose = () => {
      $('statusDot').classList.remove('connected');
      $('statusDot').title = 'Disconnected';
      reconTimer = setTimeout(connect, 3000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      const s = JSON.parse(e.data);
      updateUI(s);
    };
  }

  function updateUI(s) {
    // CPU
    $('cpuVal').textContent = s.cpu.load;
    setRing($('cpuRing'), s.cpu.load, CIRC_BIG);

    // Cores
    const cg = $('coresGrid');
    if (s.cpu.cores.length && cg.children.length !== s.cpu.cores.length) {
      cg.innerHTML = s.cpu.cores.map((_,i) =>
        `<div class="core-bar"><div class="core-fill" id="core${i}" style="height:0%"></div><div class="core-label">${i}</div></div>`
      ).join('');
    }
    s.cpu.cores.forEach((v,i) => {
      const el = $('core'+i);
      if(el){
        el.style.height = v+'%';
        el.style.background = v>80?'linear-gradient(0deg,#ef4444,#f59e0b)':
                              v>50?'linear-gradient(0deg,#f59e0b,#7c3aed)':
                              'linear-gradient(0deg,#7c3aed,#3b82f6)';
      }
    });

    // Memory
    $('memVal').textContent = s.memory.percent;
    setRing($('memRing'), s.memory.percent, CIRC_BIG);
    $('memUsed').textContent = (s.memory.used/1073741824).toFixed(1)+' GB';
    $('memTotal').textContent = (s.memory.total/1073741824).toFixed(1)+' GB';

    // GPU
    if (s.gpu.length > 0) {
      const g = s.gpu[0];
      $('gpuVal').textContent = g.utilizationGpu||0;
      setRing($('gpuRing'), g.utilizationGpu||0, CIRC_SM);
      $('gpuTempVal').textContent = g.temp||'—';
      setRing($('gpuTempRing'), Math.min((g.temp||0)/100*100,100), CIRC_SM);
      $('gpuModel').textContent = g.model||'—';
      $('gpuVram').textContent = g.vram?g.vram+' MB':'—';
    }

    // Temps
    const tm=s.temps.main||0, tx=s.temps.max||0;
    $('tempMainVal').textContent = tm||'—';
    $('tempMainVal').className = 'gauge-value '+tempClass(tm);
    $('tempMainVal').style.fontSize='1.5rem';
    setRing($('tempMainRing'), Math.min(tm,100), CIRC_SM);
    $('tempMaxVal').textContent = tx||'—';
    $('tempMaxVal').className = 'gauge-value '+tempClass(tx);
    $('tempMaxVal').style.fontSize='1.5rem';
    setRing($('tempMaxRing'), Math.min(tx,100), CIRC_SM);

    // Core temps
    if (s.temps.cores && s.temps.cores.length) {
      $('coreTemps').innerHTML = s.temps.cores.slice(0,8).map((t,i) =>
        `<div class="stat-item"><span class="stat-item-label">Core ${i}</span><span class="stat-item-value ${tempClass(t)}">${t?t+'°C':'—'}</span></div>`
      ).join('');
    }

    // Network
    if (s.network.length > 0) {
      const n=s.network[0];
      $('netRx').textContent = fmtBytes(n.rx)+'/s';
      $('netTx').textContent = fmtBytes(n.tx)+'/s';
      sparkRx.push(n.rx||0); sparkTx.push(n.tx||0);
      if(sparkRx.length>SPARK_MAX){sparkRx.shift();sparkTx.shift();}
      drawSparkline();
    }

    // Disk
    $('diskList').innerHTML = s.disk.map(d => {
      const color = d.percent>90?'var(--red)':d.percent>70?'var(--orange)':'var(--blue)';
      return `<div class="disk-item">
        <div class="disk-header"><span class="disk-mount">${d.mount||d.fs}</span><span class="disk-pct" style="color:${color}">${d.percent}%</span></div>
        <div class="mini-bar"><div class="mini-fill" style="width:${d.percent}%;background:${color}"></div></div>
        <div class="disk-size">${fmtBytes(d.used)} / ${fmtBytes(d.size)}</div>
      </div>`;
    }).join('');
  }

  // Init
  window.addEventListener('DOMContentLoaded', () => {
    netCanvas = $('netSparkline');
    const dpr = window.devicePixelRatio||1;
    const rect = netCanvas.parentElement.getBoundingClientRect();
    netCanvas.width = rect.width*dpr;
    netCanvas.height = rect.height*dpr;
    netCtx = netCanvas.getContext('2d');
    netCtx.scale(dpr,dpr);
    netCanvas.style.width = rect.width+'px';
    netCanvas.style.height = rect.height+'px';
    connect();
  });
</script>
</body>
</html>
