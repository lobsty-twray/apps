<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="http://shared-assets:3000/design-tokens.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Drafts Hub</title>
  <style>
    :root {
      --bg-base: #0a0a0f;
      --bg-elevated: rgba(255,255,255,0.04);
      --bg-glass: rgba(255,255,255,0.06);
      --bg-glass-hover: rgba(255,255,255,0.10);
      --bg-glass-active: rgba(255,255,255,0.12);
      --border-glass: rgba(255,255,255,0.08);
      --border-glass-hover: rgba(255,255,255,0.15);
      --text-primary: #e8e8f0;
      --text-secondary: #888899;
      --text-tertiary: #55556a;
      --accent-glow: rgba(124,58,237,0.25);
      --accent-dim: rgba(124,58,237,0.12);
      --green-dim: rgba(52,211,153,0.12);
      --red-dim: rgba(248,113,113,0.12);
      --orange: #fb923c;
      --orange-dim: rgba(251,146,60,0.12);
      --blue: #60a5fa;
      --blue-dim: rgba(96,165,250,0.12);
      --purple: #a78bfa;
      --purple-dim: rgba(167,139,250,0.12);
      --yellow-dim: rgba(251,191,36,0.12);
      --glass-blur: 20px;
      --radius: 16px;
      --radius-xs: 6px;
      --shadow-glass: 0 8px 32px rgba(0,0,0,0.3);
      --shadow-glow: 0 0 40px rgba(124,58,237,0.08);
      --transition-fast: 0.15s cubic-bezier(0.4,0,0.2,1);
      --transition-smooth: 0.3s cubic-bezier(0.4,0,0.2,1);
      --transition-spring: 0.4s cubic-bezier(0.34,1.56,0.64,1);
}

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html { overflow-x: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(124,58,237,0.08), transparent),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(96,165,250,0.05), transparent),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(167,139,250,0.03), transparent);
      pointer-events: none;
      z-index: 0;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ─── Login ─────────────────────────── */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--bg-glass);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-glass);
      animation: fadeSlideUp 0.5s ease;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .login-card p {
      color: var(--text-secondary);
      margin-bottom: 28px;
      font-size: 14px;
    }

    .quick-login {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .quick-login button {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: var(--transition-fast);
      color: var(--text-primary);
      min-height: 44px;
      font-family: inherit;
    }

    .quick-login button:hover, .quick-login button:active {
      background: var(--bg-glass-hover);
      border-color: var(--border-glass-hover);
      transform: translateY(-1px);
    }

    .quick-login .lobsty-btn { border-color: rgba(139,92,246,0.3); }
    .quick-login .lobsty-btn:hover { border-color: rgba(139,92,246,0.5); box-shadow: 0 0 20px rgba(139,92,246,0.1); }
    .quick-login .ray-btn { border-color: rgba(59,130,246,0.3); }
    .quick-login .ray-btn:hover { border-color: rgba(59,130,246,0.5); box-shadow: 0 0 20px rgba(59,130,246,0.1); }

    .divider {
      text-align: center;
      color: var(--text-tertiary);
      font-size: 12px;
      margin: 20px 0;
      position: relative;
    }

    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border-glass);
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xs);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: var(--transition-fast);
      background: var(--bg-glass);
      color: var(--text-primary);
      min-height: 44px;
    }

    .form-group input::placeholder, .form-group textarea::placeholder {
      color: var(--text-tertiary);
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .form-group textarea { resize: vertical; min-height: 120px; }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-xs);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
      font-family: inherit;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #6558e6);
      color: white;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-primary:hover { box-shadow: 0 6px 25px var(--accent-glow); transform: translateY(-1px); }

    .btn-full { width: 100%; }

    .btn-ghost {
      background: var(--bg-glass);
      color: var(--text-secondary);
      border: 1px solid var(--border-glass);
    }

    .btn-ghost:hover { background: var(--bg-glass-hover); color: var(--text-primary); }

    .btn-green { background: rgba(52,211,153,0.15); color: var(--green); border: 1px solid rgba(52,211,153,0.2); }
    .btn-green:hover { background: rgba(52,211,153,0.25); }

    .btn-red { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
    .btn-red:hover { background: rgba(248,113,113,0.25); }

    .btn-sm { padding: 6px 14px; font-size: 13px; min-height: 36px; }

    .login-error {
      color: var(--red);
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
      padding: 10px;
      background: var(--red-dim);
      border-radius: var(--radius-xs);
    }

    /* ─── Layout ────────────────────────── */
    .app { display: none; min-height: 100vh; position: relative; z-index: 1; }

    .topbar {
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-bottom: 1px solid var(--border-glass);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-left h1 {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .topbar-left .app-badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 10px;
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 700;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 8px;
      color: var(--text-primary);
      min-width: 44px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px 4px 4px;
      border-radius: 24px;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      font-size: 13px;
      font-weight: 500;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
    }

    .logout-btn {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 13px;
      padding: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
      font-family: inherit;
    }

    .logout-btn:hover { color: var(--red); }

    .main-layout {
      display: flex;
      min-height: calc(100vh - 56px);
    }

    /* ─── Sidebar ───────────────────────── */
    .sidebar {
      width: 250px;
      background: rgba(10,10,15,0.6);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-right: 1px solid var(--border-glass);
      padding: 16px 0;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .sidebar-section {
      padding: 0 12px;
      margin-bottom: 24px;
    }

    .sidebar-section h3 {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-tertiary);
      padding: 4px 12px;
      margin-bottom: 4px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
      color: var(--text-secondary);
      transition: var(--transition-fast);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      min-height: 44px;
    }

    .sidebar-item:hover { background: var(--bg-glass-hover); color: var(--text-primary); }

    .sidebar-item.active {
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 600;
    }

    .sidebar-item .count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-tertiary);
      background: var(--bg-glass);
      padding: 2px 8px;
      border-radius: 10px;
      min-width: 22px;
      text-align: center;
      font-weight: 600;
    }

    .sidebar-item.active .count {
      background: rgba(124,58,237,0.2);
      color: var(--accent);
    }

    .sidebar-item .icon { font-size: 16px; width: 22px; text-align: center; }

    /* ─── Content ───────────────────────── */
    .content {
      flex: 1;
      padding: 24px;
      max-width: 960px;
      min-width: 0;
    }

    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .content-header h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
      padding: 10px 14px;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      font-size: 14px;
      outline: none;
      background: var(--bg-glass);
      color: var(--text-primary);
      transition: var(--transition-fast);
      min-height: 44px;
      font-family: inherit;
    }

    .search-input::placeholder { color: var(--text-tertiary); }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .filter-select {
      padding: 10px 14px;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      font-size: 13px;
      outline: none;
      background: var(--bg-glass);
      color: var(--text-secondary);
      cursor: pointer;
      min-height: 44px;
      font-family: inherit;
      transition: var(--transition-fast);
    }

    .filter-select:focus { border-color: var(--accent); }
    .filter-select option { background: #1a1a2e; color: var(--text-primary); }

    /* ─── Draft Cards ───────────────────── */
    .draft-list { display: flex; flex-direction: column; gap: 10px; }

    .draft-card {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      padding: 16px 18px;
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .draft-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.02), transparent);
      pointer-events: none;
    }

    .draft-card:hover {
      border-color: var(--border-glass-hover);
      background: var(--bg-glass-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glass);
    }

    .draft-card:active { transform: translateY(0); }

    /* Swipe container */
    .draft-card-swipe {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      margin-bottom: 0;
    }

    .swipe-actions {
      position: absolute;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 0;
      z-index: 1;
    }

    .swipe-actions-left {
      left: 0;
      padding-left: 16px;
      background: linear-gradient(90deg, rgba(52,211,153,0.3), transparent);
      border-radius: var(--radius) 0 0 var(--radius);
      width: 80px;
      justify-content: flex-start;
    }

    .swipe-actions-right {
      right: 0;
      padding-right: 16px;
      background: linear-gradient(270deg, rgba(251,146,60,0.3), transparent);
      border-radius: 0 var(--radius) var(--radius) 0;
      width: 80px;
      justify-content: flex-end;
    }

    .swipe-icon {
      font-size: 20px;
      opacity: 0.8;
    }

    .draft-card-inner {
      position: relative;
      z-index: 2;
      transition: transform 0.2s ease;
    }

    .draft-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .draft-card-title {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
      line-height: 1.4;
    }

    .draft-card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .badge-draft { background: var(--bg-glass-active); color: var(--text-secondary); }
    .badge-review { background: var(--orange-dim); color: var(--orange); }
    .badge-approved { background: var(--green-dim); color: var(--green); }
    .badge-done { background: var(--blue-dim); color: var(--blue); }
    .badge-rejected { background: var(--red-dim); color: var(--red); }

    .badge-email { background: var(--blue-dim); color: var(--blue); }
    .badge-todo { background: var(--green-dim); color: var(--green); }
    .badge-idea { background: var(--yellow-dim); color: var(--yellow); }
    .badge-note { background: var(--purple-dim); color: var(--purple); }
    .badge-script { background: var(--bg-glass-active); color: var(--text-secondary); }

    .badge-low { background: var(--bg-glass-active); color: var(--text-tertiary); }
    .badge-medium { background: var(--blue-dim); color: var(--blue); }
    .badge-high { background: var(--orange-dim); color: var(--orange); }
    .badge-urgent { background: var(--red-dim); color: var(--red); border: 1px solid rgba(248,113,113,0.2); animation: urgentPulse 2s infinite; }

    @keyframes urgentPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.2); }
      50% { box-shadow: 0 0 8px 2px rgba(248,113,113,0.15); }
    }

    .draft-card-preview {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-bottom: 10px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.5;
    }

    .draft-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .draft-card-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .tag {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .comment-count {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Type indicator line */
    .draft-card[data-type="email"] { border-left: 3px solid var(--blue); }
    .draft-card[data-type="todo"] { border-left: 3px solid var(--green); }
    .draft-card[data-type="idea"] { border-left: 3px solid var(--yellow); }
    .draft-card[data-type="note"] { border-left: 3px solid var(--purple); }
    .draft-card[data-type="script"] { border-left: 3px solid var(--text-tertiary); }

    /* ─── Empty State ───────────────────── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-tertiary);
    }

    .empty-state .icon {
      font-size: 56px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 6px; }
    .empty-state p { font-size: 14px; }

    /* ─── Modal ─────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      overflow-y: auto;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: rgba(20,20,30,0.95);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      width: 100%;
      max-width: 640px;
      box-shadow: var(--shadow-glass), var(--shadow-glow);
      animation: modalSlideIn 0.3s var(--transition-smooth);
    }

    @keyframes modalSlideIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-glass);
    }

    .modal-header h3 { font-size: 17px; font-weight: 700; }

    .modal-close {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-tertiary);
      transition: var(--transition-fast);
    }

    .modal-close:hover { color: var(--text-primary); background: var(--bg-glass-hover); }

    .modal-body { padding: 22px; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 22px;
      border-top: 1px solid var(--border-glass);
    }

    /* ─── Detail View ───────────────────── */
    .detail-view { display: none; animation: fadeSlideUp 0.3s ease; }

    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      margin-bottom: 20px;
      background: none;
      border: none;
      font-family: inherit;
      padding: 8px 0;
      min-height: 44px;

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Drafts Hub</div>
    <p>Sign in to manage drafts, ideas, and more</p>
    <div class="quick-login">
      <button class="lobsty-btn" onclick="quickLogin('lobsty', 'lobsty2026')">&#128025; Lobsty</button>
      <button class="ray-btn" onclick="quickLogin('ray', 'ray2026')">&#9889; Ray</button>
    </div>
    <div class="divider">or</div>
    <div class="login-error" id="loginError"></div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUsername" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="btn btn-primary btn-full" onclick="doLogin()" style="margin-top:12px">Sign In</button>
  </div>
</div>

<!-- App -->
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
      <h1>Drafts Hub</h1>
      <span class="app-badge">v2.0</span>
    </div>
    <div class="topbar-right">
      <div class="user-pill" id="userPill">
        <div class="avatar" id="userAvatar"></div>
        <span id="userName"></span>
      </div>
      <button class="logout-btn" onclick="logout()">&#x2716;</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <h3>Dashboard</h3>
        <button class="sidebar-item active" data-view="all" onclick="setView('all')">
          <span class="icon">&#128196;</span> All Drafts <span class="count" id="countAll">0</span>
        </button>
        <button class="sidebar-item" data-view="review" onclick="setView('review')">
          <span class="icon">&#128065;</span> Needs Review <span class="count" id="countReview">0</span>
        </button>
        <button class="sidebar-item" data-view="urgent" onclick="setView('urgent')">
          <span class="icon">&#128293;</span> Urgent <span class="count" id="countUrgent">0</span>
        </button>
      </div>
      <div class="sidebar-section">
        <h3>Status</h3>

        </button>
        <button class="sidebar-item" data-view="approved" onclick="setView('approved')">
          <span class="icon">&#10003;</span> Approved <span class="count" id="countApproved">0</span>
        </button>
        <button class="sidebar-item" data-view="done" onclick="setView('done')">
          <span class="icon">&#9989;</span> Done <span class="count" id="countDone">0</span>
        </button>
        <button class="sidebar-item" data-view="rejected" onclick="setView('rejected')">
          <span class="icon">&#10005;</span> Rejected <span class="count" id="countRejected">0</span>
        </button>
      </div>
      <div class="sidebar-section">
        <h3>Tools</h3>
        <button class="sidebar-item" data-view="templates" onclick="setView('templates')">
          <span class="icon">&#128220;</span> Templates <span class="count" id="countTemplates">0</span>
        </button>
      </div>
      <div class="sidebar-section">
        <h3>Type</h3>
        <button class="sidebar-item" data-view="type-email" onclick="setView('type-email')">
          <span class="icon">&#9993;</span> Emails
        </button>
        <button class="sidebar-item" data-view="type-todo" onclick="setView('type-todo')">
          <span class="icon">&#9744;</span> Todos
        </button>
        <button class="sidebar-item" data-view="type-idea" onclick="setView('type-idea')">
          <span class="icon">&#128161;</span> Ideas
        </button>
        <button class="sidebar-item" data-view="type-note" onclick="setView('type-note')">
          <span class="icon">&#128221;</span> Notes
        </button>
        <button class="sidebar-item" data-view="type-script" onclick="setView('type-script')">

    </aside>

    <main class="content">

        <div class="detail-section">

          <div class="history-list" id="historyList"></div>
        </div>

<div class="modal-overlay" id="draftModal">

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let token = localStorage.getItem('drafts_token');
let currentUser = null;
let currentView = 'all';
let currentDraft = null;
let editingDraftId = null;
let searchTimeout = null;
let rejectingId = null;

const API = '/api';

// ─── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

// ─── API Helpers ──────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ─── Auth ─────────────────────────────────────────────────────────────────────
async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) {
    showLoginError('Please enter username and password');
    return;
  }
  try {
    const data = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    }).then(r => r.json());
    if (data.error) throw new Error(data.error);
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('drafts_token', token);
    showApp();
  } catch (err) {
    showLoginError(err.message);
  }
}

async function quickLogin(username, password) {
  document.getElementById('loginUsername').value = username;
  document.getElementById('loginPassword').value = password;
  await doLogin();
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

function logout() {
  token = null;
  currentUser = null;
  localStorage.removeItem('drafts_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

// ─── App Init ─────────────────────────────────────────────────────────────────
async function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  if (!currentUser) {
    try {
      currentUser = await api('/auth/me');
    } catch {
      logout();
      return;
    }
  }

  document.getElementById('userName').textContent = currentUser.display_name;
  const avatar = document.getElementById('userAvatar');
  avatar.style.background = currentUser.avatar_color;
  avatar.textContent = currentUser.display_name[0].toUpperCase();

  await Promise.all([loadStats(), loadDrafts(), loadTemplateCount()]);
}

// ─── Stats ────────────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const stats = await api('/stats');
    document.getElementById('countAll').textContent = stats.total;
    document.getElementById('countReview').textContent = stats.in_review;
    document.getElementById('countUrgent').textContent = stats.urgent;
    document.getElementById('countDraft').textContent = stats.drafts;
    document.getElementById('countApproved').textContent = stats.approved;
    document.getElementById('countDone').textContent = stats.done;
    document.getElementById('countRejected').textContent = stats.rejected;
  } catch (err) {
    console.error('Stats error:', err);
  }
}

// ─── Views ────────────────────────────────────────────────────────────────────
function setView(view) {
  currentView = view;
  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === view);
  });

  const titles = {
    all: 'All Drafts', review: 'Needs Review', urgent: 'Urgent',
    draft: 'Drafts', approved: 'Approved', done: 'Done', rejected: 'Rejected',
    'type-email': 'Emails', 'type-todo': 'Todos', 'type-idea': 'Ideas',
    'type-note': 'Notes', 'type-script': 'Scripts', templates: 'Templates'
  };

  document.getElementById('viewTitle').textContent = titles[view] || 'All Drafts';
  document.getElementById('listView').style.display = 'block';
  document.getElementById('detailView').style.display = 'none';

  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');

  // Toggle search bar visibility and header button for templates view
  const searchBar = document.querySelector('.search-bar');
  const headerBtn = document.querySelector('.content-header .btn-primary');
  if (view === 'templates') {
    searchBar.style.display = 'none';
    headerBtn.textContent = '+ New Template';
    headerBtn.onclick = openCreateTemplateModal;
    loadTemplates();
  } else {
    searchBar.style.display = '';
    headerBtn.textContent = '+ New Draft';
    headerBtn.onclick = function() { openCreateModal(); };
    loadDrafts();
  }
}

// ─── Load Drafts ──────────────────────────────────────────────────────────────
async function loadDrafts() {
  const params = new URLSearchParams();
  const search = document.getElementById('searchInput').value.trim();
  const priority = document.getElementById('filterPriority').value;
  const sort = document.getElementById('filterSort').value;

  if (search) params.set('search', search);
  if (priority) params.set('priority', priority);
  params.set('sort', sort);

  if (currentView === 'review') params.set('status', 'review');
  else if (currentView === 'draft') params.set('status', 'draft');
  else if (currentView === 'approved') params.set('status', 'approved');
  else if (currentView === 'done') params.set('status', 'done');
  else if (currentView === 'rejected') params.set('status', 'rejected');
  else if (currentView === 'urgent') { params.set('priority', 'urgent'); }
  else if (currentView.startsWith('type-')) params.set('type', currentView.replace('type-', ''));

  try {
    const data = await api('/drafts?' + params.toString());
    renderDraftList(data.drafts);
  } catch (err) {
    console.error('Load drafts error:', err);
  }
}

function renderDraftList(drafts) {
  const container = document.getElementById('draftList');
  if (drafts.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">&#128196;</div>
        <h3>No drafts found</h3>
        <p>Create a new draft to get started</p>
      </div>`;
    return;
  }

  container.innerHTML = drafts.map(d => {
    const preview = d.content ? d.content.substring(0, 120) : '';
    return `
    <div class="draft-card" data-type="${d.type}" onclick="openDraft(${d.id})">
      <div class="draft-card-top">
        <div class="draft-card-title">${esc(d.title)}</div>
        <div class="draft-card-meta">
          <span class="badge badge-${d.type}">${typeIcon(d.type)} ${d.type}</span>
          <span class="badge badge-${d.status}">${statusLabel(d.status)}</span>
          ${d.priority === 'urgent' || d.priority === 'high' ? `<span class="badge badge-${d.priority}">${d.priority}</span>` : ''}
        </div>
      </div>
      ${preview ? `<div class="draft-card-preview">${esc(preview)}</div>` : ''}
      <div class="draft-card-bottom">
        <span>${esc(d.creator_name || 'Unknown')} &middot; ${timeAgo(d.created_at)}</span>
        <span>
          ${d.comment_count > 0 ? `<span class="comment-count">&#128172; ${d.comment_count}</span>` : ''}
        </span>
      </div>
      ${d.tags && d.tags.length > 0 ? `<div class="draft-card-tags">${d.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');

  // Setup swipe on mobile
  if ('ontouchstart' in window) setupSwipe();
}

// ─── Swipe Handling ───────────────────────────────────────────────────────────
function setupSwipe() {
  document.querySelectorAll('.draft-card').forEach(card => {
    let startX = 0, currentX = 0, swiping = false;

    card.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      swiping = true;
    }, { passive: true });

    card.addEventListener('touchmove', e => {
      if (!swiping) return;
      currentX = e.touches[0].clientX - startX;
      const clamped = Math.max(-60, Math.min(60, currentX));
      card.style.transform = `translateX(${clamped}px)`;
      card.style.transition = 'none';
    }, { passive: true });

    card.addEventListener('touchend', () => {
      swiping = false;
      card.style.transition = 'transform 0.3s ease';
      const id = parseInt(card.getAttribute('onclick').match(/\d+/)[0]);

      if (currentX > 50) {
        // Swipe right = advance status
        advanceStatus(id);
        showToast('Status advanced &#10003;');
      } else if (currentX < -50) {
        // Swipe left = open detail
        openDraft(id);
      }

      card.style.transform = 'translateX(0)';
      currentX = 0;
    });
  });
}

async function advanceStatus(id) {
  try {
    const draft = await api(`/drafts/${id}`);
    const nextMap = { draft: 'submit', review: 'approve', approved: 'done' };
    const action = nextMap[draft.status];
    if (action) {
      await api(`/drafts/${id}/${action}`, { method: 'POST' });
      loadDrafts();
      loadStats();
    }
  } catch (err) {
    console.error('Advance error:', err);
  }
}

// ─── Draft Detail ─────────────────────────────────────────────────────────────
async function openDraft(id) {
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';

  try {
    const [draft, comments, history] = await Promise.all([
      api(`/drafts/${id}`),
      api(`/drafts/${id}/comments`),
      api(`/drafts/${id}/history`)
    ]);

    currentDraft = draft;
    document.getElementById('detailTitle').textContent = draft.title;
    document.getElementById('detailContent').textContent = draft.content || '(No content)';

    // Status flow
    const steps = ['draft', 'review', 'approved', 'done'];
    const rejected = draft.status === 'rejected';
    document.getElementById('statusFlow').innerHTML = steps.map((s, i) => {
      const active = rejected ? false : steps.indexOf(draft.status) >= i;
      return `
        ${i > 0 ? '<span class="status-step-arrow">&#8594;</span>' : ''}
        <div class="status-step step-${s} ${active ? 'active' : ''}">${statusLabel(s)}</div>
      `;
    }).join('') + (rejected ? '<span class="status-step-arrow">&#8594;</span><div class="status-step active" style="background:var(--red-dim);color:var(--red)">Rejected</div>' : '');

    // Meta
    document.getElementById('detailMeta').innerHTML = `
      <span class="badge badge-${draft.type}">${typeIcon(draft.type)} ${draft.type}</span>
      <span class="badge badge-${draft.status}">${statusLabel(draft.status)}</span>
      <span class="badge badge-${draft.priority}">${draft.priority}</span>
      ${draft.category ? `<span class="badge badge-draft">${esc(draft.category)}</span>` : ''}
      <span style="font-size:12px;color:var(--text-tertiary)">
        by ${esc(draft.creator_name || 'Unknown')} &middot; ${timeAgo(draft.created_at)}
        ${draft.assignee_name ? ` &middot; &#8594; ${esc(draft.assignee_name)}` : ''}
      </span>
    `;

    document.getElementById('detailTags').innerHTML = (draft.tags || [])
      .map(t => `<span class="tag">${esc(t)}</span>`).join('');

    renderDetailActions(draft);
    renderComments(comments);
    renderHistory(history);
  } catch (err) {
    console.error('Open draft error:', err);
  }
}

function renderDetailActions(draft) {
  const el = document.getElementById('detailActions');
  let html = '';

  if (draft.status === 'draft') {
    html += `<button class="btn btn-primary btn-sm" onclick="submitForReview(${draft.id})">&#128065; Submit for Review</button>`;
  }
  if (draft.status === 'review') {
    html += `<button class="btn btn-green btn-sm" onclick="approveDraft(${draft.id})">&#10003; Approve</button>`;
    html += `<button class="btn btn-red btn-sm" onclick="openRejectModal(${draft.id})">&#10005; Reject</button>`;
  }
  if (draft.status === 'approved') {
    html += `<button class="btn btn-primary btn-sm" onclick="markDone(${draft.id})">&#9989; Mark Done</button>`;
  }

  html += `<button class="btn btn-ghost btn-sm" onclick="openEditModal(${draft.id})">&#9998; Edit</button>`;
  html += `<button class="btn btn-ghost btn-sm" style="color:var(--red);border-color:rgba(248,113,113,0.2)" onclick="deleteDraft(${draft.id})">&#128465; Delete</button>`;

  el.innerHTML = html;
}

function renderComments(comments) {
  const el = document.getElementById('commentList');
  if (comments.length === 0) {
    el.innerHTML = '<div style="font-size:13px;color:var(--text-tertiary);padding:10px 0">No comments yet</div>';
    return;
  }
  el.innerHTML = comments.map(c => `
    <div class="comment-item">
      <div class="avatar" style="background:${c.avatar_color}">${c.display_name[0].toUpperCase()}</div>
      <div class="comment-body">
        <span class="comment-author">${esc(c.display_name)}<span class="comment-time">${timeAgo(c.created_at)}</span></span>
        <div class="comment-text">${esc(c.content)}</div>
      </div>
    </div>
  `).join('');
}

function renderHistory(history) {
  const el = document.getElementById('historyList');
  if (history.length === 0) {
    el.innerHTML = '<div style="font-size:13px;color:var(--text-tertiary)">No history</div>';
    return;
  }
  el.innerHTML = history.map(h => `
    <div class="history-item">
      <div class="avatar" style="background:${h.avatar_color}">${h.display_name[0].toUpperCase()}</div>
      <div class="history-action">${formatAction(h)}</div>
      <div class="history-time">${timeAgo(h.created_at)}</div>
    </div>
  `).join('');
}

function formatAction(h) {
  if (h.action === 'created') return `<strong>${esc(h.display_name)}</strong> created this draft`;
  if (h.action === 'status_change') return `<strong>${esc(h.display_name)}</strong> changed status <span class="badge badge-${h.old_value}" style="font-size:10px">${statusLabel(h.old_value)}</span> &#8594; <span class="badge badge-${h.new_value}" style="font-size:10px">${statusLabel(h.new_value)}</span>`;
  if (h.action === 'title_change') return `<strong>${esc(h.display_name)}</strong> changed the title`;
  if (h.action === 'content_edit') return `<strong>${esc(h.display_name)}</strong> edited the content`;
  return `<strong>${esc(h.display_name)}</strong> ${h.action}`;
}

function closeDetail() {
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
  currentDraft = null;
  loadDrafts();
  loadStats();
}

// ─── Draft Actions ────────────────────────────────────────────────────────────
async function submitForReview(id) {
  await api(`/drafts/${id}/submit`, { method: 'POST' });
  showToast('Submitted for review');
  openDraft(id);
  loadStats();
}

async function approveDraft(id) {
  await api(`/drafts/${id}/approve`, { method: 'POST' });
  showToast('Draft approved &#10003;');
  openDraft(id);
  loadStats();
}

async function markDone(id) {
  await api(`/drafts/${id}/done`, { method: 'POST' });
  showToast('Marked as done &#9989;');
  openDraft(id);
  loadStats();
}

function openRejectModal(id) {
  rejectingId = id;
  document.getElementById('rejectReason').value = '';
  document.getElementById('rejectModal').classList.add('open');
}

function closeRejectModal() {
  rejectingId = null;
  document.getElementById('rejectModal').classList.remove('open');
}

async function confirmReject() {
  if (!rejectingId) return;
  const reason = document.getElementById('rejectReason').value.trim();
  await api(`/drafts/${rejectingId}/reject`, { method: 'POST', body: JSON.stringify({ reason }) });
  closeRejectModal();
  showToast('Draft rejected');
  openDraft(rejectingId);
  loadStats();
}

async function deleteDraft(id) {
  if (!confirm('Delete this draft permanently?')) return;
  await api(`/drafts/${id}`, { method: 'DELETE' });
  showToast('Draft deleted');
  closeDetail();
}

// ─── Comments ─────────────────────────────────────────────────────────────────
async function addComment() {
  if (!currentDraft) return;
  const input = document.getElementById('commentInput');
  const content = input.value.trim();
  if (!content) return;
  try {
    await api(`/drafts/${currentDraft.id}/comments`, { method: 'POST', body: JSON.stringify({ content }) });
    input.value = '';
    const comments = await api(`/drafts/${currentDraft.id}/comments`);
    renderComments(comments);
    showToast('Comment added');
  } catch (err) {
    console.error('Comment error:', err);
  }
}

// ─── Create/Edit Modal ───────────────────────────────────────────────────────
/* ─── Preset Draft Templates ─────────── */

function showPresetTemplates() {
  const type = document.getElementById('draftTypeInput').value;
  const container = document.getElementById('presetCardsContainer');
  const group = document.getElementById('presetTemplatesGroup');
  const templates = PRESET_DRAFT_TEMPLATES[type];
  if (!templates || templates.length === 0 || editingDraftId) { group.style.display = 'none'; return; }
  group.style.display = '';
  container.innerHTML = '<div class="preset-cards">' + templates.map((t, i) =>
    '<div class="preset-card" onclick="applyPresetTemplate(\'' + type + '\',' + i + ')">' +
      '<div class="preset-card-name">' + t.name + '</div>' +
      '<div class="preset-card-desc">' + t.desc + '</div>' +
    '</div>'
  ).join('') + '</div>';
}

function applyPresetTemplate(type, index) {
  const t = PRESET_DRAFT_TEMPLATES[type][index];
  if (!t) return;
  document.getElementById('draftTitleInput').value = t.title;
  document.getElementById('draftContentInput').value = t.content;
  document.getElementById('presetTemplatesGroup').style.display = 'none';
  showToast('Template applied \u2014 customize the placeholders');
}

function openCreateModal() {
  editingDraftId = null;
  document.getElementById('modalTitle').textContent = 'New Draft';
  document.getElementById('modalSaveBtn').textContent = 'Create Draft';
  document.getElementById('draftTitleInput').value = '';
  document.getElementById('draftTypeInput').value = 'note';
  document.getElementById('draftPriorityInput').value = 'medium';
  document.getElementById('draftCategoryInput').value = '';
  document.getElementById('draftTagsInput').value = '';
  document.getElementById('draftContentInput').value = '';
  document.getElementById('templatePickerGroup').style.display = '';
  document.getElementById('templatePicker').value = '';
  loadTemplatePicker();
  document.getElementById('draftModal').classList.add('open');
  showPresetTemplates();
}

async function openEditModal(id) {
  const draft = currentDraft || await api(`/drafts/${id}`);
  editingDraftId = id;
  document.getElementById('modalTitle').textContent = 'Edit Draft';
  document.getElementById('modalSaveBtn').textContent = 'Save Changes';
  document.getElementById('draftTitleInput').value = draft.title;
  document.getElementById('draftTypeInput').value = draft.type;
  document.getElementById('draftPriorityInput').value = draft.priority;
  document.getElementById('draftCategoryInput').value = draft.category || '';
  document.getElementById('draftTagsInput').value = (draft.tags || []).join(', ');
  document.getElementById('draftContentInput').value = draft.content || '';
  document.getElementById('templatePickerGroup').style.display = 'none';
  document.getElementById('draftModal').classList.add('open');
}

function closeModal() {
  document.getElementById('draftModal').classList.remove('open');
  editingDraftId = null;
}

async function saveDraft() {
  const title = document.getElementById('draftTitleInput').value.trim();
  const type = document.getElementById('draftTypeInput').value;
  const priority = document.getElementById('draftPriorityInput').value;
  const category = document.getElementById('draftCategoryInput').value.trim();
  const tagsRaw = document.getElementById('draftTagsInput').value.trim();
  const content = document.getElementById('draftContentInput').value;

  if (!title) { showToast('Title is required'); return; }

  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
  const body = { title, type, priority, category, tags, content };

  try {
    if (editingDraftId) {
      await api(`/drafts/${editingDraftId}`, { method: 'PUT', body: JSON.stringify(body) });
      closeModal();
      showToast('Draft updated');
      openDraft(editingDraftId);
    } else {
      const draft = await api('/drafts', { method: 'POST', body: JSON.stringify(body) });
      closeModal();
      showToast('Draft created');
      openDraft(draft.id);
    }
    loadStats();
  } catch (err) {
    showToast(err.message);
  }
}

// ─── Export ────────────────────────────────────────────────────────────────────
function exportCopy() {
  if (!currentDraft) return;
  const text = `${currentDraft.title}\n\n${currentDraft.content || ''}`;
  navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
}

function exportText() {
  if (!currentDraft) return;
  const text = `${currentDraft.title}\n\n${currentDraft.content || ''}`;
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentDraft.title.replace(/[^a-z0-9]/gi, '_')}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ─── Sidebar Toggle ───────────────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}

// ─── Search Debounce ──────────────────────────────────────────────────────────
function debounceSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(loadDrafts, 300);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function statusLabel(s) {
  const labels = { draft: 'Draft', review: 'In Review', approved: 'Approved', done: 'Done', rejected: 'Rejected' };
  return labels[s] || s;
}

function typeIcon(t) {
  const icons = { email: '&#9993;', todo: '&#9744;', idea: '&#128161;', note: '&#128221;', script: '&#128187;' };
  return icons[t] || '';
}

function timeAgo(dateStr) {
  const now = Date.now();
  const then = new Date(dateStr).getTime();
  const diff = Math.floor((now - then) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return new Date(dateStr).toLocaleDateString();
}

// ─── Templates ────────────────────────────────────────────────────────────
let allTemplates = [];
let editingTemplateId = null;
let templateCategoryFilter = '';

async function loadTemplateCount() {
  try {
    const templates = await api('/templates');
    document.getElementById('countTemplates').textContent = templates.length;
  } catch (err) { /* ignore */ }
}

async function loadTemplates() {
  try {
    const params = new URLSearchParams();
    if (templateCategoryFilter) params.set('category', templateCategoryFilter);
    allTemplates = await api('/templates?' + params.toString());
    renderTemplates();
  } catch (err) {
    console.error('Load templates error:', err);
  }
}

function renderTemplates() {
  const container = document.getElementById('draftList');
  const categories = [...new Set(allTemplates.map(t => t.category).filter(Boolean))];

  let html = '';
  html += '<div class="template-category-filter">';
  html += `<button class="template-category-chip ${templateCategoryFilter === '' ? 'active' : ''}" onclick="filterTemplateCategory('')">All</button>`;
  categories.forEach(c => {
    html += `<button class="template-category-chip ${templateCategoryFilter === c ? 'active' : ''}" onclick="filterTemplateCategory('${esc(c)}')">${esc(c)}</button>`;
  });
  html += '</div>';

  if (allTemplates.length === 0) {
    html += `
      <div class="empty-state">
        <div class="icon">&#128220;</div>
        <h3>No templates yet</h3>
        <p>Create a template to speed up draft creation</p>
      </div>`;
    container.innerHTML = html;
    return;
  }

  html += '<div class="templates-grid">';
  allTemplates.forEach(t => {
    const preview = highlightVars(esc(t.body ? t.body.substring(0, 150) : ''));
    html += `
    <div class="template-card" onclick="useTemplate(${t.id})">
      ${t.category ? `<div class="template-card-category">${esc(t.category)}</div>` : ''}
      <div class="template-card-title">${esc(t.title)}</div>
      <div class="template-card-preview">${preview}</div>
      <div class="template-card-footer">
        <span>${esc(t.creator_name || 'Unknown')} &middot; ${timeAgo(t.created_at)}</span>
        <div class="template-card-actions" onclick="event.stopPropagation()">
          <button onclick="openEditTemplateModal(${t.id})" title="Edit">&#9998;</button>
          <button class="delete-btn" onclick="deleteTemplate(${t.id})" title="Delete">&#128465;</button>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function highlightVars(text) {
  return text.replace(/\{\{([^}]+)\}\}/g, '<span class="tpl-var">{{$1}}</span>');
}

function filterTemplateCategory(cat) {
  templateCategoryFilter = cat;
  loadTemplates();
}

function useTemplate(id) {
  const tpl = allTemplates.find(t => t.id === id);
  if (!tpl) return;
  openCreateModal();
  document.getElementById('draftContentInput').value = tpl.body || '';
  document.getElementById('draftTitleInput').focus();
  showToast('Template applied — fill in the placeholders');
}

async function loadTemplatePicker() {
  try {
    const templates = await api('/templates');
    const select = document.getElementById('templatePicker');
    select.innerHTML = '<option value="">— Blank draft —</option>';
    const grouped = {};
    templates.forEach(t => {
      const cat = t.category || 'Uncategorized';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(t);
    });
    Object.keys(grouped).sort().forEach(cat => {
      const group = document.createElement('optgroup');
      group.label = cat;
      grouped[cat].forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.title;
        opt.dataset.body = t.body || '';
        group.appendChild(opt);
      });
      select.appendChild(group);
    });
  } catch (err) { /* ignore */ }
}

function applyTemplate() {
  const select = document.getElementById('templatePicker');
  const opt = select.options[select.selectedIndex];
  if (opt && opt.dataset && opt.dataset.body) {
    document.getElementById('draftContentInput').value = opt.dataset.body;
  }
}

function openCreateTemplateModal() {
  editingTemplateId = null;
  document.getElementById('templateModalTitle').textContent = 'New Template';
  document.getElementById('templateSaveBtn').textContent = 'Create Template';
  document.getElementById('templateTitleInput').value = '';
  document.getElementById('templateCategoryInput').value = '';
  document.getElementById('templateBodyInput').value = '';
  document.getElementById('templateModal').classList.add('open');
}

async function openEditTemplateModal(id) {
  try {
    const tpl = await api(`/templates/${id}`);
    editingTemplateId = id;
    document.getElementById('templateModalTitle').textContent = 'Edit Template';
    document.getElementById('templateSaveBtn').textContent = 'Save Changes';
    document.getElementById('templateTitleInput').value = tpl.title;
    document.getElementById('templateCategoryInput').value = tpl.category || '';
    document.getElementById('templateBodyInput').value = tpl.body || '';
    document.getElementById('templateModal').classList.add('open');
  } catch (err) {
    showToast('Failed to load template');
  }
}

function closeTemplateModal() {
  document.getElementById('templateModal').classList.remove('open');
  editingTemplateId = null;
}

async function saveTemplate() {
  const title = document.getElementById('templateTitleInput').value.trim();
  const category = document.getElementById('templateCategoryInput').value.trim();
  const body = document.getElementById('templateBodyInput').value;
  if (!title) { showToast('Template name is required'); return; }
  try {
    if (editingTemplateId) {
      await api(`/templates/${editingTemplateId}`, { method: 'PUT', body: JSON.stringify({ title, category, body }) });
      showToast('Template updated');
    } else {
      await api('/templates', { method: 'POST', body: JSON.stringify({ title, category, body }) });
      showToast('Template created');
    }
    closeTemplateModal();
    loadTemplates();
    loadTemplateCount();
  } catch (err) {
    showToast(err.message);
  }
}

async function deleteTemplate(id) {
  if (!confirm('Delete this template?')) return;
  try {
    await api(`/templates/${id}`, { method: 'DELETE' });
    showToast('Template deleted');
    loadTemplates();
    loadTemplateCount();
  } catch (err) {
    showToast('Failed to delete');
  }
}
