<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Studio - Tech with Ray</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      color: white;
      margin-bottom: 30px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .stat-card h3 {
      color: #667eea;
      font-size: 0.9rem;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .stat-card .value {
      font-size: 2rem;
      font-weight: bold;
      color: #333;
    }
    .video-section {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .section-header h2 {
      color: #333;
    }
    .btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
    }
    .btn:hover {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .videos-grid {
      display: grid;
      gap: 15px;
    }
    .video-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 15px;
      align-items: center;
      transition: transform 0.2s;
    }
    .video-card:hover {
      transform: translateX(5px);
      background: #e9ecef;
    }
    .status-badge {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .status-idea { background: #ffd93d; color: #333; }
    .status-scripted { background: #6bcf7f; color: white; }
    .status-filming { background: #4f98f7; color: white; }
    .status-editing { background: #f77659; color: white; }
    .status-scheduled { background: #9c27b0; color: white; }
    .status-published { background: #4caf50; color: white; }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      width: 90%;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
    }
    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .btn-secondary {
      background: #6c757d;
    }
    .btn-danger {
      background: #dc3545;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 YouTube Studio - Tech with Ray</h1>
    
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Subscribers</h3>
        <div class="value" id="stat-subs">0</div>
      </div>
      <div class="stat-card">
        <h3>Total Views</h3>
        <div class="value" id="stat-views">0</div>
      </div>
      <div class="stat-card">
        <h3>Videos</h3>
        <div class="value" id="stat-videos">0</div>
      </div>
      <div class="stat-card">
        <h3>Revenue (Est)</h3>
        <div class="value" id="stat-revenue">$0</div>
      </div>
    </div>

    <div class="video-section">
      <div class="section-header">
        <h2>Video Pipeline</h2>
        <button class="btn" onclick="openAddModal()">+ Add Video</button>
      </div>
      <div class="videos-grid" id="videos-list"></div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal" id="video-modal">
    <div class="modal-content">
      <h2 id="modal-title">Add Video</h2>
      <form id="video-form" onsubmit="saveVideo(event)">
        <input type="hidden" id="video-id">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="video-title" required>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="video-status">
            <option value="idea">Idea</option>
            <option value="scripted">Scripted</option>
            <option value="filming">Filming</option>
            <option value="editing">Editing</option>
            <option value="scheduled">Scheduled</option>
            <option value="published">Published</option>
          </select>
        </div>
        <div class="form-group">
          <label>Upload Date</label>
          <input type="date" id="video-date">
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="video-notes" rows="3"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let videos = [];

    async function loadVideos() {
      const res = await fetch("/api/videos");
      videos = await res.json();
      renderVideos();
      updateStats();
    }

    function renderVideos() {
      const list = document.getElementById("videos-list");
      list.innerHTML = videos.map(v => `
        <div class="video-card">
          <div><strong>${v.title}</strong></div>
          <div><span class="status-badge status-${v.status}">${v.status.toUpperCase()}</span></div>
          <div>${v.upload_date ? new Date(v.upload_date).toLocaleDateString() : "TBD"}</div>
          <div>${v.views ? v.views.toLocaleString() + " views" : "—"}</div>
          <div>
            <button class="btn" onclick="editVideo(${v.id})" style="padding: 8px 16px; font-size: 0.9rem;">Edit</button>
            <button class="btn btn-danger" onclick="deleteVideo(${v.id})" style="padding: 8px 16px; font-size: 0.9rem; margin-left: 5px;">Delete</button>
          </div>
        </div>
      `).join("");
    }

    function updateStats() {
      document.getElementById("stat-videos").textContent = videos.length;
      const totalViews = videos.reduce((sum, v) => sum + (v.views || 0), 0);
      document.getElementById("stat-views").textContent = totalViews.toLocaleString();
    }

    function openAddModal() {
      document.getElementById("modal-title").textContent = "Add Video";
      document.getElementById("video-form").reset();
      document.getElementById("video-id").value = "";
      document.getElementById("video-modal").classList.add("active");
    }

    function editVideo(id) {
      const video = videos.find(v => v.id === id);
      document.getElementById("modal-title").textContent = "Edit Video";
      document.getElementById("video-id").value = video.id;
      document.getElementById("video-title").value = video.title;
      document.getElementById("video-status").value = video.status;
      document.getElementById("video-date").value = video.upload_date || "";
      document.getElementById("video-notes").value = video.notes || "";
      document.getElementById("video-modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("video-modal").classList.remove("active");
    }

    async function saveVideo(e) {
      e.preventDefault();
      const id = document.getElementById("video-id").value;
      const data = {
        title: document.getElementById("video-title").value,
        status: document.getElementById("video-status").value,
        upload_date: document.getElementById("video-date").value || null,
        notes: document.getElementById("video-notes").value
      };

      if (id) {
        await fetch(`/api/videos/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
      } else {
        await fetch("/api/videos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
      }

      closeModal();
      loadVideos();
    }

    async function deleteVideo(id) {
      if (!confirm("Delete this video?")) return;
      await fetch(`/api/videos/${id}`, { method: "DELETE" });
      loadVideos();
    }

    loadVideos();
  </script>
</body>
</html>
