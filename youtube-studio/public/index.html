<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="http://shared-assets:3000/design-tokens.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YouTube Studio - Tech with Ray</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;padding-bottom:80px}
@media(min-width:768px){body{padding-bottom:20px}}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 var(--accent-glow)}50%{box-shadow:0 0 20px 4px var(--accent-glow)}}
.anim{opacity:0;animation:fadeUp .5s ease forwards}
.anim-d1{animation-delay:.05s}.anim-d2{animation-delay:.1s}.anim-d3{animation-delay:.15s}.anim-d4{animation-delay:.2s}
.anim-d5{animation-delay:.25s}.anim-d6{animation-delay:.3s}.anim-d7{animation-delay:.35s}.anim-d8{animation-delay:.4s}

.container{max-width:1200px;margin:0 auto;padding:16px 16px 0}
@media(min-width:768px){.container{padding:24px 24px 0}}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 20px;animation:fadeUp .4s ease}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 16px var(--accent-glow)}
.header h1{font-size:1.35rem;font-weight:800;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{font-size:.78rem;color:var(--text3);font-weight:500;letter-spacing:.3px}
.add-btn-desk{display:none;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:10px 20px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.add-btn-desk:hover{background:var(--accent2);box-shadow:0 0 24px var(--accent-glow)}
@media(min-width:768px){.add-btn-desk{display:flex}}

/* Search bar */
.search-wrap{position:relative;margin-bottom:20px;animation:fadeUp .45s ease}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);width:18px;height:18px;pointer-events:none}
.search-input{width:100%;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--r);padding:13px 14px 13px 42px;color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:border .2s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text3)}
.filter-row{display:flex;gap:8px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:.75rem;font-weight:600;border:1px solid var(--glass-border);background:var(--glass);color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap;min-height:36px;display:flex;align-items:center}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Tab bar top (desktop) */
.tab-bar-top{display:none;gap:4px;margin-bottom:24px;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r);padding:4px;animation:fadeUp .45s ease}
@media(min-width:768px){.tab-bar-top{display:flex}}
.tab-btn-top{flex:1;padding:10px;border:none;border-radius:12px;font-size:.85rem;font-weight:600;color:var(--text2);background:transparent;cursor:pointer;transition:all .25s}
.tab-btn-top.active{background:var(--accent);color:#fff;box-shadow:0 4px 16px var(--accent-glow)}

/* Bottom nav mobile */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,.95);backdrop-filter:blur(20px);border-top:1px solid var(--glass-border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:768px){.bottom-nav{display:none}}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;cursor:pointer;color:var(--text3);transition:color .2s;min-height:56px;justify-content:center;-webkit-tap-highlight-color:transparent}
.nav-item.active{color:var(--accent)}
.nav-item svg{width:22px;height:22px}
.nav-item span{font-size:.65rem;font-weight:600;letter-spacing:.2px}

/* Swipe container */
.tabs-container{position:relative;overflow:hidden}
.tabs-track{display:flex;transition:transform .35s cubic-bezier(.4,0,.2,1);will-change:transform}
.tab-panel{min-width:100%;flex-shrink:0}
@media(min-width:768px){.tabs-track{display:block}.tab-panel{display:none;min-width:auto}.tab-panel.active{display:block}}

/* Stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--r);padding:16px;transition:all .3s;position:relative;overflow:hidden}
.stat-card:hover{background:var(--bg-card-hover);border-color:var(--border-hover);transform:translateY(-2px)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px}
.stat-card:nth-child(1)::before{background:linear-gradient(90deg,#a78bfa,#6366f1)}
.stat-card:nth-child(2)::before{background:linear-gradient(90deg,#10b981,#059669)}
.stat-card:nth-child(3)::before{background:linear-gradient(90deg,#60a5fa,#3b82f6)}
.stat-card:nth-child(4)::before{background:linear-gradient(90deg,#f59e0b,#d97706)}
.stat-icon{font-size:1.4rem;margin-bottom:8px}
.stat-label{font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:4px}
.stat-value{font-size:1.5rem;font-weight:800;letter-spacing:-.5px}
.stat-card:nth-child(1) .stat-value{color:#a78bfa}
.stat-card:nth-child(2) .stat-value{color:var(--success)}
.stat-card:nth-child(3) .stat-value{color:#60a5fa}
.stat-card:nth-child(4) .stat-value{color:var(--warn)}
.stat-trend{display:flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;margin-top:6px}
.trend-up{color:var(--success)}.trend-down{color:var(--danger)}.trend-flat{color:var(--text3)}
.sparkline{display:flex;align-items:flex-end;gap:2px;height:24px;margin-top:8px}
.sparkline .bar{flex:1;background:rgba(255,255,255,.08);border-radius:2px;min-width:3px;transition:height .3s}
@media(min-width:480px){.stats-grid{grid-template-columns:repeat(4,1fr)}}

/* Video cards */
.video-list{display:grid;gap:14px}
.video-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--r);overflow:hidden;transition:all .3s;cursor:pointer}
.video-card:hover{background:var(--bg-card-hover);border-color:var(--border-hover);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.video-card-inner{display:flex;gap:14px;padding:14px}
.video-thumb{width:120px;height:68px;border-radius:var(--rs);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;position:relative}
.video-thumb.placeholder{background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(168,85,247,.3),rgba(236,72,153,.2))}
.video-thumb img{width:100%;height:100%;object-fit:cover}
.video-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(0,0,0,.5)}
.video-progress-bar{height:100%;border-radius:0 2px 2px 0;transition:width .3s}
.progress-idea{width:10%;background:#a78bfa}
.progress-scripted{width:30%;background:#60a5fa}
.progress-filming{width:50%;background:#f59e0b}
.progress-editing{width:70%;background:#fb923c}
.progress-scheduled{width:90%;background:#8b5cf6}
.progress-published{width:100%;background:var(--success)}
.video-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.video-title{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.73rem;color:var(--text2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-idea{background:rgba(167,139,250,.15);color:#a78bfa}
.badge-scripted{background:rgba(96,165,250,.15);color:#60a5fa}
.badge-filming{background:rgba(245,158,11,.15);color:#f59e0b}
.badge-editing{background:rgba(251,146,60,.15);color:#fb923c}
.badge-scheduled{background:rgba(139,92,246,.15);color:#8b5cf6}
.badge-published{background:rgba(16,185,129,.15);color:#10b981}
.video-actions{display:flex;gap:8px;margin-top:auto}
.video-actions button{background:rgba(255,255,255,.06);border:1px solid var(--glass-border);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:.72rem;cursor:pointer;transition:all .2s;min-height:32px;font-family:inherit}
.video-actions button:hover{background:rgba(255,255,255,.1);color:var(--text)}
.video-actions .del-btn:hover{background:rgba(239,68,68,.15);color:var(--danger);border-color:rgba(239,68,68,.3)}
@media(min-width:480px){.video-thumb{width:160px;height:90px}}

/* Channel stats */
.ch-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
@media(min-width:480px){.ch-stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.ch-stats-grid{grid-template-columns:repeat(5,1fr)}}
.ch-stat{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r);padding:16px;backdrop-filter:blur(20px)}
.ch-stat-label{font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:2px}
.ch-stat-val{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.ch-stat:nth-child(1) .ch-stat-val{color:#a78bfa}
.ch-stat:nth-child(2) .ch-stat-val{color:var(--success)}
.ch-stat:nth-child(3) .ch-stat-val{color:#60a5fa}
.ch-stat:nth-child(4) .ch-stat-val{color:var(--warn)}
.ch-stat:nth-child(5) .ch-stat-val{color:#f472b6}
.mini-spark{display:flex;align-items:flex-end;gap:1px;height:20px;margin-top:6px}
.mini-spark .dot{flex:1;min-width:2px;background:rgba(255,255,255,.1);border-radius:1px;transition:height .3s}
.ch-entries{display:grid;gap:8px;margin-top:16px}
.ch-entry{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--rs);padding:12px 14px;display:grid;grid-template-columns:1fr repeat(2,auto);gap:8px;align-items:center;font-size:.8rem}
@media(min-width:480px){.ch-entry{grid-template-columns:auto repeat(4,1fr);gap:12px}}
.ch-entry-date{font-weight:600;color:var(--accent)}
.ch-entry-val{color:var(--text2)}
.ch-entry-val b{color:var(--text);font-weight:700}

/* FAB */
.fab{position:fixed;bottom:76px;right:20px;width:56px;height:56px;background:var(--accent);border:none;border-radius:50%;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 24px var(--accent-glow);transition:all .3s;z-index:99;display:flex;align-items:center;justify-content:center;animation:pulseGlow 3s infinite}
.fab:active{transform:scale(.92)}
@media(min-width:768px){.fab{display:none}}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
@media(min-width:768px){.modal-overlay.active{align-items:center}}
.modal{background:rgba(15,15,25,.97);backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:500px;max-height:90vh;max-height:90dvh;overflow-y:auto;padding:28px 20px;animation:slideUp .35s cubic-bezier(.4,0,.2,1)}
@media(min-width:768px){.modal{border-radius:var(--r);animation:fadeUp .3s ease}}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin:0 auto 20px}
@media(min-width:768px){.modal-handle{display:none}}
.modal h2{font-size:1.15rem;font-weight:700;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.78rem;color:var(--text2);margin-bottom:6px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--glass-border);border-radius:var(--rs);padding:12px 14px;color:var(--text);font-size:.88rem;font-family:inherit;transition:border .2s;outline:none;min-height:44px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.form-group textarea{min-height:80px;resize:vertical}
.form-group select option{background:#1a1a2e;color:#fff}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{flex:1;padding:13px;border-radius:var(--rs);font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;min-height:48px;font-family:inherit}
.btn-save{background:var(--accent);color:#fff}
.btn-save:hover{background:var(--accent2);box-shadow:0 0 24px var(--accent-glow)}
.btn-cancel{background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--glass-border)!important}
.btn-cancel:hover{background:rgba(255,255,255,.1);color:var(--text)}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.6}
.empty-title{font-size:1.1rem;font-weight:700;margin-bottom:8px}
.empty-desc{color:var(--text3);font-size:.85rem;margin-bottom:24px;max-width:280px;margin-left:auto;margin-right:auto}
.empty-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:12px 24px;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;min-height:44px}
.empty-btn:hover{background:var(--accent2);box-shadow:0 0 24px var(--accent-glow)}

.loading{display:flex;justify-content:center;padding:40px}
.spinner{width:32px;height:32px;border:3px solid var(--glass-border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(15,15,25,.95);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--rs);padding:12px 24px;font-size:.85rem;z-index:300;opacity:0;transition:all .3s ease;pointer-events:none;font-weight:500}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:768px){.toast{bottom:40px}}

.section-title{font-size:1.05rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title svg{width:20px;height:20px;color:var(--accent)}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">▶</div>
      <div><h1>Tech with Ray</h1><p>YouTube Studio</p></div>
    </div>
    <button class="add-btn-desk" onclick="openVideoModal()">＋ Add Video</button>
  </div>

  <!-- Desktop tabs -->
  <div class="tab-bar-top">
    <button class="tab-btn-top active" onclick="switchTab(0)">📹 Videos</button>
    <button class="tab-btn-top" onclick="switchTab(1)">📊 Analytics</button>
    <button class="tab-btn-top" onclick="switchTab(2)">📈 Channel Stats</button>
  </div>

  <!-- Swipeable tabs -->
  <div class="tabs-container" id="tabsContainer">
    <div class="tabs-track" id="tabsTrack">

      <!-- TAB 0: Videos -->
      <div class="tab-panel active" id="panel0">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input class="search-input" id="searchInput" placeholder="Search videos..." oninput="renderVideoList()">
          <div class="filter-row" id="filterRow"></div>
        </div>
        <div id="videoList" class="video-list"><div class="loading"><div class="spinner"></div></div></div>
      </div>

      <!-- TAB 1: Analytics -->
      <div class="tab-panel" id="panel1">
        <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Video Analytics</div>
        <div id="analyticsContent"></div>
      </div>

      <!-- TAB 2: Channel Stats -->
      <div class="tab-panel" id="panel2">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
          <div class="section-title" style="margin-bottom:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Channel Stats</div>
          <button class="empty-btn" style="padding:8px 16px;font-size:.8rem" onclick="openStatsModal()">＋ Add Entry</button>
        </div>
        <div id="chStatsCards" class="ch-stats-grid"></div>
        <div id="chStatsEntries" class="ch-entries"></div>
      </div>

    </div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="onFabClick()">＋</button>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <div class="nav-item active" onclick="switchTab(0)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>
    <span>Videos</span>
  </div>
  <div class="nav-item" onclick="switchTab(1)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    <span>Analytics</span>
  </div>
  <div class="nav-item" onclick="switchTab(2)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <span>Stats</span>
  </div>
</nav>

<!-- Video Modal -->
<div class="modal-overlay" id="videoModal" onclick="if(event.target===this)closeVideoModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="vModalTitle">Add Video</h2>
    <input type="hidden" id="editId">
    <div class="form-group"><label>Title</label><input type="text" id="fTitle" placeholder="Video title..."></div>
    <div class="form-group"><label>Status</label><select id="fStatus"><option value="idea">💡 Idea</option><option value="scripted">📝 Scripted</option><option value="filming">🎥 Filming</option><option value="editing">✂️ Editing</option><option value="scheduled">📅 Scheduled</option><option value="published">🟢 Published</option></select></div>
    <div class="form-group"><label>Upload Date</label><input type="date" id="fDate"></div>
    <div class="form-group" id="viewsGroup" style="display:none"><label>Views</label><input type="number" id="fViews" placeholder="0"></div>
    <div class="form-group" id="ctrGroup" style="display:none"><label>CTR (%)</label><input type="number" step="0.1" id="fCTR" placeholder="0.0"></div>
    <div class="form-group" id="retGroup" style="display:none"><label>Retention (%)</label><input type="number" step="0.1" id="fRetention" placeholder="0.0"></div>
    <div class="form-group"><label>Notes</label><textarea id="fNotes" placeholder="Notes..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeVideoModal()">Cancel</button>
      <button class="btn-save" onclick="saveVideo()">Save</button>
    </div>
  </div>
</div>

<!-- Stats Modal -->
<div class="modal-overlay" id="statsModal" onclick="if(event.target===this)closeStatsModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Add Channel Stats</h2>
    <div class="form-group"><label>Date</label><input type="date" id="sDate"></div>
    <div class="form-group"><label>Subscribers</label><input type="number" id="sSubs" placeholder="0"></div>
    <div class="form-group"><label>Views</label><input type="number" id="sViews" placeholder="0"></div>
    <div class="form-group"><label>Watch Time (hours)</label><input type="number" step="0.1" id="sWatch" placeholder="0"></div>
    <div class="form-group"><label>Revenue ($)</label><input type="number" step="0.01" id="sRevenue" placeholder="0.00"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeStatsModal()">Cancel</button>
      <button class="btn-save" onclick="saveStats()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let videos=[],channelStats=[],currentTab=0,activeFilter='all';
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n);

// Tab switching + swipe
function switchTab(i){
  currentTab=i;
  const track=$('tabsTrack');
  if(window.innerWidth<768){
    track.style.transform=`translateX(-${i*100}%)`;
  } else {
    document.querySelectorAll('.tab-panel').forEach((p,j)=>{p.classList.toggle('active',j===i)});
  }
  document.querySelectorAll('.nav-item').forEach((n,j)=>n.classList.toggle('active',j===i));
  document.querySelectorAll('.tab-btn-top').forEach((b,j)=>b.classList.toggle('active',j===i));
  // Update FAB
  $('fab').textContent=i===2?'📊':'＋';
}

// Swipe gesture
let sx=0,sy=0,swiping=false;
$('tabsContainer').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;swiping=true},{passive:true});
$('tabsContainer').addEventListener('touchend',e=>{
  if(!swiping)return;swiping=false;
  const dx=e.changedTouches[0].clientX-sx;
  const dy=Math.abs(e.changedTouches[0].clientY-sy);
  if(Math.abs(dx)>50&&dy<100){
    if(dx<0&&currentTab<2)switchTab(currentTab+1);
    else if(dx>0&&currentTab>0)switchTab(currentTab-1);
  }
},{passive:true});

window.addEventListener('resize',()=>switchTab(currentTab));

function onFabClick(){currentTab===2?openStatsModal():openVideoModal()}

// DATA LOADING
async function loadVideos(){
  try{const r=await fetch('/api/videos');videos=await r.json();renderStats();renderVideoList();renderAnalytics()}
  catch(e){$('videoList').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Failed to load</div></div>'}
}
async function loadChannelStats(){
  try{const r=await fetch('/api/stats');channelStats=await r.json();renderChannelStats()}
  catch(e){$('chStatsCards').innerHTML='<div class="empty-state"><div class="empty-icon">📈</div><div class="empty-title">No stats yet</div></div>'}
}

// RENDER STATS
function renderStats(){
  const pub=videos.filter(v=>v.status==='published');
  const totalV=videos.reduce((s,v)=>s+(parseInt(v.views)||0),0);
  const ctrs=videos.filter(v=>v.ctr).map(v=>parseFloat(v.ctr));
  const avgC=ctrs.length?ctrs.reduce((a,b)=>a+b,0)/ctrs.length:0;
  $('statsGrid').innerHTML=[
    {icon:'🎬',label:'Total Videos',val:videos.length,color:'#a78bfa'},
    {icon:'🟢',label:'Published',val:pub.length,color:'#10b981'},
    {icon:'👁',label:'Total Views',val:fmt(totalV),color:'#60a5fa'},
    {icon:'📊',label:'Avg CTR',val:avgC.toFixed(1)+'%',color:'#f59e0b'}
  ].map((s,i)=>`<div class="stat-card anim anim-d${i+1}">
    <div class="stat-icon">${s.icon}</div>
    <div class="stat-label">${s.label}</div>
    <div class="stat-value">${s.val}</div>
  </div>`).join('');
}

// RENDER FILTER CHIPS
function renderFilters(){
  const statuses=['all','idea','scripted','filming','editing','scheduled','published'];
  const icons={all:'🔵',idea:'💡',scripted:'📝',filming:'🎥',editing:'✂️',scheduled:'📅',published:'🟢'};
  $('filterRow').innerHTML=statuses.map(s=>
    `<div class="filter-chip${activeFilter===s?' active':''}" onclick="activeFilter='${s}';renderFilters();renderVideoList()">${icons[s]} ${s==='all'?'All':s.charAt(0).toUpperCase()+s.slice(1)}</div>`
  ).join('');
}

// RENDER VIDEO LIST
function renderVideoList(){
  const q=($('searchInput').value||'').toLowerCase();
  let filtered=videos.filter(v=>{
    if(activeFilter!=='all'&&v.status!==activeFilter)return false;
    if(q&&!v.title.toLowerCase().includes(q))return false;
    return true;
  });
  const sorted=[...filtered].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(!sorted.length){
    const isFiltered=q||activeFilter!=='all';
    $('videoList').innerHTML=`<div class="empty-state"><div class="empty-icon">${isFiltered?'🔍':'🎬'}</div><div class="empty-title">${isFiltered?'No matches':'No videos yet'}</div><div class="empty-desc">${isFiltered?'Try a different search or filter':'Start tracking your YouTube content pipeline'}</div>${isFiltered?'':`<button class="empty-btn" onclick="openVideoModal()">＋ Add First Video</button>`}</div>`;
    return;
  }
  $('videoList').innerHTML=sorted.map((v,i)=>`
    <div class="video-card anim anim-d${Math.min(i+1,8)}">
      <div class="video-card-inner">
        <div class="video-thumb ${v.thumbnail_url?'':'placeholder'}">
          ${v.thumbnail_url?`<img src="${esc(v.thumbnail_url)}" alt="">`:
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>'}
          <div class="video-progress"><div class="video-progress-bar progress-${v.status}"></div></div>
        </div>
        <div class="video-info">
          <div class="video-title">${esc(v.title)}</div>
          <div class="video-meta">
            <span class="badge badge-${v.status}">${v.status}</span>
            ${v.upload_date?`<span>📅 ${new Date(v.upload_date).toLocaleDateString()}</span>`:''}
            ${v.views?`<span>👁 ${parseInt(v.views).toLocaleString()}</span>`:''}
            ${v.ctr?`<span>📊 ${v.ctr}%</span>`:''}
          </div>
          <div class="video-actions">
            <button onclick="editVideo(${v.id});event.stopPropagation()">✏️ Edit</button>
            <button class="del-btn" onclick="deleteVideo(${v.id});event.stopPropagation()">🗑 Delete</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

// RENDER ANALYTICS
function renderAnalytics(){
  const pub=videos.filter(v=>v.status==='published'&&v.views);
  if(!pub.length){
    $('analyticsContent').innerHTML='<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No analytics yet</div><div class="empty-desc">Publish videos and add view/CTR data to see analytics</div></div>';
    return;
  }
  const sorted=[...pub].sort((a,b)=>(parseInt(b.views)||0)-(parseInt(a.views)||0));
  $('analyticsContent').innerHTML=`
    <div class="stats-grid" style="margin-bottom:20px">
      <div class="stat-card"><div class="stat-icon">🏆</div><div class="stat-label">Top Video</div><div class="stat-value" style="font-size:1rem;color:#a78bfa">${esc(sorted[0].title).substring(0,20)}</div></div>
      <div class="stat-card"><div class="stat-icon">👁</div><div class="stat-label">Best Views</div><div class="stat-value" style="color:#10b981">${fmt(parseInt(sorted[0].views))}</div></div>
      <div class="stat-card"><div class="stat-icon">📊</div><div class="stat-label">Best CTR</div><div class="stat-value" style="color:#60a5fa">${pub.reduce((b,v)=>Math.max(b,parseFloat(v.ctr)||0),0).toFixed(1)}%</div></div>
      <div class="stat-card"><div class="stat-icon">⏱</div><div class="stat-label">Best Retention</div><div class="stat-value" style="color:#f59e0b">${pub.reduce((b,v)=>Math.max(b,parseFloat(v.retention)||0),0).toFixed(1)}%</div></div>
    </div>
    <div class="section-title" style="margin-top:8px">Performance Rankings</div>
    <div class="video-list">${sorted.map((v,i)=>`
      <div class="video-card anim anim-d${Math.min(i+1,8)}"><div class="video-card-inner">
        <div style="width:40px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;color:${i===0?'#fbbf24':i===1?'#94a3b8':i===2?'#cd7f32':'var(--text3)'}">#${i+1}</div>
        <div class="video-info">
          <div class="video-title">${esc(v.title)}</div>
          <div class="video-meta">
            <span>👁 ${parseInt(v.views).toLocaleString()}</span>
            ${v.ctr?`<span>📊 CTR ${v.ctr}%</span>`:''}
            ${v.retention?`<span>⏱ Ret ${v.retention}%</span>`:''}
          </div>
        </div>
      </div></div>`).join('')}</div>`;
}

// RENDER CHANNEL STATS
function renderChannelStats(){
  if(!channelStats.length){
    $('chStatsCards').innerHTML='';
    $('chStatsEntries').innerHTML='<div class="empty-state"><div class="empty-icon">📈</div><div class="empty-title">No channel stats</div><div class="empty-desc">Add daily stats to track your channel growth</div></div>';
    return;
  }
  const sorted=[...channelStats].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const latest=sorted[0];
  const prev=sorted[1]||{};
  const trendIcon=(a,b)=>!b?'—':a>b?'↑':'↓';
  const trendClass=(a,b)=>!b?'trend-flat':a>b?'trend-up':'trend-down';

  function miniSparkHTML(field){
    const vals=sorted.slice(0,14).reverse().map(s=>parseFloat(s[field])||0);
    const max=Math.max(...vals,1);
    return `<div class="mini-spark">${vals.map(v=>`<div class="dot" style="height:${Math.max(8,(v/max)*100)}%"></div>`).join('')}</div>`;
  }

  $('chStatsCards').innerHTML=[
    {label:'Subscribers',val:fmt(latest.subscribers||0),field:'subscribers'},
    {label:'Views',val:fmt(latest.views||0),field:'views'},
    {label:'Watch Time',val:(latest.watch_time_hours||0)+'h',field:'watch_time_hours'},
    {label:'Revenue',val:'$'+(parseFloat(latest.revenue)||0).toFixed(2),field:'revenue'},
    {label:'Entries',val:sorted.length,field:null}
  ].map((s,i)=>`<div class="ch-stat anim anim-d${i+1}">
    <div class="ch-stat-label">${s.label}</div>
    <div class="ch-stat-val">${s.val}</div>
    ${s.field?`<div class="stat-trend ${trendClass(latest[s.field],prev[s.field])}">${trendIcon(latest[s.field],prev[s.field])} vs prev</div>${miniSparkHTML(s.field)}`:''}
  </div>`).join('');

  $('chStatsEntries').innerHTML=`<div class="section-title" style="margin-top:8px">Recent Entries</div>`+
    sorted.slice(0,15).map((s,i)=>`<div class="ch-entry anim anim-d${Math.min(i+1,8)}">
      <div class="ch-entry-date">${new Date(s.date).toLocaleDateString()}</div>
      <div class="ch-entry-val"><b>${fmt(s.subscribers||0)}</b> subs</div>
      <div class="ch-entry-val"><b>${fmt(s.views||0)}</b> views</div>
      ${window.innerWidth>=480?`<div class="ch-entry-val"><b>${s.watch_time_hours||0}</b>h watch</div><div class="ch-entry-val"><b>$${(parseFloat(s.revenue)||0).toFixed(2)}</b></div>`:''}
    </div>`).join('');
}

// MODALS
function openVideoModal(v){
  $('vModalTitle').textContent=v?'Edit Video':'Add Video';
  $('editId').value=v?v.id:'';
  $('fTitle').value=v?v.title:'';
  $('fStatus').value=v?v.status:'idea';
  $('fDate').value=v&&v.upload_date?v.upload_date.split('T')[0]:'';
  $('fViews').value=v?v.views||'':'';
  $('fCTR').value=v?v.ctr||'':'';
  $('fRetention').value=v?v.retention||'':'';
  $('fNotes').value=v?v.notes||'':'';
  const isEdit=!!v;
  ['viewsGroup','ctrGroup','retGroup'].forEach(g=>$(g).style.display=isEdit?'block':'none');
  $('videoModal').classList.add('active');
}
function closeVideoModal(){$('videoModal').classList.remove('active')}
function openStatsModal(){
  $('sDate').value=new Date().toISOString().split('T')[0];
  $('sSubs').value='';$('sViews').value='';$('sWatch').value='';$('sRevenue').value='';
  $('statsModal').classList.add('active');
}
function closeStatsModal(){$('statsModal').classList.remove('active')}

function editVideo(id){const v=videos.find(x=>x.id===id);if(v)openVideoModal(v)}

async function saveVideo(){
  const id=$('editId').value;
  const body={title:$('fTitle').value,status:$('fStatus').value,upload_date:$('fDate').value||null,notes:$('fNotes').value};
  if(id){body.views=$('fViews').value||0;body.ctr=$('fCTR').value||0;body.retention=$('fRetention').value||0}
  if(!body.title){toast('Title is required');return}
  try{
    await fetch(id?`/api/videos/${id}`:'/api/videos',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    closeVideoModal();toast(id?'✅ Video updated':'✅ Video added');loadVideos();
  }catch(e){toast('❌ Error saving')}
}

async function saveStats(){
  const body={date:$('sDate').value,subscribers:parseInt($('sSubs').value)||0,views:parseInt($('sViews').value)||0,watch_time_hours:parseFloat($('sWatch').value)||0,revenue:parseFloat($('sRevenue').value)||0};
  if(!body.date){toast('Date is required');return}
  try{
    await fetch('/api/stats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    closeStatsModal();toast('✅ Stats saved');loadChannelStats();
  }catch(e){toast('❌ Error saving stats')}
}

async function deleteVideo(id){
  if(!confirm('Delete this video?'))return;
  try{await fetch(`/api/videos/${id}`,{method:'DELETE'});toast('🗑 Video deleted');loadVideos()}catch(e){toast('❌ Error deleting')}
}

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

// Init
renderFilters();
loadVideos();
loadChannelStats();
</script>
</body>
