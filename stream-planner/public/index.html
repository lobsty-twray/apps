<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Planner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-value {
            font-size: 2.2em;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            font-size: 0.9em;
        }
        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        input, select, textarea {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .stream-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .stream-card {
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            background: #f8f9fa;
        }
        .stream-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #667eea;
            margin-bottom: 10px;
        }
        .stream-time {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .platforms-list {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.85em;
        }
        .platform-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .status-scheduled {
            background: #e3f2fd;
            color: #1976d2;
        }
        .status-live {
            background: #ffebee;
            color: #c62828;
        }
        .status-completed {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .no-data {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            grid-column: 1/-1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 Stream Planner</h1>
            <p>Schedule streams across Twitch, YouTube & Discord</p>
        </header>

        <div class="stats" id="stats"></div>

        <div class="section">
            <h2>Schedule New Stream</h2>
            <div class="form-grid">
                <input type="text" id="title" placeholder="Stream Title" required>
                <input type="datetime-local" id="scheduledTime" required>
                <input type="number" id="duration" placeholder="Duration (min)">
                <input type="text" id="game" placeholder="Game Title">
                <input type="text" id="category" placeholder="Category">
                <input type="number" id="expectedViewers" placeholder="Expected Viewers">
            </div>
            <textarea id="description" placeholder="Stream description..." style="margin-bottom: 10px;"></textarea>
            <textarea id="notes" placeholder="Notes..." style="margin-bottom: 10px;"></textarea>
            <button class="btn" onclick="createStream()">Schedule Stream</button>
        </div>

        <div class="section">
            <h2>Upcoming Streams</h2>
            <div class="stream-list" id="streamsList"></div>
        </div>
    </div>

    <script>
        const API = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadStreams();
            document.getElementById('scheduledTime').valueAsDate = new Date();
        });

        async function loadStats() {
            try {
                const res = await fetch(`${API}/api/stats`);
                const stats = await res.json();
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_streams}</div>
                        <div class="stat-label">Total Streams</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.upcoming}</div>
                        <div class="stat-label">Upcoming</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.completed}</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.avg_viewers}</div>
                        <div class="stat-label">Avg Viewers</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.platforms}</div>
                        <div class="stat-label">Platforms</div>
                    </div>
                `;
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function loadStreams() {
            try {
                const res = await fetch(`${API}/api/upcoming`);
                const streams = await res.json();

                if (streams.length === 0) {
                    document.getElementById('streamsList').innerHTML = '<div class="no-data">No upcoming streams scheduled</div>';
                    return;
                }

                const html = streams.map(s => `
                    <div class="stream-card">
                        <div class="stream-title">${s.title}</div>
                        <div class="stream-time">📅 ${new Date(s.scheduled_time).toLocaleString()}</div>
                        <span class="status-badge status-${s.status}">${s.status.toUpperCase()}</span>
                        ${s.duration_minutes ? `<div style="margin-top: 8px; color: #666;">⏱️ ${s.duration_minutes} minutes</div>` : ''}
                        ${s.game ? `<div style="color: #666;">🎮 ${s.game}</div>` : ''}
                        ${s.expected_viewers ? `<div style="color: #666;">👥 ~${s.expected_viewers} viewers</div>` : ''}
                        <div class="platforms-list">
                            <span class="platform-badge">🎥 Twitch</span>
                            <span class="platform-badge">📺 YouTube</span>
                        </div>
                    </div>
                `).join('');

                document.getElementById('streamsList').innerHTML = html;
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function createStream() {
            const title = document.getElementById('title').value.trim();
            const scheduledTime = document.getElementById('scheduledTime').value;
            
            if (!title || !scheduledTime) {
                alert('Title and time required');
                return;
            }

            const data = {
                title,
                description: document.getElementById('description').value || null,
                scheduled_time: scheduledTime,
                duration_minutes: document.getElementById('duration').value ? parseInt(document.getElementById('duration').value) : null,
                game: document.getElementById('game').value || null,
                category: document.getElementById('category').value || null,
                expected_viewers: document.getElementById('expectedViewers').value ? parseInt(document.getElementById('expectedViewers').value) : null,
                notes: document.getElementById('notes').value || null,
                status: 'scheduled'
            };

            try {
                await fetch(`${API}/api/streams`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                document.getElementById('title').value = '';
                document.getElementById('description').value = '';
                document.getElementById('notes').value = '';
                loadStreams();
                loadStats();
            } catch (err) {
                console.error('Error:', err);
                alert('Failed to schedule stream');
            }
        }
    </script>
</body>
</html>
