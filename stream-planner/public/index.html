<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="http://shared-assets:3000/design-tokens.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stream Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;color:#e8e8f0;font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:80px}
        @media(min-width:769px){body{padding-bottom:20px}}

        /* Scrollbar */
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(124,58,237,.4);border-radius:3px}

        .container{max-width:1400px;margin:0 auto;padding:16px}
        @media(min-width:769px){.container{padding:24px 32px}}

        /* Header */
        header{text-align:center;padding:24px 0 16px}
        header h1{font-size:1.8em;font-weight:800;background:linear-gradient(135deg,#7c3aed,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        header p{color:#888899;font-size:.9em;margin-top:4px}

        /* Countdown */
        .countdown-bar{background:rgba(255,255,255,.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 20px;margin-bottom:20px;text-align:center;display:none}
        .countdown-bar .label{font-size:.75em;color:#888899;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
        .countdown-bar .title{font-size:.95em;font-weight:600;margin-bottom:6px}
        .countdown-bar .timer{font-size:1.4em;font-weight:700;background:linear-gradient(135deg,#7c3aed,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-variant-numeric:tabular-nums}

        /* Stats */
        .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
        @media(min-width:600px){.stats{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:900px){.stats{grid-template-columns:repeat(5,1fr)}}
        .stat-card{background:rgba(255,255,255,.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px 16px;text-align:center;transition:transform .2s,border-color .2s}
        .stat-card:hover{transform:translateY(-2px);border-color:rgba(124,58,237,.3)}
        .stat-value{font-size:2em;font-weight:800;background:linear-gradient(135deg,#7c3aed,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .stat-label{color:#888899;font-size:.75em;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

        /* View tabs (desktop) */
        .view-tabs{display:none;gap:8px;margin-bottom:20px}
        @media(min-width:769px){.view-tabs{display:flex}}
        .view-tab{padding:10px 20px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:#888899;cursor:pointer;font-size:.85em;font-weight:600;transition:all .2s;min-height:44px;display:flex;align-items:center}
        .view-tab.active{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border-color:transparent}

        /* Stream grid */
        .stream-grid{display:grid;grid-template-columns:1fr;gap:16px}
        @media(min-width:600px){.stream-grid{grid-template-columns:repeat(2,1fr)}}
        @media(min-width:1024px){.stream-grid{grid-template-columns:repeat(3,1fr)}}

        /* Stream card */
        .stream-card{background:rgba(255,255,255,.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;opacity:0;transform:translateY(20px);animation:cardIn .4s ease forwards;position:relative;transition:transform .2s,border-color .2s}
        .stream-card:hover{transform:translateY(-3px);border-color:rgba(124,58,237,.3)}
        @keyframes cardIn{to{opacity:1;transform:translateY(0)}}
        .stream-card:nth-child(1){animation-delay:.05s}
        .stream-card:nth-child(2){animation-delay:.1s}
        .stream-card:nth-child(3){animation-delay:.15s}
        .stream-card:nth-child(4){animation-delay:.2s}
        .stream-card:nth-child(5){animation-delay:.25s}
        .stream-card:nth-child(6){animation-delay:.3s}
        .stream-card:nth-child(7){animation-delay:.35s}
        .stream-card:nth-child(8){animation-delay:.4s}
        .stream-card:nth-child(9){animation-delay:.45s}

        .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
        .card-title{font-size:1.05em;font-weight:700;line-height:1.3;flex:1;margin-right:8px}
        .card-meta{display:flex;flex-direction:column;gap:6px;font-size:.85em;color:#888899}
        .card-meta span{display:flex;align-items:center;gap:6px}
        .card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}

        /* Status badges */
        .badge{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:.75em;font-weight:600;letter-spacing:.3px;white-space:nowrap}
        .badge-scheduled{background:rgba(37,99,235,.15);color:#60a5fa;box-shadow:0 0 12px rgba(37,99,235,.2)}
        .badge-live{background:rgba(239,68,68,.15);color:#f87171;animation:pulse 1.5s ease-in-out infinite}
        .badge-completed{background:rgba(34,197,94,.15);color:#4ade80}
        @keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(239,68,68,.3)}50%{box-shadow:0 0 20px rgba(239,68,68,.6)}}

        /* Bottom nav (mobile) */
        .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08);z-index:100;padding:4px 0 env(safe-area-inset-bottom,4px)}
        @media(min-width:769px){.bottom-nav{display:none}}
        .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;color:#666;font-size:.65em;font-weight:600;cursor:pointer;transition:color .2s;gap:4px;-webkit-tap-highlight-color:transparent}
        .nav-item.active{color:#7c3aed}
        .nav-item .icon{font-size:1.5em}

        /* FAB */
        .fab{display:flex;position:fixed;bottom:72px;right:16px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;align-items:center;justify-content:center;font-size:1.8em;box-shadow:0 4px 20px rgba(124,58,237,.4);cursor:pointer;z-index:99;border:none;transition:transform .2s;-webkit-tap-highlight-color:transparent}
        .fab:active{transform:scale(.9)}
        @media(min-width:769px){.fab{display:none}}

        /* Modal overlay */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center}
        .modal-overlay.open{display:flex}
        @media(min-width:769px){.modal-overlay{align-items:center}}

        /* Modal / Side panel */
        .modal{background:#12121a;border:1px solid rgba(255,255,255,.08);border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:24px;animation:slideUp .3s ease}
        @media(min-width:769px){.modal{border-radius:20px;max-width:500px;animation:fadeScale .3s ease}}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        @keyframes fadeScale{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

        /* Desktop side panel */
        .side-panel{display:none}
        @media(min-width:769px){
            .side-panel{display:block;background:rgba(255,255,255,.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px;position:sticky;top:24px}
            .main-layout{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
        }

        .modal-handle{width:40px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 16px}
        @media(min-width:769px){.modal-handle{display:none}}
        .modal h2,.side-panel h2{font-size:1.1em;font-weight:700;margin-bottom:16px;background:linear-gradient(135deg,#7c3aed,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

        /* Form inputs */
        .form-group{margin-bottom:14px}
        .form-group label{display:block;font-size:.75em;color:#888899;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#e8e8f0;font-family:'Inter',sans-serif;font-size:.9em;transition:border-color .2s,box-shadow .2s;min-height:44px}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#7c3aed;box-shadow:0 0 16px rgba(124,58,237,.2)}
        .form-group textarea{resize:vertical;min-height:70px}
        .form-group select option{background:#1a1a2e;color:#e8e8f0}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

        .btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-family:'Inter',sans-serif;font-size:.95em;font-weight:700;cursor:pointer;transition:opacity .2s,transform .1s;min-height:48px}
        .btn-primary:active{transform:scale(.98)}
        .btn-primary:hover{opacity:.9}

        .btn-secondary{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#e8e8f0;padding:10px 18px;border-radius:10px;font-family:'Inter',sans-serif;font-size:.85em;cursor:pointer;min-height:44px}

        .no-data{text-align:center;color:#555;padding:60px 20px;grid-column:1/-1;font-size:.95em}

        /* Edit mode inline */
        .card-actions{display:flex;gap:6px;margin-top:10px}
        .card-actions button{padding:6px 14px;border-radius:8px;border:none;font-size:.8em;font-weight:600;cursor:pointer;min-height:36px;font-family:'Inter',sans-serif}
        .btn-edit{background:rgba(124,58,237,.15);color:#a78bfa}
        .btn-done{background:rgba(34,197,94,.15);color:#4ade80}
        .btn-cancel{background:rgba(255,255,255,.05);color:#888899}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 Stream Planner</h1>
            <p>Schedule & manage your streams</p>
        </header>

        <div class="countdown-bar" id="countdown">
            <div class="label">Next Stream In</div>
            <div class="title" id="countdownTitle"></div>
            <div class="timer" id="countdownTimer"></div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="view-tabs">
            <div class="view-tab active" data-view="upcoming">🔴 Upcoming</div>
            <div class="view-tab" data-view="all">📋 All Streams</div>
        </div>

        <div class="main-layout">
            <div>
                <div class="stream-grid" id="streamGrid"></div>
            </div>
            <div class="side-panel" id="sidePanel">
                <h2>➕ Schedule Stream</h2>
                <div id="sidePanelForm"></div>
            </div>
        </div>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-view="upcoming"><span class="icon">🔴</span>Upcoming</div>
        <div class="nav-item" data-view="all"><span class="icon">📋</span>All</div>
        <div class="nav-item" data-view="add" id="navAdd"><span class="icon">➕</span>Add New</div>
    </nav>

    <!-- FAB -->
    <button class="fab" id="fab">+</button>

    <!-- Mobile modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-handle"></div>
            <h2>➕ Schedule Stream</h2>
            <div id="modalForm"></div>
        </div>
    </div>

    <script>
        const API = '';
        let allStreams = [];
        let currentView = 'upcoming';
        let countdownInterval;

        // Form HTML template
        function formHTML(prefix) {
            return `
                <div class="form-group"><label>Title *</label><input type="text" id="${prefix}Title" placeholder="Stream title"></div>
                <div class="form-row">
                    <div class="form-group"><label>Date & Time *</label><input type="datetime-local" id="${prefix}Time"></div>
                    <div class="form-group"><label>Duration (min)</label><input type="number" id="${prefix}Duration" placeholder="120"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>🎮 Game</label><input type="text" id="${prefix}Game" placeholder="Game title"></div>
                    <div class="form-group"><label>Category</label><input type="text" id="${prefix}Category" placeholder="e.g. Just Chatting"></div>
                </div>
                <div class="form-group"><label>Expected Viewers</label><input type="number" id="${prefix}Viewers" placeholder="0"></div>
                <div class="form-group"><label>Description</label><textarea id="${prefix}Desc" placeholder="What's the plan?"></textarea></div>
                <div class="form-group"><label>Notes</label><textarea id="${prefix}Notes" placeholder="Internal notes..."></textarea></div>
                <button class="btn-primary" onclick="createStream('${prefix}')">🚀 Schedule Stream</button>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('sidePanelForm').innerHTML = formHTML('sp');
            document.getElementById('modalForm').innerHTML = formHTML('md');
            loadStats();
            loadStreams();

            // Set default time
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            ['spTime','mdTime'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.value = now.toISOString().slice(0,16);
            });
        });

        // View switching
        document.querySelectorAll('.view-tab, .nav-item').forEach(el => {
            el.addEventListener('click', () => {
                const view = el.dataset.view;
                if (view === 'add') { openModal(); return; }
                currentView = view;
                document.querySelectorAll('.view-tab, .nav-item').forEach(t => t.classList.toggle('active',t.dataset.view===view));
                renderStreams();
            });
        });

        // Modal
        document.getElementById('fab').addEventListener('click', openModal);
        document.getElementById('modalOverlay').addEventListener('click', e => {
            if(e.target === e.currentTarget) closeModal();
        });

        function openModal() {
            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('navAdd').classList.add('active');
        }
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            document.getElementById('navAdd').classList.remove('active');
        }

        async function loadStats() {
            try {
                const stats = await (await fetch(`${API}/api/stats`)).json();
                document.getElementById('stats').innerHTML = [
                    ['📊', stats.total_streams, 'Total'],
                    ['🔴', stats.upcoming, 'Upcoming'],
                    ['✅', stats.completed, 'Completed'],
                    ['👥', stats.avg_viewers, 'Avg Viewers'],
                    ['📡', stats.platforms, 'Platforms']
                ].map(([icon,val,label]) => `
                    <div class="stat-card">
                        <div class="stat-value">${val}</div>
                        <div class="stat-label">${icon} ${label}</div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        async function loadStreams() {
            try {
                allStreams = await (await fetch(`${API}/api/streams`)).json();
                renderStreams();
                updateCountdown();
            } catch(e) { console.error(e); }
        }

        function renderStreams() {
            let streams = [...allStreams];
            if (currentView === 'upcoming') {
                streams = streams.filter(s => s.status === 'scheduled' || s.status === 'live');
                streams.sort((a,b) => new Date(a.scheduled_time) - new Date(b.scheduled_time));
            } else {
                streams.sort((a,b) => new Date(b.scheduled_time) - new Date(a.scheduled_time));
            }

            const grid = document.getElementById('streamGrid');
            if (!streams.length) {
                grid.innerHTML = `<div class="no-data">${currentView==='upcoming'?'No upcoming streams — schedule one!':'No streams yet'}</div>`;
                return;
            }

            grid.innerHTML = streams.map(s => {
                const d = new Date(s.scheduled_time);
                const timeStr = d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
                return `
                <div class="stream-card">
                    <div class="card-header">
                        <div class="card-title">${esc(s.title)}</div>
                        <span class="badge badge-${s.status}">${s.status.toUpperCase()}</span>
                    </div>
                    <div class="card-meta">
                        ${s.game ? `<span>🎮 ${esc(s.game)}</span>` : ''}
                        <span>📅 ${timeStr}</span>
                        ${s.duration_minutes ? `<span>⏱️ ${s.duration_minutes} min</span>` : ''}
                        ${s.expected_viewers ? `<span>👥 ~${s.expected_viewers} viewers</span>` : ''}
                    </div>
                    <div class="card-footer">
                        <div class="card-actions">
                            ${s.status==='scheduled'?`<button class="btn-edit" onclick="updateStatus(${s.id},'live')">🔴 Go Live</button>`:''}
                            ${s.status==='live'?`<button class="btn-done" onclick="updateStatus(${s.id},'completed')">✅ End</button>`:''}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function esc(s) { if(!s)return''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

        async function updateStatus(id, status) {
            try {
                await fetch(`${API}/api/streams/${id}`, {
                    method:'PUT', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({status})
                });
                loadStreams(); loadStats();
            } catch(e) { console.error(e); }
        }

        async function createStream(prefix) {
            const title = document.getElementById(`${prefix}Title`).value.trim();
            const time = document.getElementById(`${prefix}Time`).value;
            if(!title||!time){alert('Title and time required');return;}

            const data = {
                title,
                scheduled_time: time,
                duration_minutes: parseInt(document.getElementById(`${prefix}Duration`).value)||null,
                game: document.getElementById(`${prefix}Game`).value||null,
                category: document.getElementById(`${prefix}Category`).value||null,
                expected_viewers: parseInt(document.getElementById(`${prefix}Viewers`).value)||null,
                description: document.getElementById(`${prefix}Desc`).value||null,
                notes: document.getElementById(`${prefix}Notes`).value||null,
                status: 'scheduled'
            };

            try {
                await fetch(`${API}/api/streams`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
                // Clear form
                ['Title','Time','Duration','Game','Category','Viewers','Desc','Notes'].forEach(f=>{
                    const el=document.getElementById(`${prefix}${f}`);if(el)el.value='';
                });
                closeModal();
                loadStreams(); loadStats();
            } catch(e){console.error(e);alert('Failed to schedule');}
        }

        // Countdown
        function updateCountdown() {
            clearInterval(countdownInterval);
            const upcoming = allStreams.filter(s=>s.status==='scheduled').sort((a,b)=>new Date(a.scheduled_time)-new Date(b.scheduled_time));
            const bar = document.getElementById('countdown');
            if(!upcoming.length){bar.style.display='none';return;}

            const next = upcoming[0];
            document.getElementById('countdownTitle').textContent = next.title;
            bar.style.display = 'block';

            function tick() {
                const diff = new Date(next.scheduled_time) - new Date();
                if(diff<=0){document.getElementById('countdownTimer').textContent='🔴 LIVE NOW';return;}
                const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
                document.getElementById('countdownTimer').textContent = (d?d+'d ':'') + h+'h '+m+'m '+s+'s';
            }
            tick();
            countdownInterval = setInterval(tick, 1000);
        }
    </script>
</body>
</html>
