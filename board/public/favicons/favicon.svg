<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Column 1 (tall - 3 cards) -->
  <rect x="68" y="80" width="110" height="352" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <rect x="80" y="120" width="86" height="44" rx="8" fill="url(#accent)" opacity="0.9"/>
  <rect x="80" y="176" width="86" height="44" rx="8" fill="url(#card)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="80" y="232" width="86" height="44" rx="8" fill="url(#card)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Column dot 1 -->
  <circle cx="123" cy="96" r="5" fill="#94a3b8"/>
  <!-- Column 2 (medium - 2 cards) -->
  <rect x="200" y="80" width="110" height="352" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <rect x="212" y="120" width="86" height="44" rx="8" fill="url(#card)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="212" y="176" width="86" height="44" rx="8" fill="url(#accent)" opacity="0.7"/>
  <!-- Column dot 2 -->
  <circle cx="255" cy="96" r="5" fill="#fbbf24"/>
  <!-- Column 3 (short - 1 card) -->
  <rect x="332" y="80" width="110" height="352" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <rect x="344" y="120" width="86" height="44" rx="8" fill="url(#card)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Column dot 3 -->
  <circle cx="387" cy="96" r="5" fill="#34d399"/>
</svg>
