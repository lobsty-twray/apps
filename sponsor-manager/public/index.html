<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsor Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #f5576c;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            color: #f5576c;
            margin-bottom: 20px;
            border-bottom: 2px solid #f5576c;
            padding-bottom: 10px;
        }

        .deal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .deal-card {
            border: 2px solid #f5576c;
            border-radius: 10px;
            padding: 20px;
            background: #fff5f7;
        }

        .deal-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .deal-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }

        .deal-company {
            color: #f5576c;
            font-size: 0.9em;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .deal-amount {
            font-size: 1.8em;
            color: #f5576c;
            font-weight: bold;
            margin: 15px 0;
        }

        .deal-dates {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .deliverable-list {
            background: white;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
        }

        .deliverable-item {
            padding: 8px;
            margin-bottom: 8px;
            background: #f9f9f9;
            border-left: 3px solid #f5576c;
            font-size: 0.9em;
        }

        .btn {
            background: #f5576c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #e64353;
            transform: translateY(-2px);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #f5576c;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Sponsor Manager</h1>
            <p>Track deals, deliverables, and payments</p>
        </header>

        <div class="stats" id="stats"></div>

        <div class="section">
            <h2>Active Deals</h2>
            <button class="btn" onclick="openNewDealModal()">+ New Deal</button>
            <div class="deal-grid" id="dealsList"></div>
        </div>
    </div>

    <div class="modal" id="dealModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>New Deal</h2>
                <button class="close-btn" onclick="closeDealModal()">✕</button>
            </div>
            <form id="dealForm">
                <div class="form-group">
                    <label>Sponsor</label>
                    <select id="sponsorId" required onchange="loadOrCreateSponsor()">
                        <option value="">Select or create new...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Company Name (if new)</label>
                    <input type="text" id="newCompanyName" placeholder="Company Name">
                </div>
                <div class="form-group">
                    <label>Deal Title</label>
                    <input type="text" id="dealTitle" required>
                </div>
                <div class="form-group">
                    <label>Type (e.g., Sponsorship, Partnership)</label>
                    <input type="text" id="dealType">
                </div>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" id="dealAmount" step="0.01">
                </div>
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="endDate">
                </div>
                <button type="submit" class="btn">Save Deal</button>
            </form>
        </div>
    </div>

    <script>
        const API = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadDeals();
            loadSponsors();
        });

        async function loadStats() {
            try {
                const res = await fetch(`${API}/api/stats`);
                const stats = await res.json();
                
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.active_deals}</div>
                        <div class="stat-label">Active Deals</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.pending_deliverables}</div>
                        <div class="stat-label">Pending Deliverables</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">$${stats.total_revenue.toLocaleString()}</div>
                        <div class="stat-label">Total Revenue</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_sponsors}</div>
                        <div class="stat-label">Sponsors</div>
                    </div>
                `;
            } catch (err) {
                console.error('Error loading stats:', err);
            }
        }

        async function loadSponsors() {
            try {
                const res = await fetch(`${API}/api/sponsors`);
                const sponsors = await res.json();
                
                const select = document.getElementById('sponsorId');
                sponsors.forEach(s => {
                    const option = document.createElement('option');
                    option.value = s.id;
                    option.textContent = s.company_name;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function loadDeals() {
            try {
                const res = await fetch(`${API}/api/deals`);
                const deals = await res.json();
                
                const html = deals.map(d => `
                    <div class="deal-card">
                        <div class="deal-header">
                            <div>
                                <div class="deal-title">${d.title}</div>
                                <div class="deal-company">${d.company_name}</div>
                            </div>
                            <span class="status-badge status-${d.status}">${d.status}</span>
                        </div>
                        <div class="deal-amount">$${d.amount || 0}</div>
                        <div class="deal-dates">
                            ${d.start_date ? new Date(d.start_date).toLocaleDateString() : 'TBD'} - 
                            ${d.end_date ? new Date(d.end_date).toLocaleDateString() : 'TBD'}
                        </div>
                        <p style="color: #666; font-size: 0.9em; margin-bottom: 10px;">${d.description || 'No description'}</p>
                    </div>
                `).join('');
                
                document.getElementById('dealsList').innerHTML = html || '<p style="grid-column: 1/-1; text-align: center; color: #999;">No deals yet</p>';
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function openNewDealModal() {
            document.getElementById('dealForm').reset();
            document.getElementById('dealModal').classList.add('active');
        }

        function closeDealModal() {
            document.getElementById('dealModal').classList.remove('active');
        }

        document.getElementById('dealForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let sponsorId = document.getElementById('sponsorId').value;
            const newCompany = document.getElementById('newCompanyName').value;
            
            if (!sponsorId && newCompany) {
                try {
                    const res = await fetch(`${API}/api/sponsors`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ company_name: newCompany })
                    });
                    const sponsor = await res.json();
                    sponsorId = sponsor.id;
                } catch (err) {
                    alert('Failed to create sponsor');
                    return;
                }
            }
            
            const data = {
                sponsor_id: sponsorId,
                title: document.getElementById('dealTitle').value,
                deal_type: document.getElementById('dealType').value,
                amount: document.getElementById('dealAmount').value,
                start_date: document.getElementById('startDate').value,
                end_date: document.getElementById('endDate').value,
                status: 'pending'
            };
            
            try {
                await fetch(`${API}/api/deals`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                closeDealModal();
                loadDeals();
                loadStats();
                loadSponsors();
            } catch (err) {
                console.error('Error:', err);
                alert('Failed to save deal');
            }
        });
    </script>
</body>
</html>
