name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd ~/apps
          git pull origin main

      - name: Build and deploy
        run: |
          cd ~/apps
          docker compose up --build -d docs
          docker image prune -f
