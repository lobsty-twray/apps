<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo - twray.dev</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; }
  .container { max-width: 500px; width: 100%; }
  h1 { font-size: 2rem; margin-bottom: 24px; color: #fff; }
  .input-row { display: flex; gap: 8px; margin-bottom: 24px; }
  input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 1rem; outline: none; }
  input[type="text"]:focus { border-color: #646cff; }
  button { padding: 12px 20px; border: none; border-radius: 8px; background: #646cff; color: #fff; font-size: 1rem; cursor: pointer; }
  button:hover { background: #535bf2; }
  .todo-list { list-style: none; }
  .todo-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #1a1a1a; border-radius: 8px; margin-bottom: 8px; }
  .todo-item.done .todo-text { text-decoration: line-through; opacity: 0.5; }
  .todo-text { flex: 1; font-size: 1rem; }
  .todo-check { width: 20px; height: 20px; cursor: pointer; accent-color: #646cff; }
  .todo-delete { background: none; border: none; color: #666; font-size: 1.2rem; cursor: pointer; padding: 4px 8px; }
  .todo-delete:hover { color: #ff4444; }
  .empty { text-align: center; color: #555; padding: 40px; }
</style>
</head>
<body>
<div class="container">
  <h1>📝 Todo</h1>
  <div class="input-row">
    <input type="text" id="input" placeholder="Add a task..." autofocus>
    <button onclick="addTodo()">Add</button>
  </div>
  <ul class="todo-list" id="list"></ul>
  <div class="empty" id="empty">No tasks yet. Add one above!</div>
</div>
<script>
  let todos = JSON.parse(localStorage.getItem('todos') || '[]');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const input = document.getElementById('input');
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
  function save() { localStorage.setItem('todos', JSON.stringify(todos)); }
  function render() {
    list.innerHTML = '';
    empty.style.display = todos.length ? 'none' : 'block';
    todos.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (t.done ? ' done' : '');
      li.innerHTML = '<input type="checkbox" class="todo-check" '+(t.done?'checked':'')+' onchange="toggle('+i+')"><span class="todo-text">'+esc(t.text)+'</span><button class="todo-delete" onclick="remove('+i+')">✕</button>';
      list.appendChild(li);
    });
  }
  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function addTodo() { const v = input.value.trim(); if (!v) return; todos.unshift({text: v, done: false}); input.value = ''; save(); render(); }
  function toggle(i) { todos[i].done = !todos[i].done; save(); render(); }
  function remove(i) { todos.splice(i, 1); save(); render(); }
  render();
</script>
</body>
</html>
