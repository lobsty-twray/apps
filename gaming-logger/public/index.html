<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Session Logger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat-label {
            color: #aaa;
            font-size: 0.85em;
        }
        .section {
            background: rgba(255,255,255,0.05);
            border: 1px solid #00d4ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        h2 {
            color: #00d4ff;
            margin-bottom: 15px;
        }
        .btn {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #00b8cc;
            transform: translateY(-2px);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        input, select, textarea {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid #00d4ff;
            color: #eee;
            padding: 10px;
            border-radius: 5px;
            font-family: inherit;
        }
        input::placeholder, textarea::placeholder {
            color: #888;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        .session-item {
            background: rgba(0,212,255,0.05);
            border-left: 4px solid #00ff88;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .session-item:hover {
            background: rgba(0,212,255,0.1);
            border-left-color: #00d4ff;
        }
        .session-title {
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 5px;
        }
        .session-meta {
            font-size: 0.85em;
            color: #aaa;
        }
        .content-potential-high {
            color: #00ff88;
            font-weight: bold;
        }
        .no-data {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Gaming Session Logger</h1>
            <p style="color: #aaa;">Track your gaming sessions and extract content ideas</p>
        </header>

        <div class="stats" id="stats"></div>

        <div class="section">
            <h2>Log New Session</h2>
            <div class="form-grid">
                <input type="text" id="gameName" placeholder="Game Title" required>
                <input type="text" id="platform" placeholder="Platform (PC/Console)">
                <input type="datetime-local" id="startTime" required>
                <input type="datetime-local" id="endTime">
                <input type="text" id="difficulty" placeholder="Difficulty">
                <input type="number" id="achievementScore" placeholder="Achievement Score">
                <input type="number" id="fps" placeholder="Avg FPS">
                <input type="number" id="gpuTemp" placeholder="GPU Temp (°C)">
                <input type="number" id="cpuTemp" placeholder="CPU Temp (°C)">
                <select id="contentPotential">
                    <option value="">Content Potential</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High 🎥</option>
                </select>
            </div>
            <textarea id="notes" placeholder="Session notes..." style="margin-bottom: 10px;"></textarea>
            <label style="display: flex; align-items: center; gap: 10px; color: #aaa;">
                <input type="checkbox" id="isStreamed"> Streamed/Recorded
            </label>
            <button class="btn" onclick="logSession()" style="margin-top: 10px;">Log Session</button>
        </div>

        <div class="section">
            <h2>Recent Sessions</h2>
            <div id="sessionsList" class="no-data">Loading...</div>
        </div>
    </div>

    <script>
        const API = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadSessions();
            document.getElementById('startTime').valueAsDate = new Date();
        });

        async function loadStats() {
            try {
                const res = await fetch(`${API}/api/stats`);
                const stats = await res.json();
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_sessions}</div>
                        <div class="stat-label">Sessions</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${Math.round(stats.total_minutes / 60)}</div>
                        <div class="stat-label">Hours Played</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.favorite_game}</div>
                        <div class="stat-label">Favorite</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.avg_fps}</div>
                        <div class="stat-label">Avg FPS</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.high_content_potential}</div>
                        <div class="stat-label">Video Ideas</div>
                    </div>
                `;
            } catch (err) {
                console.error('Error loading stats:', err);
            }
        }

        async function loadSessions() {
            try {
                const res = await fetch(`${API}/api/sessions`);
                const sessions = await res.json();

                if (sessions.length === 0) {
                    document.getElementById('sessionsList').innerHTML = '<div class="no-data">No sessions logged yet</div>';
                    return;
                }

                const html = sessions.slice(0, 15).map(s => `
                    <div class="session-item">
                        <div class="session-title">
                            ${s.game_name}
                            ${s.is_streamed ? '🔴 STREAMED' : ''}
                            ${s.content_potential === 'high' ? '<span class="content-potential-high">📹 HIGH POTENTIAL</span>' : ''}
                        </div>
                        <div class="session-meta">
                            ${new Date(s.start_time).toLocaleString()} • ${s.duration_minutes} min
                            ${s.platform ? '• ' + s.platform : ''}
                            ${s.fps ? '• ' + s.fps + ' FPS' : ''}
                        </div>
                    </div>
                `).join('');

                document.getElementById('sessionsList').innerHTML = html;
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function logSession() {
            const gameName = document.getElementById('gameName').value.trim();
            if (!gameName) {
                alert('Game name required');
                return;
            }

            const data = {
                game_name: gameName,
                platform: document.getElementById('platform').value || null,
                start_time: document.getElementById('startTime').value,
                end_time: document.getElementById('endTime').value || null,
                difficulty: document.getElementById('difficulty').value || null,
                achievement_score: document.getElementById('achievementScore').value || null,
                fps: document.getElementById('fps').value ? parseInt(document.getElementById('fps').value) : null,
                gpu_temp: document.getElementById('gpuTemp').value ? parseInt(document.getElementById('gpuTemp').value) : null,
                cpu_temp: document.getElementById('cpuTemp').value ? parseInt(document.getElementById('cpuTemp').value) : null,
                notes: document.getElementById('notes').value || null,
                is_streamed: document.getElementById('isStreamed').checked,
                content_potential: document.getElementById('contentPotential').value || null
            };

            try {
                await fetch(`${API}/api/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                document.getElementById('gameName').value = '';
                document.getElementById('notes').value = '';
                loadSessions();
                loadStats();
            } catch (err) {
                console.error('Error:', err);
                alert('Failed to log session');
            }
        }
    </script>
</body>
</html>
