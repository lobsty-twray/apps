server {
    listen 80;
    server_name buildwithray.dev;
    root /usr/share/nginx/html/buildwithray;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve robots.txt and sitemap.xml
    location = /robots.txt { try_files /robots.txt =404; }
    location = /sitemap.xml { try_files /sitemap.xml =404; add_header Content-Type "application/xml"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/contact {
        proxy_pass http://lobsty-form-api:3000/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
