<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="http://shared-assets:3000/design-tokens.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Benchmark Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root {
  --border:rgba(255,255,255,0.08);--text:#e8e8f0;--text-dim:#888899;--text-bright:#e8e8f0;
  --purple:#7c3aed;--blue:#2563eb;--cyan:#06b6d4;--green:#10b981;--amber:#f59e0b;--red:#ef4444;
  --glow-purple:0 0 30px rgba(124,58,237,0.3);--glow-blue:0 0 30px rgba(59,130,246,0.3);
  --radius:16px;--radius-sm:10px;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;overflow-x:hidden;padding-bottom:80px}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 20% 0%,rgba(124,58,237,0.12) 0%,transparent 60%),
  radial-gradient(ellipse at 80% 100%,rgba(59,130,246,0.08) 0%,transparent 60%);
  pointer-events:none;z-index:0}

.container{max-width:1200px;margin:0 auto;padding:16px;position:relative;z-index:1}

/* Header */
.header{text-align:center;padding:24px 0 20px}
.header h1{font-size:1.75rem;font-weight:800;
  background:linear-gradient(135deg,#c084fc,#7c3aed,#3b82f6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-0.02em}
.header p{color:var(--text-dim);font-size:0.85rem;margin-top:4px}

/* Glass card */
.glass{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);border-radius:var(--radius);
  transition:all 0.3s ease}
.glass:hover{border-color:rgba(255,255,255,0.15)}

/* Stats row */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.stat{padding:20px 16px;text-align:center;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--purple),var(--blue));opacity:0;transition:opacity 0.3s}
.stat:hover::before{opacity:1}
.stat-value{font-size:2rem;font-weight:800;color:var(--text-bright);line-height:1;
  margin-bottom:4px}
.stat-value.purple{background:linear-gradient(135deg,#c084fc,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-value.blue{background:linear-gradient(135deg,#60a5fa,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-value.cyan{background:linear-gradient(135deg,#22d3ee,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-value.green{background:linear-gradient(135deg,#34d399,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:0.75rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;font-weight:600}

/* Section */
.section{margin-bottom:20px;padding:20px;animation:fadeUp 0.5s ease both}
.section-title{font-size:1.1rem;font-weight:700;color:var(--text-bright);margin-bottom:16px;
  display:flex;align-items:center;gap:8px}
.section-title span{font-size:1.2rem}

/* Top tests bar chart */
.bar-chart{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;flex-direction:column;gap:4px}
.bar-label{display:flex;justify-content:space-between;font-size:0.8rem}
.bar-label-name{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.bar-label-val{color:var(--text-bright);font-weight:700;font-variant-numeric:tabular-nums}
.bar-track{height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(0.22,1,0.36,1);width:0}

/* Benchmark cards */
.bench-card{padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.bench-card::after{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--purple),var(--blue));border-radius:0 2px 2px 0}
.bench-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.bench-name{font-weight:600;font-size:0.95rem;color:var(--text-bright);padding-right:12px}
.bench-score{font-size:1.6rem;font-weight:800;line-height:1;flex-shrink:0;
  background:linear-gradient(135deg,#34d399,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.bench-meta{display:flex;flex-wrap:wrap;gap:6px}
.bench-tag{font-size:0.7rem;padding:4px 8px;border-radius:6px;
  background:rgba(255,255,255,0.05);color:var(--text-dim);font-weight:500}
.bench-tag b{color:var(--text);font-weight:600}
.bench-notes{margin-top:8px;font-size:0.8rem;color:var(--text-dim);font-style:italic}
.bench-date{font-size:0.7rem;color:var(--text-dim);margin-top:6px}

/* Form */
.form-section{padding:20px}
.form-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
.input-wrap{position:relative}
.input-wrap input,.input-wrap textarea,.input-wrap select{
  width:100%;padding:14px 16px;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);
  font-size:0.9rem;font-family:inherit;transition:all 0.2s;min-height:48px}
.input-wrap input:focus,.input-wrap textarea:focus{outline:none;
  border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,0.15)}
.input-wrap textarea{min-height:60px;resize:vertical}
.input-wrap input::placeholder,.input-wrap textarea::placeholder{color:var(--text-dim)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn-primary{width:100%;padding:16px;border:none;border-radius:var(--radius-sm);
  font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,var(--purple),var(--blue));color:white;
  transition:all 0.3s;min-height:52px;position:relative;overflow:hidden}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--glow-purple)}
.btn-primary:active{transform:translateY(0)}
.btn-primary.loading{pointer-events:none;opacity:0.7}

/* Chart */
.chart-wrap{position:relative;height:280px;margin-top:8px}

/* Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(10,10,15,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--glass-border);display:flex;padding:8px 0;
  padding-bottom:max(8px,env(safe-area-inset-bottom))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px;border:none;background:none;color:var(--text-dim);
  font-size:0.65rem;font-family:inherit;cursor:pointer;transition:color 0.2s;
  -webkit-tap-highlight-color:transparent;min-height:44px;justify-content:center}
.nav-btn.active{color:var(--purple)}
.nav-btn svg{width:22px;height:22px}
.nav-btn:active{color:var(--purple)}

/* Views */
.view{display:none;animation:fadeUp 0.3s ease both}
.view.active{display:block}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.shimmer{background:linear-gradient(90deg,transparent 25%,rgba(255,255,255,0.04) 50%,transparent 75%);
  background-size:200% 100%;animation:shimmer 2s infinite}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--text-dim)}
.empty-icon{font-size:2.5rem;margin-bottom:8px}
.empty-text{font-size:0.9rem}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

/* Tablet+ */
@media(min-width:480px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .form-grid{grid-template-columns:1fr 1fr}
}
@media(min-width:768px){
  .container{padding:24px}
  .header h1{font-size:2.2rem}
  .form-grid{grid-template-columns:repeat(3,1fr)}
  .chart-wrap{height:350px}
  .bench-card{padding:20px}
}
@media(min-width:1024px){
  .bottom-nav{display:none}
  body{padding-bottom:0}
  .desktop-nav{display:flex !important;gap:8px;justify-content:center;margin-bottom:24px}
  .desk-btn{padding:10px 20px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);color:var(--text-dim);font-size:0.85rem;font-weight:500;
    cursor:pointer;transition:all 0.2s;font-family:inherit}
  .desk-btn.active{background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(59,130,246,0.2));
    border-color:var(--purple);color:var(--text-bright)}
  .desk-btn:hover{border-color:rgba(255,255,255,0.2);color:var(--text)}
  .stats{grid-template-columns:repeat(4,1fr)}
  .form-grid{grid-template-columns:repeat(4,1fr)}
}
.desktop-nav{display:none}

/* Filter */
.filter-bar{display:flex;gap:8px;margin-bottom:16px}
.filter-bar input{flex:1;padding:12px 16px;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);
  font-size:0.85rem;font-family:inherit;min-height:44px}
.filter-bar input:focus{outline:none;border-color:var(--purple)}
.filter-bar input::placeholder{color:var(--text-dim)}

/* Series cards */
.series-card{padding:16px;margin-bottom:10px}
.series-name{font-weight:600;color:var(--text-bright);font-size:0.95rem;margin-bottom:8px}
.series-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.series-stat-val{font-size:1.1rem;font-weight:700;color:var(--text-bright)}
.series-stat-lbl{font-size:0.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚡ Benchmark Tracker</h1>
    <p>Performance metrics &amp; analysis</p>
  </div>

  <div class="desktop-nav" id="desktopNav"></div>

  <!-- Dashboard View -->
  <div class="view active" id="viewDashboard">
    <div class="stats" id="statsGrid">
      <div class="glass stat shimmer" style="height:88px"></div>
      <div class="glass stat shimmer" style="height:88px"></div>
      <div class="glass stat shimmer" style="height:88px"></div>
      <div class="glass stat shimmer" style="height:88px"></div>
    </div>
    <div class="glass section" id="topTestsSection">
      <div class="section-title"><span>🏆</span> Top Benchmarks</div>
      <div class="bar-chart" id="topTests"></div>
    </div>
    <div class="glass section">
      <div class="section-title"><span>📊</span> Score Trends</div>
      <div class="chart-wrap"><canvas id="scoreChart"></canvas></div>
    </div>
  </div>

  <!-- Results View -->
  <div class="view" id="viewResults">
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="🔍 Search benchmarks...">
    </div>
    <div id="benchmarksList"></div>
  </div>

  <!-- Series View -->
  <div class="view" id="viewSeries">
    <div id="seriesList"></div>
  </div>

  <!-- Add View -->
  <div class="view" id="viewAdd">
    <div class="glass form-section">
      <div class="section-title"><span>➕</span> New Benchmark</div>
      <div class="form-grid">
        <div class="input-wrap"><input type="text" id="testName" placeholder="Test Name *"></div>
        <div class="input-wrap"><input type="number" id="score" placeholder="Score *"></div>
        <div class="input-wrap"><input type="text" id="gpuModel" placeholder="GPU Model"></div>
        <div class="input-wrap"><input type="number" id="gpuMemory" placeholder="GPU Memory (GB)"></div>
        <div class="input-wrap"><input type="text" id="cpuModel" placeholder="CPU Model"></div>
        <div class="input-wrap"><input type="number" id="ramGB" placeholder="RAM (GB)"></div>
        <div class="input-wrap"><input type="text" id="driverVersion" placeholder="Driver Version"></div>
        <div class="input-wrap"><input type="text" id="software" placeholder="Software / Tool"></div>
        <div class="form-row">
          <div class="input-wrap"><input type="number" id="fps" placeholder="FPS"></div>
          <div class="input-wrap"><input type="number" id="powerUsage" placeholder="Power (W)"></div>
        </div>
        <div class="input-wrap"><input type="number" id="temperature" placeholder="Temp (°C)"></div>
      </div>
      <div class="input-wrap" style="margin-bottom:14px">
        <textarea id="notes" placeholder="Notes (optional)" rows="2"></textarea>
      </div>
      <button class="btn-primary" id="submitBtn" onclick="addBenchmark()">
        Save Benchmark
      </button>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-view="viewDashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Dashboard
  </button>
  <button class="nav-btn" data-view="viewResults">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
    Results
  </button>
  <button class="nav-btn" data-view="viewSeries">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
    Series
  </button>
  <button class="nav-btn" data-view="viewAdd">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
    Add
  </button>
</nav>

<script>
const API='';
let scoreChart=null, allBenchmarks=[];

// Navigation
const views=document.querySelectorAll('.view');
const navBtns=document.querySelectorAll('.nav-btn');
function switchView(id){
  views.forEach(v=>v.classList.remove('active'));
  navBtns.forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  navBtns.forEach(b=>{if(b.dataset.view===id)b.classList.add('active')});
  // Desktop nav
  document.querySelectorAll('.desk-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.view===id)});
}
navBtns.forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));

// Desktop nav
(function(){
  const dn=document.getElementById('desktopNav');
  ['Dashboard:viewDashboard','Results:viewResults','Series:viewSeries','Add:viewAdd'].forEach(x=>{
    const[label,view]=x.split(':');
    const btn=document.createElement('button');
    btn.className='desk-btn'+(view==='viewDashboard'?' active':'');
    btn.dataset.view=view;btn.textContent=label;
    btn.onclick=()=>switchView(view);
    dn.appendChild(btn);
  });
})();

// Count-up animation
function animateValue(el,end,duration=800){
  const start=0;const startTime=performance.now();
  const fmt=end%1!==0;
  function update(now){
    const p=Math.min((now-startTime)/duration,1);
    const eased=1-Math.pow(1-p,3);
    const val=start+eased*(end-start);
    el.textContent=fmt?val.toFixed(1):Math.round(val).toLocaleString();
    if(p<1)requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// Load stats
async function loadStats(){
  try{
    const res=await fetch(API+'/api/stats');
    const s=await res.json();
    const colors=['purple','blue','cyan','green'];
    let cards=[
      {v:s.total_benchmarks,l:'Benchmarks',c:colors[0]},
      {v:s.total_series,l:'Test Series',c:colors[1]}
    ];
    if(s.top_tests&&s.top_tests.length>0){
      cards.push({v:parseFloat(s.top_tests[0].avg_score).toFixed(1),l:'Top Avg Score',c:colors[2]});
      cards.push({v:s.top_tests.reduce((a,t)=>a+parseInt(t.runs),0),l:'Total Runs',c:colors[3]});
    }
    const grid=document.getElementById('statsGrid');
    grid.innerHTML=cards.map((c,i)=>`
      <div class="glass stat" style="animation:fadeUp 0.4s ${i*0.1}s ease both">
        <div class="stat-value ${c.c}" data-val="${c.v}">0</div>
        <div class="stat-label">${c.l}</div>
      </div>`).join('');
    grid.querySelectorAll('.stat-value').forEach(el=>{
      const v=parseFloat(el.dataset.val);
      if(!isNaN(v))setTimeout(()=>animateValue(el,v),200);
    });
    // Bar chart
    if(s.top_tests&&s.top_tests.length>0){
      const max=Math.max(...s.top_tests.map(t=>parseFloat(t.avg_score)));
      const grad=['#7c3aed','#6d28d9','#3b82f6','#06b6d4','#10b981'];
      document.getElementById('topTests').innerHTML=s.top_tests.map((t,i)=>{
        const pct=(parseFloat(t.avg_score)/max*100).toFixed(1);
        return`<div class="bar-row">
          <div class="bar-label"><span class="bar-label-name">${t.test_name}</span>
          <span class="bar-label-val">${parseFloat(t.avg_score).toFixed(0)} avg · ${t.runs} runs</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:0;background:${grad[i%grad.length]}" data-w="${pct}%"></div></div>
        </div>`;
      }).join('');
      setTimeout(()=>{
        document.querySelectorAll('.bar-fill').forEach(b=>b.style.width=b.dataset.w);
      },100);
    }else{
      document.getElementById('topTests').innerHTML='<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">No data yet</div></div>';
    }
  }catch(e){console.error(e)}
}

// Load benchmarks
async function loadBenchmarks(){
  try{
    const res=await fetch(API+'/api/benchmarks');
    allBenchmarks=await res.json();
    renderBenchmarks(allBenchmarks);
    updateChart(allBenchmarks);
  }catch(e){console.error(e)}
}

function renderBenchmarks(list){
  const el=document.getElementById('benchmarksList');
  if(!list.length){el.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">No benchmarks found</div></div>';return}
  el.innerHTML=list.slice(0,20).map((b,i)=>{
    const tags=[];
    if(b.gpu_model)tags.push(`<span class="bench-tag"><b>GPU</b> ${b.gpu_model}${b.gpu_memory?' · '+b.gpu_memory+'GB':''}</span>`);
    if(b.cpu_model)tags.push(`<span class="bench-tag"><b>CPU</b> ${b.cpu_model}</span>`);
    if(b.ram_gb)tags.push(`<span class="bench-tag"><b>RAM</b> ${b.ram_gb}GB</span>`);
    if(b.fps)tags.push(`<span class="bench-tag"><b>FPS</b> ${b.fps}</span>`);
    if(b.temperature)tags.push(`<span class="bench-tag">🌡 ${b.temperature}°C</span>`);
    if(b.power_usage)tags.push(`<span class="bench-tag">⚡ ${b.power_usage}W</span>`);
    if(b.software)tags.push(`<span class="bench-tag">${b.software}</span>`);
    if(b.driver_version)tags.push(`<span class="bench-tag">v${b.driver_version}</span>`);
    return`<div class="glass bench-card" style="animation:fadeUp 0.3s ${i*0.05}s ease both">
      <div class="bench-top"><span class="bench-name">${b.test_name}</span><span class="bench-score">${b.score}</span></div>
      <div class="bench-meta">${tags.join('')}</div>
      ${b.notes?`<div class="bench-notes">${b.notes}</div>`:''}
      <div class="bench-date">${new Date(b.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`;
  }).join('');
}

// Search
document.getElementById('searchInput').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  renderBenchmarks(q?allBenchmarks.filter(b=>
    b.test_name.toLowerCase().includes(q)||
    (b.gpu_model&&b.gpu_model.toLowerCase().includes(q))||
    (b.cpu_model&&b.cpu_model.toLowerCase().includes(q))||
    (b.software&&b.software.toLowerCase().includes(q))
  ):allBenchmarks);
});

// Chart
function updateChart(benchmarks){
  if(!benchmarks.length)return;
  const grouped={};
  benchmarks.forEach(b=>{if(!grouped[b.test_name])grouped[b.test_name]=[];grouped[b.test_name].push(b)});
  const ctx=document.getElementById('scoreChart').getContext('2d');
  if(scoreChart)scoreChart.destroy();
  const colors=['#7c3aed','#3b82f6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899'];
  const datasets=Object.keys(grouped).slice(0,7).map((name,i)=>{
    const sorted=grouped[name].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    return{label:name,data:sorted.map(b=>({x:new Date(b.created_at),y:b.score})),
      borderColor:colors[i%colors.length],backgroundColor:colors[i%colors.length]+'20',
      pointBackgroundColor:colors[i%colors.length],pointRadius:4,pointHoverRadius:6,
      tension:0.4,fill:true,borderWidth:2};
  });
  scoreChart=new Chart(ctx,{type:'line',data:{datasets},options:{
    responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},
    plugins:{legend:{labels:{color:'#71717a',font:{size:11},boxWidth:12,padding:12}},
      tooltip:{backgroundColor:'rgba(10,10,15,0.9)',borderColor:'rgba(255,255,255,0.1)',
        borderWidth:1,titleColor:'#fafafa',bodyColor:'#e4e4e7',padding:10,cornerRadius:8}},
    scales:{x:{type:'time',time:{unit:'day'},grid:{color:'rgba(255,255,255,0.04)'},
      ticks:{color:'#71717a',font:{size:10}}},
      y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.04)'},
        ticks:{color:'#71717a',font:{size:10}}}}
  }});
}

// Load series
async function loadSeries(){
  try{
    const res=await fetch(API+'/api/series');
    const series=await res.json();
    const el=document.getElementById('seriesList');
    if(!series.length){el.innerHTML='<div class="empty"><div class="empty-icon">📈</div><div class="empty-text">No test series yet</div></div>';return}
    el.innerHTML=series.map((s,i)=>`
      <div class="glass series-card" style="animation:fadeUp 0.3s ${i*0.05}s ease both">
        <div class="series-name">${s.test_name}</div>
        <div class="series-stats">
          <div><div class="series-stat-val" style="color:#10b981">${parseFloat(s.max_score).toFixed(0)}</div><div class="series-stat-lbl">Best</div></div>
          <div><div class="series-stat-val" style="color:#3b82f6">${parseFloat(s.avg_score).toFixed(0)}</div><div class="series-stat-lbl">Average</div></div>
          <div><div class="series-stat-val" style="color:#71717a">${s.total_benchmarks}</div><div class="series-stat-lbl">Runs</div></div>
        </div>
      </div>`).join('');
  }catch(e){console.error(e)}
}

// Add benchmark
async function addBenchmark(){
  const btn=document.getElementById('submitBtn');
  const data={
    test_name:document.getElementById('testName').value,
    score:parseFloat(document.getElementById('score').value),
    gpu_model:document.getElementById('gpuModel').value||null,
    gpu_memory:document.getElementById('gpuMemory').value?parseInt(document.getElementById('gpuMemory').value):null,
    cpu_model:document.getElementById('cpuModel').value||null,
    ram_gb:document.getElementById('ramGB').value?parseInt(document.getElementById('ramGB').value):null,
    driver_version:document.getElementById('driverVersion').value||null,
    software:document.getElementById('software').value||null,
    fps:document.getElementById('fps').value?parseFloat(document.getElementById('fps').value):null,
    power_usage:document.getElementById('powerUsage').value?parseInt(document.getElementById('powerUsage').value):null,
    temperature:document.getElementById('temperature').value?parseInt(document.getElementById('temperature').value):null,
    notes:document.getElementById('notes').value||null
  };
  if(!data.test_name||!data.score){alert('Test name and score required');return}
  btn.classList.add('loading');btn.textContent='Saving...';
  try{
    const res=await fetch(API+'/api/benchmarks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(res.ok){
      ['testName','score','gpuModel','gpuMemory','cpuModel','ramGB','driverVersion','software','fps','powerUsage','temperature','notes'].forEach(id=>document.getElementById(id).value='');
      btn.textContent='✓ Saved!';btn.style.background='linear-gradient(135deg,#10b981,#059669)';
      setTimeout(()=>{btn.textContent='Save Benchmark';btn.style.background='';btn.classList.remove('loading')},1500);
      loadStats();loadBenchmarks();loadSeries();
      switchView('viewDashboard');
    }
  }catch(e){alert('Failed to save');btn.textContent='Save Benchmark';btn.classList.remove('loading')}
}

// Init
document.addEventListener('DOMContentLoaded',()=>{loadStats();loadBenchmarks();loadSeries()});
</script>
</body>
</html>
