<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffd700 0%, #ffa500 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-value {
            font-size: 2.2em;
            font-weight: bold;
            color: #ffa500;
        }
        .stat-label {
            color: #666;
            font-size: 0.9em;
        }
        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 {
            color: #ffa500;
            margin-bottom: 20px;
            border-bottom: 2px solid #ffa500;
            padding-bottom: 10px;
        }
        .btn {
            background: #ffa500;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #ff8c00;
            transform: translateY(-2px);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        input, select, textarea {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ffa500;
        }
        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .thumbnail-card {
            border: 2px solid #ffa500;
            border-radius: 10px;
            padding: 15px;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.3s;
        }
        .thumbnail-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 165, 0, 0.3);
        }
        .thumbnail-preview {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #ddd, #eee);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            margin-bottom: 10px;
            font-size: 0.9em;
        }
        .thumbnail-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .thumbnail-meta {
            font-size: 0.85em;
            color: #666;
        }
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        .template-item {
            background: linear-gradient(135deg, #ffd700 0%, #ffa500 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .template-item:hover {
            transform: scale(1.05);
        }
        .no-data {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Thumbnail Analyzer</h1>
            <p>Design and test YouTube thumbnails</p>
        </header>

        <div class="stats" id="stats"></div>

        <div class="section">
            <h2>Create New Thumbnail Design</h2>
            <div class="form-grid">
                <input type="text" id="title" placeholder="Video Title" required>
                <input type="text" id="videoSeries" placeholder="Video Series (e.g., Reviews)">
                <input type="text" id="designElements" placeholder="Design Elements (text, graphics, etc.)">
                <input type="text" id="colors" placeholder="Colors (e.g., Red, Gold, Blue)">
                <select id="textSize">
                    <option value="">Text Size</option>
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                    <option value="extra-large">Extra Large</option>
                </select>
                <select id="textClarity">
                    <option value="">Text Clarity</option>
                    <option value="low">Low Contrast</option>
                    <option value="medium">Medium Contrast</option>
                    <option value="high">High Contrast</option>
                </select>
                <input type="number" id="brightness" placeholder="Brightness (0-100)">
                <input type="number" id="contrast" placeholder="Contrast (0-100)">
                <input type="number" id="ctrEstimate" placeholder="Est. CTR (%)" step="0.1" min="0" max="100">
                <select id="testStatus">
                    <option value="draft">Draft</option>
                    <option value="testing">Testing</option>
                    <option value="approved">Approved</option>
                </select>
            </div>
            <textarea id="notes" placeholder="Design notes..." style="margin-bottom: 10px;"></textarea>
            <button class="btn" onclick="createThumbnail()">Create Thumbnail</button>
        </div>

        <div class="section">
            <h2>Design Templates</h2>
            <div class="template-grid" id="templates"></div>
        </div>

        <div class="section">
            <h2>Your Thumbnails</h2>
            <div class="thumbnail-grid" id="thumbnailsList"></div>
        </div>
    </div>

    <script>
        const API = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadThumbnails();
            loadTemplates();
        });

        async function loadStats() {
            try {
                const res = await fetch(`${API}/api/stats`);
                const stats = await res.json();
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.total}</div>
                        <div class="stat-label">Total Designs</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.testing}</div>
                        <div class="stat-label">Testing</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.avg_estimated_ctr}%</div>
                        <div class="stat-label">Avg Est. CTR</div>
                    </div>
                `;
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function loadThumbnails() {
            try {
                const res = await fetch(`${API}/api/thumbnails`);
                const thumbnails = await res.json();

                if (thumbnails.length === 0) {
                    document.getElementById('thumbnailsList').innerHTML = '<div class="no-data" style="grid-column: 1/-1;">No thumbnails yet</div>';
                    return;
                }

                const html = thumbnails.map(t => `
                    <div class="thumbnail-card">
                        <div class="thumbnail-preview">
                            <span>${t.design_elements || 'Design'}</span>
                        </div>
                        <div class="thumbnail-title">${t.title}</div>
                        <div class="thumbnail-meta">
                            <div>Colors: ${t.colors || 'N/A'}</div>
                            <div>CTR: ${t.ctr_estimate || '-'}%</div>
                            <div>Status: <strong>${t.test_status}</strong></div>
                        </div>
                    </div>
                `).join('');

                document.getElementById('thumbnailsList').innerHTML = html;
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function loadTemplates() {
            try {
                const res = await fetch(`${API}/api/templates`);
                const templates = await res.json();

                const html = templates.map(t => `
                    <div class="template-item" onclick="applyTemplate('${t.name}')">${t.name}</div>
                `).join('');

                document.getElementById('templates').innerHTML = html;
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function createThumbnail() {
            const title = document.getElementById('title').value.trim();
            if (!title) {
                alert('Title required');
                return;
            }

            const data = {
                title,
                video_series: document.getElementById('videoSeries').value || null,
                design_elements: document.getElementById('designElements').value || null,
                colors: document.getElementById('colors').value || null,
                text_size: document.getElementById('textSize').value || null,
                text_clarity: document.getElementById('textClarity').value || null,
                brightness: document.getElementById('brightness').value ? parseInt(document.getElementById('brightness').value) : null,
                contrast: document.getElementById('contrast').value ? parseInt(document.getElementById('contrast').value) : null,
                ctr_estimate: document.getElementById('ctrEstimate').value ? parseFloat(document.getElementById('ctrEstimate').value) : null,
                test_status: document.getElementById('testStatus').value,
                notes: document.getElementById('notes').value || null
            };

            try {
                await fetch(`${API}/api/thumbnails`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                document.querySelector('form')?.reset();
                loadThumbnails();
                loadStats();
            } catch (err) {
                console.error('Error:', err);
                alert('Failed to create thumbnail');
            }
        }

        function applyTemplate(templateName) {
            document.getElementById('title').value = templateName + ' - ' + new Date().toLocaleDateString();
            document.getElementById('designElements').value = templateName + ' design';
        }
    </script>
</body>
</html>
