<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="http://shared-assets:3000/design-tokens.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Docs</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #0a0a0f;
  --bg-secondary: #0a0a0f;
  --bg-card: rgba(255,255,255,0.03);
  --bg-hover: rgba(255,255,255,0.06);
  --bg-active: rgba(255,255,255,0.09);
  --bg-glass: rgba(18,18,28,0.75);
  --bg-glass-heavy: rgba(18,18,28,0.92);
  --text-secondary: rgba(232,232,240,0.5);
  --text-tertiary: rgba(232,232,240,0.25);
  --border: rgba(255,255,255,0.06);
  --border-light: rgba(255,255,255,0.03);
  --accent-glow: rgba(124,58,237,0.15);
  --accent-soft: rgba(124,58,237,0.1);
  --accent-text: #a78bfa;
  --danger: #ff6b6b;
  --danger-soft: rgba(255,107,107,0.1);
  --success: #51cf66;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 40px rgba(124,58,237,0.08);
  --radius: 12px;
  --sidebar-width: 280px;
  --topbar-height: 56px;
  --glass-blur: 20px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-spring: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Menlo, monospace;
}

html { background: var(--bg-deep); }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}

/* Animated background gradient */
body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.04) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 20%, rgba(99,175,255,0.03) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 80%, rgba(255,99,200,0.02) 0%, transparent 50%);
  animation: bgShift 30s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}

@keyframes bgShift {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  33% { transform: translate(2%, -1%) rotate(1deg); }
  66% { transform: translate(-1%, 2%) rotate(-1deg); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInScale {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes slideInLeft {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

/* ==================== Auth Page ==================== */
.auth-page {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  position: relative;
  z-index: 1;
}

.auth-card {
  background: var(--bg-glass-heavy);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 40px 36px;
  width: 400px;
  max-width: calc(100vw - 32px);
  box-shadow: var(--shadow-lg), var(--shadow-glow);
  animation: fadeInScale 0.5s ease-out;
}

.auth-card h1 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--text) 0%, var(--text-secondary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.auth-card .subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 28px;
  line-height: 1.5;
}

.auth-card .form-group { margin-bottom: 16px; }

.auth-card label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.auth-card input[type="text"],
.auth-card input[type="email"],
.auth-card input[type="password"] {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  background: var(--bg-card);
  color: var(--text);
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
  font-family: var(--font);
  min-height: 48px;
}

.auth-card input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.auth-card input::placeholder { color: var(--text-tertiary); }

.auth-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: transform var(--transition), opacity var(--transition), box-shadow var(--transition);
  font-family: var(--font);
  min-height: 48px;
  position: relative;
  overflow: hidden;
}

.auth-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(124,58,237,0.3); }
.auth-btn:active { transform: translateY(0); }
.auth-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.auth-divider {
  display: flex;
  align-items: center;
  margin: 24px 0;
  gap: 16px;
  color: var(--text-tertiary);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.auth-divider::before, .auth-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.google-btn {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: background var(--transition), border-color var(--transition), transform var(--transition);
  font-family: var(--font);
  min-height: 48px;
}

.google-btn:hover { background: var(--bg-hover); border-color: rgba(255,255,255,0.1); transform: translateY(-1px); }
.google-btn:active { transform: translateY(0); }

.google-btn svg { width: 20px; height: 20px; }

.auth-switch {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: var(--text-secondary);
}

.auth-switch a {
  color: var(--accent-text);
  cursor: pointer;
  text-decoration: none;
  font-weight: 500;
  transition: color var(--transition);
}

.auth-switch a:hover { color: var(--accent); }

.auth-error {
  background: var(--danger-soft);
  color: var(--danger);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
  border: 1px solid rgba(255,107,107,0.15);
  animation: fadeIn 0.2s ease-out;
}

/* ==================== Sidebar ==================== */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--bg-glass-heavy);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 10;
  position: relative;
}

.sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-width)); }

.sidebar-header {
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  min-height: var(--topbar-height);
}

.sidebar-title {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.3px;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent-text) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-actions { display: flex; gap: 4px; }

.icon-btn {
  width: 36px; height: 36px; border: none; background: none;
  color: var(--text-secondary); border-radius: var(--radius-sm);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: all var(--transition);
  position: relative;
}

.icon-btn:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.icon-btn:active { transform: scale(0.92); }

.search-box { padding: 10px 14px; }

.search-input {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text);
  font-size: 14px; outline: none; transition: all var(--transition);
  font-family: var(--font); min-height: 44px;
}

.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-input::placeholder { color: var(--text-tertiary); }

.doc-tree {
  flex: 1; overflow-y: auto; padding: 6px 10px;
  scroll-behavior: smooth;
}

.tree-item {
  display: flex; align-items: center; padding: 8px 10px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 14px; color: var(--text); gap: 8px; user-select: none;
  position: relative; min-height: 40px;
  transition: all var(--transition);
}

.tree-item:hover { background: var(--bg-hover); }
.tree-item.active {
  background: var(--accent-soft);
  color: var(--accent-text);
}

.tree-item .chevron {
  width: 20px; height: 20px; display: flex; align-items: center;
  justify-content: center; font-size: 10px; color: var(--text-tertiary);
  transition: transform 0.2s ease; flex-shrink: 0;
  border-radius: 4px;
}

.tree-item .chevron:hover { background: var(--bg-hover); }
.tree-item .chevron.expanded { transform: rotate(90deg); }
.tree-item .chevron.hidden { visibility: hidden; }

.tree-item .icon { font-size: 16px; flex-shrink: 0; width: 22px; text-align: center; }
.tree-item .label {
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-weight: 450; line-height: 1.4;
}

.tree-item .item-actions { display: none; gap: 2px; }
.tree-item:hover .item-actions { display: flex; }

.tree-item .item-btn {
  width: 28px; height: 28px; border: none; background: none;
  color: var(--text-secondary); cursor: pointer; border-radius: 6px;
  font-size: 15px; display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}

.tree-item .item-btn:hover { background: var(--bg-active); color: var(--text); }

.tree-children { padding-left: 18px; }
.tree-children.collapsed { display: none; }

.sidebar-footer {
  padding: 10px 14px; border-top: 1px solid var(--border);
  display: flex; gap: 6px;
}

.sidebar-footer button {
  flex: 1; padding: 10px; border: none; background: var(--bg-card);
  color: var(--text-secondary); font-size: 13px; cursor: pointer;
  border-radius: var(--radius-sm); display: flex; align-items: center;
  justify-content: center; gap: 6px; font-weight: 500;
  transition: all var(--transition); min-height: 44px;
  border: 1px solid var(--border);
  font-family: var(--font);
}

.sidebar-footer button:hover {
  background: var(--bg-hover);
  color: var(--text);
  border-color: rgba(255,255,255,0.1);
}

.sidebar-footer button:active { transform: scale(0.97); }

/* User bar */
.user-bar {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}

.user-bar .user-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
  color: var(--text);
}

.user-bar .logout-btn {
  border: none; background: none; color: var(--text-tertiary);
  cursor: pointer; font-size: 12px; padding: 8px 12px;
  border-radius: var(--radius-sm); transition: all var(--transition);
  min-height: 36px; font-family: var(--font);
}

.user-bar .logout-btn:hover { background: var(--danger-soft); color: var(--danger); }

/* ==================== Main content ==================== */
.main {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
  height: 100vh; height: 100dvh; position: relative; z-index: 1;
}

.topbar {
  height: var(--topbar-height); min-height: var(--topbar-height);
  display: flex; align-items: center; padding: 0 20px; gap: 10px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-glass-heavy);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  z-index: 5;
}

.breadcrumb {
  font-size: 13px; color: var(--text-secondary); flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.breadcrumb span { color: var(--text); font-weight: 500; }

.editor-wrap {
  flex: 1; overflow-y: auto; display: flex; justify-content: center;
  scroll-behavior: smooth;
}

.editor-container {
  width: 100%; max-width: 760px; padding: 48px 32px 140px;
  animation: fadeIn 0.3s ease-out;
}

.doc-icon-picker {
  font-size: 44px; cursor: pointer; width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius); margin-bottom: 8px; transition: all var(--transition);
}

.doc-icon-picker:hover { background: var(--bg-hover); transform: scale(1.05); }
.doc-icon-picker:active { transform: scale(0.95); }

.doc-title {
  font-size: 36px; font-weight: 700; border: none; outline: none; width: 100%;
  background: none; color: var(--text); margin-bottom: 12px;
  letter-spacing: -0.8px; line-height: 1.2;
  font-family: var(--font);
}

.doc-title::placeholder { color: var(--text-tertiary); }

.editor {
  min-height: 400px; outline: none; font-size: 16px; line-height: 1.8;
  color: var(--text); word-wrap: break-word;
  caret-color: var(--accent);
}

.editor:empty::before {
  content: "Start writing, or press '/' for commands...";
  color: var(--text-tertiary); pointer-events: none;
}

.editor h1 { font-size: 26px; font-weight: 700; margin: 24px 0 8px; letter-spacing: -0.4px; }
.editor h2 { font-size: 22px; font-weight: 600; margin: 20px 0 6px; letter-spacing: -0.3px; }
.editor h3 { font-size: 18px; font-weight: 600; margin: 16px 0 4px; }
.editor p { margin: 4px 0; }
.editor ul, .editor ol { margin: 4px 0; padding-left: 24px; }
.editor li { margin: 2px 0; }
.editor blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 16px;
  color: var(--text-secondary); margin: 8px 0;
  background: var(--accent-soft);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 12px 16px;
}
.editor code {
  background: rgba(255,255,255,0.06); padding: 2px 7px; border-radius: 5px;
  font-size: 14px; font-family: var(--font-mono);
  border: 1px solid var(--border);
}
.editor pre {
  background: rgba(0,0,0,0.3); padding: 18px 20px; border-radius: var(--radius);
  overflow-x: auto; margin: 10px 0; font-size: 14px; line-height: 1.6;
  font-family: var(--font-mono);
  border: 1px solid var(--border);
}
.editor pre code { background: none; padding: 0; border: none; }
.editor hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
.editor a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
.editor img { max-width: 100%; border-radius: var(--radius); margin: 10px 0; }
.editor input[type="checkbox"] { margin-right: 8px; accent-color: var(--accent); width: 16px; height: 16px; }

/* Slash command menu */
.slash-menu {
  position: fixed; background: var(--bg-glass-heavy);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 6px; min-width: 240px; z-index: 100; display: none;
  animation: fadeInScale 0.15s ease-out;
}

.slash-menu-item {
  padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 14px; display: flex; align-items: center; gap: 12px;
  transition: background var(--transition); min-height: 44px;
}

.slash-menu-item:hover, .slash-menu-item.selected { background: var(--bg-hover); }

.slash-menu-item .cmd-icon {
  width: 32px; height: 32px; background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm); display: flex; align-items: center;
  justify-content: center; font-size: 15px; flex-shrink: 0;
}

.slash-menu-item .cmd-label { font-weight: 500; }
.slash-menu-item .cmd-desc { font-size: 12px; color: var(--text-secondary); }

/* Icon picker popup */
.icon-popup {
  position: fixed; background: var(--bg-glass-heavy);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 14px; z-index: 100; display: none; width: 280px; max-height: 220px;
  overflow-y: auto;
  animation: fadeInScale 0.15s ease-out;
}

.icon-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }

.icon-option {
  width: 32px; height: 32px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; border-radius: 6px;
  font-size: 18px; border: none; background: none;
  transition: all var(--transition);
}

.icon-option:hover { background: var(--bg-hover); transform: scale(1.15); }

/* Context menu */
.context-menu {
  position: fixed; background: var(--bg-glass-heavy);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 6px; min-width: 180px; z-index: 100; display: none;
  animation: fadeInScale 0.15s ease-out;
}

.context-menu-item {
  padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 13px; display: flex; align-items: center; gap: 10px;
  transition: background var(--transition); min-height: 40px;
}

.context-menu-item:hover { background: var(--bg-hover); }
.context-menu-item.danger { color: var(--danger); }

/* Empty state */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; color: var(--text-tertiary);
  gap: 16px; padding: 40px; text-align: center;
  animation: fadeIn 0.4s ease-out;
}

.empty-state .empty-icon {
  font-size: 56px; opacity: 0.3;
  animation: pulse 3s ease-in-out infinite;
}
.empty-state p { font-size: 15px; line-height: 1.5; }
.empty-state p:last-child { font-size: 13px; }

/* Formatting toolbar */
.format-bar {
  position: fixed; background: var(--bg-glass-heavy);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 4px; display: none; z-index: 100; gap: 2px;
  animation: fadeInScale 0.15s ease-out;
}

.format-bar button {
  width: 36px; height: 34px; border: none; background: none;
  cursor: pointer; color: var(--text); border-radius: 6px;
  font-size: 14px; font-weight: 600; display: flex; align-items: center;
  justify-content: center; transition: all var(--transition);
}

.format-bar button:hover { background: var(--bg-hover); color: var(--accent-text); }

/* ==================== Share Modal ==================== */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 200; display: none;
  align-items: center; justify-content: center;
}

.modal-overlay.active { display: flex; }

.share-modal {
  background: var(--bg-glass-heavy);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl); padding: 28px; width: 440px; max-width: calc(100vw - 32px);
  box-shadow: var(--shadow-lg); max-height: 80vh; overflow-y: auto;
  animation: fadeInScale 0.2s ease-out;
}

.share-modal h2 {
  font-size: 18px; font-weight: 600; margin-bottom: 20px;
  letter-spacing: -0.2px;
}

.share-form { display: flex; gap: 8px; margin-bottom: 16px; }

.share-form input[type="email"] {
  flex: 1; padding: 10px 14px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 14px; background: var(--bg-card);
  color: var(--text); outline: none; font-family: var(--font);
  min-height: 44px; transition: all var(--transition);

<script>
// ====================== API Layer ======================
const API = '/api';
let authToken = localStorage.getItem('docs_token');
let currentUser = null;

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
  const res = await fetch(API + path, { ...options, headers });
  if (res.status === 401) {
    logout();
    throw new Error('Session expired');
  }
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ====================== Auth ======================
function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function showLogin() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('authTitle').textContent = 'Welcome back';
  document.getElementById('authSubtitle').textContent = 'Sign in to your Docs workspace';
  document.getElementById('authSwitch').innerHTML = "Don't have an account? <a onclick=\"showRegister()\">Sign up</a>";
  showAuthError('');
}

function showRegister() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
  document.getElementById('authTitle').textContent = 'Create account';
  document.getElementById('authSubtitle').textContent = 'Get started with your Docs workspace';
  document.getElementById('authSwitch').innerHTML = "Already have an account? <a onclick=\"showLogin()\">Sign in</a>";
  showAuthError('');
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  showAuthError('');
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      })
    });
    authToken = data.token;
    currentUser = data.user;
    localStorage.setItem('docs_token', authToken);
    enterApp();
  } catch (err) {
    showAuthError(err.message);
  } finally {
    btn.disabled = false;
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  showAuthError('');
  try {
    const data = await api('/auth/register', {
      method: 'POST',
      body: JSON.stringify({
        name: document.getElementById('registerName').value,
        email: document.getElementById('registerEmail').value,
        password: document.getElementById('registerPassword').value
      })
    });
    authToken = data.token;
    currentUser = data.user;
    localStorage.setItem('docs_token', authToken);
    enterApp();
  } catch (err) {
    showAuthError(err.message);
  } finally {
    btn.disabled = false;
  }
}

async function googleSignIn() {
  try {
    const cfgRes = await fetch('/api/auth/config');
    const cfg = await cfgRes.json();
    if (!cfg.googleClientId) {
      showAuthError('Google OAuth is not configured on this server.');
      return;
    }
    if (typeof google === 'undefined' || !google.accounts) {
      showAuthError('Google Sign-In library failed to load. Please refresh and try again.');
      return;
    }
    google.accounts.id.initialize({
      client_id: cfg.googleClientId,
      callback: async (response) => {
        try {
          const res = await fetch('/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: response.credential })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Google sign-in failed');
          authToken = data.token;
          currentUser = data.user;
          localStorage.setItem('docs_token', authToken);
          enterApp();
        } catch (err) {
          showAuthError(err.message);
        }
      }
    });
    google.accounts.id.prompt((notification) => {
      if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
        google.accounts.id.renderButton(
          document.getElementById('googleSignInBtn'),
          { theme: 'outline', size: 'large', width: document.getElementById('googleSignInBtn').offsetWidth }
        );
        document.getElementById('googleSignInBtn').click();
      }
    });
  } catch (err) {
    showAuthError(err.message || 'Google sign-in failed');
  }
}

function logout() {
  authToken = null;
  currentUser = null;
  localStorage.removeItem('docs_token');
  state.docs = {};
  state.order = [];
  state.activeId = null;
  sharedDocs = {};
  document.getElementById('authPage').style.display = 'flex';
  document.getElementById('appWrap').style.display = 'none';
}

async function enterApp() {
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('appWrap').style.display = 'flex';
  document.getElementById('userName').textContent = currentUser ? currentUser.name : '';
  if (isMobile()) {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('menuBtn').style.display = 'flex';
  }
  await loadDocs();
  await loadSharedDocs();
  renderTree();
  if (state.activeId && state.docs[state.activeId]) {
    selectDoc(state.activeId);
  } else {
    showEmpty();
  }
}

// ====================== State ======================
const ICONS = ['📄','📝','📋','📌','📎','📂','📁','🗂️','📓','📔','📒','📕','📗','📘','📙','📚','🔖','🏷️','💡','⭐','🎯','🔥','💎','🚀','🎨','🔧','⚙️','🧩','📊','📈','🗃️','✅','❤️','🌟','🏠','👤','🎵','🌍','🔑','📡'];

let state = {
  docs: {},
  order: [],
  activeId: null,
  expandedNodes: JSON.parse(localStorage.getItem('docs_expanded') || '{}')
};

function saveLocalPrefs() {
  localStorage.setItem('docs_expanded', JSON.stringify(state.expandedNodes));
}

// ====================== Load docs from API ======================
async function loadDocs() {
  try {
    const rows = await api('/docs');
    state.docs = {};
    state.order = [];

    const byId = {};
    rows.forEach(r => {
      byId[r.id] = {
        id: r.id, serverId: r.id, title: r.title || '', content: r.content || '',
        icon: r.icon || '📄', parentId: r.parent_id, children: [],
        sort_order: r.sort_order || 0, tags: r.tags || [],
        createdAt: r.created_at, updatedAt: r.updated_at
      };
    });

    Object.values(byId).forEach(doc => {
      if (doc.parentId && byId[doc.parentId]) {
        byId[doc.parentId].children.push(doc.id);
      }
    });

    const roots = Object.values(byId).filter(d => !d.parentId || !byId[d.parentId]);
    roots.sort((a, b) => a.sort_order - b.sort_order);

    state.docs = byId;
    state.order = roots.map(d => d.id);
  } catch (err) {
    console.error('Failed to load docs:', err);
  }
}

// ====================== Doc CRUD ======================
let saveTimer = null;

async function createDoc(parentId) {
  try {
    const body = { title: '', content: '', icon: '📄', parent_id: parentId || null, sort_order: 0 };
    const row = await api('/docs', { method: 'POST', body: JSON.stringify(body) });

    const doc = {
      id: row.id, serverId: row.id, title: '', content: '', icon: '📄',
      parentId: parentId || null, children: [], sort_order: 0,
      createdAt: row.created_at, updatedAt: row.updated_at
    };
    state.docs[doc.id] = doc;

    if (parentId && state.docs[parentId]) {
      state.docs[parentId].children.push(doc.id);
      state.expandedNodes[parentId] = true;
      saveLocalPrefs();
    } else {
      state.order.push(doc.id);
    }

    renderTree();
    selectDoc(doc.id);
    setTimeout(() => document.getElementById('docTitle').focus(), 50);
  } catch (err) {
    console.error('Failed to create doc:', err);
  }
}

async function deleteDoc(id) {
  const doc = state.docs[id];
  if (!doc) return;

  try {
    await api('/docs/' + id, { method: 'DELETE' });
  } catch (err) {
    console.error('Failed to delete doc:', err);
    return;
  }

  if (doc.children && doc.children.length > 0) {
    doc.children.forEach(cid => {
      if (state.docs[cid]) {
        state.docs[cid].parentId = null;
        state.order.push(cid);
      }
    });
  }

  if (doc.parentId && state.docs[doc.parentId]) {
    const parent = state.docs[doc.parentId];
    parent.children = parent.children.filter(c => c !== id);
  } else {
    state.order = state.order.filter(c => c !== id);
  }

  delete state.docs[id];

  if (state.activeId === id) {
    state.activeId = null;
    showEmpty();
  }
  renderTree();
}

async function duplicateDoc(id) {
  const src = state.docs[id];
  if (!src) return;

  try {
    const body = {
      title: src.title + ' (copy)', content: src.content, icon: src.icon,
      parent_id: src.parentId || null, sort_order: src.sort_order
    };
    const row = await api('/docs', { method: 'POST', body: JSON.stringify(body) });

    const doc = {
      id: row.id, serverId: row.id, title: body.title, content: body.content,
      icon: body.icon, parentId: body.parent_id, children: [], sort_order: body.sort_order,
      createdAt: row.created_at, updatedAt: row.updated_at
    };
    state.docs[doc.id] = doc;

    if (doc.parentId && state.docs[doc.parentId]) {
      state.docs[doc.parentId].children.push(doc.id);
    } else {
      state.order.push(doc.id);
    }

    renderTree();
    selectDoc(doc.id);
  } catch (err) {
    console.error('Failed to duplicate doc:', err);
  }
}

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (String(state.activeId).startsWith('shared-')) {
      saveSharedDoc();
    } else {
      saveCurrentDoc();
    }
  }, 800);
}

async function saveCurrentDoc() {
  if (!state.activeId || !state.docs[state.activeId]) return;
  const doc = state.docs[state.activeId];
  doc.title = document.getElementById('docTitle').value;
  doc.content = document.getElementById('editor').innerHTML;

  try {
    await api('/docs/' + doc.id, {
      method: 'PUT',
      body: JSON.stringify({
        title: doc.title, content: doc.content, icon: doc.icon,
        parent_id: doc.parentId || null, sort_order: doc.sort_order || 0,
        tags: doc.tags || []
      })
    });
  } catch (err) {
    console.error('Failed to save doc:', err);
  }
}

// ====================== Sidebar Tree ======================
function renderTree(filter) {
  const tree = document.getElementById('docTree');
  tree.innerHTML = '';
  const roots = filter ? getFilteredIds(filter) : state.order;
  roots.forEach(id => tree.appendChild(renderTreeNode(id, filter)));
  renderSharedSection();
}

function getFilteredIds(q) {
  q = q.toLowerCase();
  const matched = new Set();
  Object.values(state.docs).forEach(doc => {
    if ((doc.title || 'Untitled').toLowerCase().includes(q) || (doc.content || '').toLowerCase().includes(q)) {
      matched.add(doc.id);
      let pid = doc.parentId;
      while (pid) {
        matched.add(pid);
        pid = state.docs[pid] ? state.docs[pid].parentId : null;
      }
    }
  });
  return state.order.filter(id => matched.has(id));
}

function renderTreeNode(id, filter) {
  const doc = state.docs[id];
  if (!doc) return document.createDocumentFragment();

  const wrap = document.createElement('div');

  const item = document.createElement('div');
  item.className = 'tree-item' + (state.activeId === id ? ' active' : '');
  item.dataset.id = id;

  const hasChildren = doc.children && doc.children.length > 0;
  const expanded = state.expandedNodes[id];

  const chevron = document.createElement('span');
  chevron.className = 'chevron' + (hasChildren ? (expanded ? ' expanded' : '') : ' hidden');
  chevron.innerHTML = '&#9654;';
  chevron.onclick = (e) => { e.stopPropagation(); toggleExpand(id); };

  const icon = document.createElement('span');
  icon.className = 'icon';
  icon.textContent = doc.icon || '📄';

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = doc.title || 'Untitled';

  const actions = document.createElement('span');
  actions.className = 'item-actions';

  const addBtn = document.createElement('button');
  addBtn.className = 'item-btn';
  addBtn.innerHTML = '+';
  addBtn.title = 'Add sub-page';
  addBtn.onclick = (e) => { e.stopPropagation(); createDoc(id); };

  const moreBtn = document.createElement('button');
  moreBtn.className = 'item-btn';
  moreBtn.innerHTML = '&#8943;';
  moreBtn.title = 'More';
  moreBtn.onclick = (e) => { e.stopPropagation(); showContextMenu(e, id); };

  actions.appendChild(addBtn);
  actions.appendChild(moreBtn);

  item.appendChild(chevron);
  item.appendChild(icon);
  item.appendChild(label);
  item.appendChild(actions);
  item.onclick = () => selectDoc(id);

  wrap.appendChild(item);

  if (hasChildren) {
    const childrenWrap = document.createElement('div');
    childrenWrap.className = 'tree-children' + (expanded || filter ? '' : ' collapsed');
    const filteredSet = filter ? new Set(getFilteredIds(filter)) : null;
    doc.children.forEach(cid => {
      if (!filter || (filteredSet && filteredSet.has(cid))) {
        childrenWrap.appendChild(renderTreeNode(cid, filter));
      }
    });
    wrap.appendChild(childrenWrap);
  }

  return wrap;
}

function toggleExpand(id) {
  state.expandedNodes[id] = !state.expandedNodes[id];
  saveLocalPrefs();
  renderTree(document.getElementById('searchInput').value);
}

function filterDocs(q) { renderTree(q || null); }

// ====================== Editor ======================
function selectDoc(id) {
  if (state.activeId && state.docs[state.activeId]) saveCurrentDoc();

  state.activeId = id;
  const doc = state.docs[id];
  if (!doc) { showEmpty(); return; }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('editorContainer').style.display = 'block';

  document.getElementById('docTitle').value = doc.title || '';
  document.getElementById('editor').innerHTML = doc.content || '';
  document.getElementById('iconPicker').textContent = doc.icon || '📄';

  document.getElementById('editor').contentEditable = 'true';
  document.getElementById('docTitle').readOnly = false;
  document.getElementById('readonlyBadge').style.display = 'none';
  document.getElementById('shareBtn').style.display = 'flex';

  updateBreadcrumb(id);
  renderTree(document.getElementById('searchInput').value);
  closeMobileSidebar();
}

function showEmpty() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('editorContainer').style.display = 'none';
  document.getElementById('breadcrumb').innerHTML = '';
  document.getElementById('shareBtn').style.display = 'none';
  document.getElementById('readonlyBadge').style.display = 'none';
}

function onTitleChange() {
  if (!state.activeId) return;
  const match = String(state.activeId).match(/^shared-(\d+)$/);
  if (match) {
    const id = match[1];
    if (sharedDocs[id]) {
      sharedDocs[id].title = document.getElementById('docTitle').value;
      const bc = document.getElementById('breadcrumb');
      bc.innerHTML = '<span style="color:var(--text-secondary)">' + esc(sharedDocs[id].ownerName) + '</span> / <span>' + esc(sharedDocs[id].title || 'Untitled') + '</span>';
    }
  } else {
    state.docs[state.activeId].title = document.getElementById('docTitle').value;
    updateBreadcrumb(state.activeId);
  }
  renderTree(document.getElementById('searchInput').value);
  scheduleSave();
}

function updateBreadcrumb(id) {
  const parts = [];
  let cur = id;
  while (cur) {
    const doc = state.docs[cur];
    if (!doc) break;
    parts.unshift(doc.title || 'Untitled');
    cur = doc.parentId;
  }
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = parts.map((p, i) =>
    i === parts.length - 1 ? '<span>' + esc(p) + '</span>' : esc(p)
  ).join(' <span style="opacity:0.3">›</span> ');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ====================== Formatting ======================
function fmt(cmd) {
  if (cmd === 'createLink') {
    const url = prompt('Enter URL:');
    if (url) document.execCommand('createLink', false, url);
  } else {
    document.execCommand(cmd, false, null);
  }
  document.getElementById('editor').focus();
}

document.addEventListener('mouseup', () => {
  setTimeout(() => {
    const sel = window.getSelection();
    if (sel.rangeCount && !sel.isCollapsed && document.getElementById('editor').contains(sel.anchorNode)) {
      const range = sel.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      const bar = document.getElementById('formatBar');
      bar.style.display = 'flex';

// ====================== Slash Commands ======================
const SLASH_COMMANDS = [
  { label: 'Heading 1', desc: 'Large heading', icon: 'H1', action: () => document.execCommand('formatBlock', false, 'h1') },
  { label: 'Heading 2', desc: 'Medium heading', icon: 'H2', action: () => document.execCommand('formatBlock', false, 'h2') },
  { label: 'Heading 3', desc: 'Small heading', icon: 'H3', action: () => document.execCommand('formatBlock', false, 'h3') },
  { label: 'Bullet List', desc: 'Unordered list', icon: '•', action: () => document.execCommand('insertUnorderedList') },
  { label: 'Numbered List', desc: 'Ordered list', icon: '1.', action: () => document.execCommand('insertOrderedList') },
  { label: 'Quote', desc: 'Blockquote', icon: '❝', action: () => document.execCommand('formatBlock', false, 'blockquote') },
  { label: 'Code Block', desc: 'Code snippet', icon: '{}', action: () => insertCodeBlock() },
  { label: 'Divider', desc: 'Horizontal rule', icon: '—', action: () => document.execCommand('insertHorizontalRule') },
  { label: 'To-do', desc: 'Checkbox item', icon: '☐', action: () => insertTodo() },
];

let slashMenuIndex = 0;
let slashActive = false;

function showSlashMenu(x, y, filter) {
  const menu = document.getElementById('slashMenu');
  const items = filter
    ? SLASH_COMMANDS.filter(c => c.label.toLowerCase().includes(filter.toLowerCase()))
    : SLASH_COMMANDS;

  if (items.length === 0) { hideSlashMenu(); return; }

  slashMenuIndex = 0;
  menu.innerHTML = '';
  items.forEach((cmd, i) => {
    const el = document.createElement('div');
    el.className = 'slash-menu-item' + (i === 0 ? ' selected' : '');
    el.innerHTML = '<span class="cmd-icon">' + cmd.icon + '</span><span><span class="cmd-label">' + cmd.label + '</span><br><span class="cmd-desc">' + cmd.desc + '</span></span>';
    el.onclick = () => { executeSlashCommand(cmd); };
    el.onmouseenter = () => {
      menu.querySelectorAll('.slash-menu-item').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      slashMenuIndex = i;
    };
    menu.appendChild(el);
  });

  menu.style.display = 'block';
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu._items = items;
  slashActive = true;
}

function hideSlashMenu() {
  document.getElementById('slashMenu').style.display = 'none';
  slashActive = false;
}

function executeSlashCommand(cmd) {
  const sel = window.getSelection();
  if (sel.rangeCount) {
    const range = sel.getRangeAt(0);
    const node = range.startContainer;
    if (node.nodeType === 3) {
      const text = node.textContent;
      const slashIdx = text.lastIndexOf('/');
      if (slashIdx >= 0) {
        node.textContent = text.substring(0, slashIdx);
        range.setStart(node, slashIdx);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }
  }
  cmd.action();
  hideSlashMenu();
  scheduleSave();
}

function insertCodeBlock() {
  document.execCommand('insertHTML', false, '<pre><code>code here</code></pre><p></p>');
}

function insertTodo() {
  document.execCommand('insertHTML', false, '<div><input type="checkbox"> To-do item</div>');
}

const editorEl = document.getElementById('editor');
editorEl.addEventListener('input', () => {
  scheduleSave();

  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const node = sel.anchorNode;
  if (node && node.nodeType === 3) {
    const text = node.textContent.substring(0, sel.anchorOffset);
    const match = text.match(/\/([a-zA-Z0-9]*)$/);
    if (match) {
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      showSlashMenu(rect.left, rect.bottom + 4, match[1]);
      return;
    }
  }
  hideSlashMenu();
});

editorEl.addEventListener('keydown', (e) => {
  if (slashActive) {
    const menu = document.getElementById('slashMenu');
    const items = menu._items || [];
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      slashMenuIndex = (slashMenuIndex + 1) % items.length;
      updateSlashSelection(menu);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      slashMenuIndex = (slashMenuIndex - 1 + items.length) % items.length;
      updateSlashSelection(menu);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (items[slashMenuIndex]) executeSlashCommand(items[slashMenuIndex]);
    } else if (e.key === 'Escape') {
      hideSlashMenu();
    }
    return;
  }

  if (e.key === 'Tab') {
    e.preventDefault();
    document.execCommand('insertText', false, '  ');
  }
});

// Markdown shortcuts
editorEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || slashActive) return;
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const node = sel.anchorNode;
  if (!node || node.nodeType !== 3) return;
  const text = node.textContent;

  const headingMatch = text.match(/^(#{1,3})\s+(.*)$/);
  if (headingMatch) {
    e.preventDefault();
    const level = headingMatch[1].length;
    const content = headingMatch[2];
    node.textContent = '';
    document.execCommand('formatBlock', false, 'h' + level);
    document.execCommand('insertText', false, content);
    return;
  }
  if (text.match(/^[-*]\s+/)) {
    e.preventDefault();
    const content = text.replace(/^[-*]\s+/, '');
    node.textContent = '';
    document.execCommand('insertUnorderedList');
    if (content) document.execCommand('insertText', false, content);
    return;
  }
  if (text.match(/^\d+\.\s+/)) {
    e.preventDefault();
    const content = text.replace(/^\d+\.\s+/, '');
    node.textContent = '';
    document.execCommand('insertOrderedList');
    if (content) document.execCommand('insertText', false, content);
    return;
  }
  if (text.match(/^>\s+/)) {
    e.preventDefault();
    const content = text.replace(/^>\s+/, '');
    node.textContent = '';
    document.execCommand('formatBlock', false, 'blockquote');
    if (content) document.execCommand('insertText', false, content);
    return;
  }
  if (text.match(/^---\s*$/)) {
    e.preventDefault();
    node.textContent = '';
    document.execCommand('insertHorizontalRule');
    return;
  }
});

function updateSlashSelection(menu) {
  menu.querySelectorAll('.slash-menu-item').forEach((el, i) => {
    el.classList.toggle('selected', i === slashMenuIndex);
  });
}

// ====================== Icon Picker ======================
function showIconPicker(event) {
  const popup = document.getElementById('iconPopup');
  const grid = document.createElement('div');
  grid.className = 'icon-grid';
  ICONS.forEach(icon => {
    const btn = document.createElement('button');
    btn.className = 'icon-option';
    btn.textContent = icon;
    btn.onclick = () => {
      if (state.activeId && state.docs[state.activeId]) {
        state.docs[state.activeId].icon = icon;
        document.getElementById('iconPicker').textContent = icon;
        scheduleSave();
        renderTree(document.getElementById('searchInput').value);
      }
      popup.style.display = 'none';
    };
    grid.appendChild(btn);
  });
  popup.innerHTML = '';
  popup.appendChild(grid);
  popup.style.display = 'block';
  const rect = event.target.getBoundingClientRect();
  popup.style.left = Math.max(8, rect.left) + 'px';
  popup.style.top = (rect.bottom + 4) + 'px';
}

// ====================== Context Menu ======================
function showContextMenu(e, docId) {
  const menu = document.getElementById('contextMenu');
  menu.innerHTML = '';

  const items = [
    { label: 'Add sub-page', icon: '📄', action: () => createDoc(docId) },
    { label: 'Duplicate', icon: '📋', action: () => duplicateDoc(docId) },
    { label: 'Delete', icon: '🗑️', action: () => { if (confirm('Delete this page?')) deleteDoc(docId); }, danger: true },
  ];

  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'context-menu-item' + (item.danger ? ' danger' : '');
    el.innerHTML = '<span>' + item.icon + '</span><span>' + item.label + '</span>';
    el.onclick = () => { item.action(); menu.style.display = 'none'; };
    menu.appendChild(el);
  });

  menu.style.display = 'block';
  const rect = e.target.getBoundingClientRect();
  menu.style.left = Math.min(rect.right, window.innerWidth - 200) + 'px';
  menu.style.top = rect.top + 'px';
}

document.addEventListener('mousedown', (e) => {
  if (!e.target.closest('.icon-popup') && !e.target.closest('.doc-icon-picker'))
    document.getElementById('iconPopup').style.display = 'none';
  if (!e.target.closest('.context-menu') && !e.target.closest('.item-btn'))
    document.getElementById('contextMenu').style.display = 'none';
  if (!e.target.closest('.slash-menu') && !e.target.closest('.editor'))
    hideSlashMenu();
});

// ====================== Sidebar Toggle ======================
function isMobile() { return window.innerWidth <= 768; }

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (isMobile()) {
    const isOpen = sb.classList.contains('mobile-open');
    sb.classList.toggle('mobile-open', !isOpen);
    sb.classList.remove('collapsed');
    overlay.classList.toggle('active', !isOpen);
  } else {
    sb.classList.toggle('collapsed');
    sb.classList.remove('mobile-open');
    overlay.classList.remove('active');
    const mb = document.getElementById('menuBtn');
    mb.style.display = sb.classList.contains('collapsed') ? 'flex' : 'none';
  }
}

function closeMobileSidebar() {
  if (isMobile()) {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebarOverlay').classList.remove('active');
  }
}

document.getElementById('sidebarOverlay').addEventListener('click', closeMobileSidebar);

// ====================== Keyboard Shortcuts ======================
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
    e.preventDefault();
    createDoc();
  }
});

// ====================== Sharing ======================
let sharedDocs = {};

async function loadSharedDocs() {
  try {
    const rows = await api('/docs/shared');
    sharedDocs = {};
    rows.forEach(r => {
      sharedDocs[r.id] = {
        id: r.id, title: r.title || '', content: r.content || '',
        icon: r.icon || '📄', parentId: r.parent_id,
        permission: r.permission, ownerName: r.owner_name,
        ownerEmail: r.owner_email, sharedAt: r.shared_at,
        sort_order: r.sort_order || 0, tags: r.tags || [], isShared: true
      };
    });
  } catch (err) {
    console.error('Failed to load shared docs:', err);
  }
}

function renderSharedSection() {
  const tree = document.getElementById('docTree');
  const ids = Object.keys(sharedDocs);
  if (ids.length === 0) return;

  const label = document.createElement('div');
  label.className = 'sidebar-section-label';
  label.textContent = 'Shared with me';
  tree.appendChild(label);

  const filter = document.getElementById('searchInput').value.toLowerCase();

  ids.forEach(id => {
    const doc = sharedDocs[id];
    if (filter && !(doc.title || 'Untitled').toLowerCase().includes(filter) && !(doc.content || '').toLowerCase().includes(filter)) return;

    const item = document.createElement('div');
    item.className = 'tree-item' + (state.activeId === 'shared-' + id ? ' active' : '');
    item.dataset.id = 'shared-' + id;

    const spacer = document.createElement('span');
    spacer.className = 'chevron hidden';
    spacer.innerHTML = '&#9654;';

    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = doc.icon || '📄';

    const labelEl = document.createElement('span');
    labelEl.className = 'label';
    labelEl.textContent = doc.title || 'Untitled';

    const badge = document.createElement('span');
    badge.className = 'shared-badge';
    badge.textContent = doc.permission === 'editor' ? 'edit' : 'view';

    item.appendChild(spacer);
    item.appendChild(icon);
    item.appendChild(labelEl);
    item.appendChild(badge);
    item.onclick = () => selectSharedDoc(id);

    tree.appendChild(item);
  });
}

function selectSharedDoc(id) {
  if (state.activeId && state.docs[state.activeId]) saveCurrentDoc();

  const doc = sharedDocs[id];
  if (!doc) return;

  state.activeId = 'shared-' + id;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('editorContainer').style.display = 'block';

  document.getElementById('docTitle').value = doc.title || '';
  document.getElementById('editor').innerHTML = doc.content || '';
  document.getElementById('iconPicker').textContent = doc.icon || '📄';

  const isEditor = doc.permission === 'editor';
  document.getElementById('editor').contentEditable = isEditor ? 'true' : 'false';
  document.getElementById('docTitle').readOnly = !isEditor;
  document.getElementById('readonlyBadge').style.display = isEditor ? 'none' : 'inline';
  document.getElementById('shareBtn').style.display = 'none';

  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '<span style="color:var(--text-secondary)">' + esc(doc.ownerName) + '</span> <span style="opacity:0.3">›</span> <span>' + esc(doc.title || 'Untitled') + '</span>';

  renderTree(document.getElementById('searchInput').value);
  closeMobileSidebar();
}

async function saveSharedDoc() {
  const match = String(state.activeId).match(/^shared-(\d+)$/);
  if (!match) return;
  const id = match[1];
  const doc = sharedDocs[id];
  if (!doc || doc.permission !== 'editor') return;

  doc.title = document.getElementById('docTitle').value;
  doc.content = document.getElementById('editor').innerHTML;

  try {
    await api('/docs/' + id + '/shared', {
      method: 'PUT',
      body: JSON.stringify({
        title: doc.title, content: doc.content, icon: doc.icon,
        parent_id: doc.parentId || null, sort_order: doc.sort_order || 0,
        tags: doc.tags || []
      })
    });
  } catch (err) {
    console.error('Failed to save shared doc:', err);
  }
}

function openShareModal() {
  if (!state.activeId || String(state.activeId).startsWith('shared-')) return;
  const doc = state.docs[state.activeId];
  if (!doc) return;

  document.getElementById('shareModalTitle').textContent = 'Share "' + (doc.title || 'Untitled') + '"';
  document.getElementById('shareError').style.display = 'none';
  document.getElementById('shareEmail').value = '';
  document.getElementById('shareOverlay').classList.add('active');
  loadShareList();
}

function closeShareModal() {
  document.getElementById('shareOverlay').classList.remove('active');
}

async function loadShareList() {
  if (!state.activeId || String(state.activeId).startsWith('shared-')) return;
  const list = document.getElementById('shareList');
  list.innerHTML = '<div style="color:var(--text-secondary);font-size:12px;padding:8px 0;">Loading...</div>';

  try {
    const shares = await api('/docs/' + state.activeId + '/shares');
    list.innerHTML = '';
    if (shares.length === 0) {
      list.innerHTML = '<div style="color:var(--text-secondary);font-size:13px;padding:12px 0;">Not shared with anyone yet</div>';
      return;
    }
    shares.forEach(s => {
      const item = document.createElement('div');
      item.className = 'share-item';
      item.innerHTML =
        '<div class="share-info"><div class="share-name">' + esc(s.name) + '</div><div class="share-email">' + esc(s.email) + '</div></div>' +
        '<span class="share-perm">' + esc(s.permission) + '</span>' +
        '<button class="share-remove" title="Remove" onclick="removeShare(' + state.activeId + ',' + s.user_id + ')">✕</button>';
      list.appendChild(item);
    });
  } catch (err) {
    list.innerHTML = '<div style="color:var(--danger);font-size:12px;padding:8px 0;">Failed to load shares</div>';
  }
}

async function handleShare(e) {
  e.preventDefault();
  if (!state.activeId) return;

  const errEl = document.getElementById('shareError');
  errEl.style.display = 'none';

  const email = document.getElementById('shareEmail').value;
  const permission = document.getElementById('sharePerm').value;

  try {
    await api('/docs/' + state.activeId + '/share', {
      method: 'POST',
      body: JSON.stringify({ email, permission })
    });
    document.getElementById('shareEmail').value = '';
    loadShareList();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
}

async function removeShare(docId, userId) {
  try {
    await api('/docs/' + docId + '/share/' + userId, { method: 'DELETE' });
    loadShareList();
  } catch (err) {
    console.error('Failed to remove share:', err);
  }
}

// ====================== Init ======================
(async function init() {
  if (authToken) {
    try {
      currentUser = await api('/auth/me');
      enterApp();
    } catch (err) {
      authToken = null;
      localStorage.removeItem('docs_token');
    }
  }
})();
