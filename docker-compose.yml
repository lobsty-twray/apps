services:
  shared-assets:
    build: ./shared-assets
    container_name: lobsty-shared-assets
    restart: always
    ports:
    - 8199:3000
    volumes:
    - ./shared:/app/shared:ro
  lobsty-dashboard:
    build: ./lobsty-dashboard
    container_name: lobsty-dashboard
    ports:
    - 8115:3000
    environment:
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/lobsty_dashboard
    - ADMIN_PASSWORD=ray2026
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  board:
    build: ./board
    container_name: lobsty-board
    restart: always
    ports:
    - 8091:3000
    volumes:
    - board-data:/app/data
    environment:
    - NODE_ENV=production
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3000/api/projects
      interval: 30s
      timeout: 10s
      retries: 3
  docs:
    build: ./docs
    container_name: lobsty-docs
    restart: always
    ports:
    - 8093:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/docs
    - JWT_SECRET=***REMOVED***
    - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://localhost:3000/api/auth/me'', r => process.exit(r.statusCode
        < 500 ? 0 : 1)).on(''error'', () => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
  drafts:
    build: ./drafts
    container_name: lobsty-drafts
    restart: always
    ports:
    - 8094:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/drafts
    - JWT_SECRET=lobsty-drafts-jwt-secret-2026
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://localhost:3000/api/auth/me'', r => process.exit(r.statusCode
        < 500 ? 0 : 1)).on(''error'', () => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
  shop:
    build: ./shop
    container_name: lobsty-shop
    restart: always
    ports:
    - 8096:3000
    volumes:
    - shop-uploads:/app/uploads
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/shop
    - JWT_SECRET=lobsty-shop-jwt-secret-2026
    - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
    - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    - BASE_URL=https://shop.twray.dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://localhost:3000/api/products'', (res) => {
        process.exit(res.statusCode === 200 ? 0 : 1) }).on(''error'', () => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
  video-pipeline:
    build: ./video-pipeline
    container_name: lobsty-video-pipeline
    restart: always
    ports:
    - 8097:3000
    volumes:
    - video-pipeline-uploads:/app/uploads
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/video-pipeline
    - JWT_SECRET=lobsty-video-pipeline-jwt-secret-2026
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://localhost:3000/api/auth/me'', r => process.exit(r.statusCode
        < 500 ? 0 : 1)).on(''error'', () => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
  stock-monitor:
    build: ./stock-monitor
    container_name: lobsty-stock-monitor
    restart: always
    ports:
    - 8098:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/stock_monitor
    - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    - BESTBUY_API_KEY=${BESTBUY_API_KEY:-}
    - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
    - NTFY_TOPIC=${NTFY_TOPIC:-}
    - AUTOBUY_ENCRYPTION_KEY=${AUTOBUY_ENCRYPTION_KEY:-} - AUTOBUY_ADMIN_PASSWORD=${AUTOBUY_ADMIN_PASSWORD:-ray2026}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://localhost:3000/api/products'', r => process.exit(r.statusCode
        < 500 ? 0 : 1)).on(''error'', () => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
  postgres:
    image: postgres:16-alpine
    container_name: lobsty-postgres
    restart: always
    ports:
    - 5432:5432
    environment:
    - POSTGRES_USER=lobsty
    - POSTGRES_PASSWORD=lobsty2026
    - POSTGRES_DB=lobsty_main
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U lobsty
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
  youtube-studio:
    build: ./youtube-studio
    container_name: lobsty-youtube-studio
    restart: always
    ports:
    - 8099:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/youtube_studio
    depends_on:
      postgres:
        condition: service_healthy
  hardware-monitor:
    build: ./hardware-monitor
    container_name: lobsty-hardware-monitor
    restart: always
    ports:
    - 8100:3000
    privileged: true
    pid: host
    environment:
    - NODE_ENV=production
  gear-inventory:
    build: ./gear-inventory
    container_name: lobsty-gear-inventory
    restart: always
    ports:
    - 8101:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/gear_inventory
    volumes:
    - gear-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
  content-calendar:
    build: ./content-calendar
    container_name: lobsty-content-calendar
    restart: always
    ports:
    - 8102:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/content_calendar
    depends_on:
      postgres:
        condition: service_healthy
  benchmark-tracker:
    build: ./benchmark-tracker
    container_name: lobsty-benchmark-tracker
    restart: always
    ports:
    - 8103:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/benchmark_tracker
    depends_on:
      postgres:
        condition: service_healthy
  script-writer:
    build: ./script-writer
    container_name: lobsty-script-writer
    restart: always
    ports:
    - 8104:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/script_writer
    depends_on:
      postgres:
        condition: service_healthy
  sponsor-manager:
    build: ./sponsor-manager
    container_name: lobsty-sponsor-manager
    restart: always
    ports:
    - 8105:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/sponsor_manager
    depends_on:
      postgres:
        condition: service_healthy
  content-ideas:
    build: ./content-ideas
    container_name: lobsty-content-ideas
    restart: always
    ports:
    - 8106:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/content_ideas
    depends_on:
      postgres:
        condition: service_healthy
  gaming-logger:
    build: ./gaming-logger
    container_name: lobsty-gaming-logger
    restart: always
    ports:
    - 8107:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/gaming_logger
    depends_on:
      postgres:
        condition: service_healthy
  thumbnail-analyzer:
    build: ./thumbnail-analyzer
    container_name: lobsty-thumbnail-analyzer
    restart: always
    ports:
    - 8108:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/thumbnail_analyzer
    depends_on:
      postgres:
        condition: service_healthy
  stream-planner:
    build: ./stream-planner
    container_name: lobsty-stream-planner
    restart: always
    ports:
    - 8109:3000
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/stream_planner
    depends_on:
      postgres:
        condition: service_healthy
  app-hub:
    build: ./app-hub
    container_name: lobsty-app-hub
    restart: always
    ports:
    - 8110:3000
    environment:
    - NODE_ENV=production
  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    restart: always
    command: hbbs
    ports:
    - 21115:21115
    - 21116:21116
    - 21116:21116/udp
    - 21118:21118
    volumes:
    - rustdesk-data:/root
  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    restart: always
    command: hbbr
    ports:
    - 21117:21117
    - 21119:21119
    volumes:
    - rustdesk-data:/root
  landing-page:
    build: ./landing-page
    container_name: lobsty-landing-page
    restart: always
    ports:
    - 8111:80
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('http').get('http://localhost:80',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
    - landing-page-data:/data
  admin-dashboard:
    build: ./admin-dashboard
    container_name: lobsty-admin-dashboard
    restart: always
    ports:
    - 8112:3000
    environment:
    - NODE_ENV=production
    - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    - SESSION_SECRET=admin-dashboard-session-2026
    - CALLBACK_URL=https://admin.twray.dev/auth/google/callback
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /home/lobsty/backups:/backups:ro
    - /home/lobsty/apps:/host-apps:ro
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'require("http").get("http://localhost:3000", r => process.exit(r.statusCode
        < 500 ? 0 : 1)).on("error", () => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
  komodo-postgres:
    image: ghcr.io/ferretdb/postgres-documentdb
    container_name: komodo-postgres
    labels:
      komodo.skip: ''
    restart: unless-stopped
    volumes:
    - komodo-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: komodo
      POSTGRES_PASSWORD: komodo2026
      POSTGRES_DB: postgres
  komodo-ferretdb:
    image: ghcr.io/ferretdb/ferretdb
    container_name: komodo-ferretdb
    labels:
      komodo.skip: ''
    restart: unless-stopped
    depends_on:
    - komodo-postgres
    volumes:
    - komodo-ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://komodo:komodo2026@komodo-postgres:5432/postgres
  komodo-core:
    image: ghcr.io/moghtech/komodo-core:latest
    container_name: komodo-core
    labels:
      komodo.skip: ''
    restart: unless-stopped
    depends_on:
    - komodo-ferretdb
    ports:
    - 9120:9120
    env_file: ./komodo/compose.env
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-ferretdb:27017
      KOMODO_DATABASE_USERNAME: komodo
      KOMODO_DATABASE_PASSWORD: komodo2026
    volumes:
    - komodo-backups:/backups
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:latest
    container_name: komodo-periphery
    labels:
      komodo.skip: ''
    restart: unless-stopped
    env_file: ./komodo/compose.env
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /home/lobsty/backups:/backups:ro
    - /home/lobsty/apps:/host-apps:ro
    - /proc:/proc
    - /etc/komodo:/etc/komodo
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    ports:
    - 19999:19999
    cap_add:
    - SYS_PTRACE
    - SYS_ADMIN
    security_opt:
    - apparmor:unconfined
    volumes:
    - netdata-config:/etc/netdata
    - netdata-lib:/var/lib/netdata
    - netdata-cache:/var/cache/netdata
    - /etc/passwd:/host/etc/passwd:ro
    - /etc/group:/host/etc/group:ro
    - /etc/localtime:/etc/localtime:ro
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /etc/os-release:/host/etc/os-release:ro
    - /var/log:/host/var/log:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /home/lobsty/backups:/backups:ro
    - /home/lobsty/apps:/host-apps:ro
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
    - 53:53/tcp
    - 53:53/udp
    - 8053:80/tcp
    environment:
      TZ: America/New_York
      WEBPASSWORD: ray2026
      FTLCONF_LOCAL_IPV4: 192.168.50.121
      PIHOLE_DNS_: 1.1.1.1;8.8.8.8
    volumes:
    - pihole-etc:/etc/pihole
    - pihole-dnsmasq:/etc/dnsmasq.d
    healthcheck:
      test:
      - CMD
      - dig
      - +norecurse
      - +retry=0
      - '@127.0.0.1'
      - pi.hole
      interval: 30s
      timeout: 10s
      retries: 3
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: lobsty-open-webui
    restart: unless-stopped
    ports:
    - 8113:8080
    volumes:
    - open-webui-data:/app/backend/data
    environment:
    - OLLAMA_BASE_URL=
    - OPENAI_API_BASE_URLS=http://192.168.50.59:1234/v1;http://REPLACE_WITH_5090_IP:1234/v1
    - OPENAI_API_KEYS=lm-studio;lm-studio
    - WEBUI_AUTH=true
    - WEBUI_NAME=Tech with Ray AI
    - DEFAULT_LOCALE=en
    - ENABLE_SIGNUP=true
    - DEFAULT_USER_ROLE=pending
    - ENABLE_LOGIN_FORM=true
    - ENABLE_WEB_SEARCH=true
    - WEB_SEARCH_ENGINE=duckduckgo
    - ENABLE_COMMUNITY_SHARING=false
    - ENABLE_MODEL_FILTER=false
    - ENABLE_AUTOCOMPLETE_GENERATION=true
    - AUTOCOMPLETE_GENERATION_INPUT_MAX_LENGTH=4096
    - WEBUI_BANNERS=[{"id":"welcome","type":"info","title":"Welcome to Tech with Ray
      AI","content":"Powered by local models on Apple Silicon & NVIDIA GPUs","dismissible":true}]
  todo:
    build: ./todo
    container_name: lobsty-todo
    restart: unless-stopped
    ports:
    - 8090:3000
    environment:
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/lobsty_main
    depends_on:
      postgres:
        condition: service_healthy
  budget-tracker:
    build: ./budget
    container_name: lobsty-budget
    restart: always
    ports:
    - 8092:3000
    volumes:
    - budget-data:/app/data
    environment:
    - NODE_ENV=production
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3000/api/categories
      interval: 30s
      timeout: 10s
      retries: 3
  chat:
    build: ./chat
    container_name: chat
    extra_hosts:
    - nas:192.100.2.1
    restart: unless-stopped
    ports:
    - 8114:8114
    environment:
    - PORT=8114
    - DATABASE_URL=postgresql://lobsty:lobsty2026@postgres:5432/chat
    - GATEWAY_WS=ws://192.100.2.1:18789
    depends_on:
      postgres:
        condition: service_healthy
  form-api:
    build: ./form-api
    container_name: lobsty-form-api
    restart: unless-stopped
    ports:
    - 8116:3000
    environment:
    - DEST_EMAIL=rayscriptsjs@gmail.com
    - SMTP_USER=rayscriptsjs@gmail.com
    - SMTP_PASS=dyqo rmqm cluq qolk
  frida-painting:
    build: ./frida-painting
    container_name: lobsty-frida-painting
    restart: unless-stopped
    ports:
      - "8117:3000"
    environment:
      - PORT=3000

  frida-painting-v2:
    build: ./frida-painting-v2
    container_name: lobsty-frida-painting-v2
    restart: unless-stopped
    ports:
      - "8118:3000"
    environment:
      - PORT=3000

volumes:
  open-webui-data:
    driver: local
  pihole-etc:
    driver: local
  pihole-dnsmasq:
    driver: local
  budget-data:
    driver: local
  board-data:
    driver: local
  shop-uploads:
    driver: local
  video-pipeline-uploads:
    driver: local
  postgres-data:
    driver: local
  rustdesk-data:
    driver: local
  gear-uploads:
    driver: local
  komodo-postgres-data:
    driver: local
  komodo-ferretdb-state:
    driver: local
  komodo-backups:
    driver: local
  netdata-config:
    driver: local
  netdata-lib:
    driver: local
  netdata-cache:
    driver: local
  budget-tracker: null
  landing-page-data: null
