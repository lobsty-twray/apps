<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobsty Budget</title>
    <link rel="stylesheet" href="style.css?v=1771353943">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <span class="logo">🦞</span>
            <h1>Lobsty Budget</h1>
        </div>
        <div class="nav-date">
            <select id="monthSelect">
                <option value="1">Jan</option>
                <option value="2">Feb</option>
                <option value="3">Mar</option>
                <option value="4">Apr</option>
                <option value="5">May</option>
                <option value="6">Jun</option>
                <option value="7">Jul</option>
                <option value="8">Aug</option>
                <option value="9">Sep</option>
                <option value="10">Oct</option>
                <option value="11">Nov</option>
                <option value="12">Dec</option>
            </select>
            <select id="yearSelect"></select>
        </div>
    </nav>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="nav-item active" data-view="dashboard">📊 Dashboard</div>
        <div class="nav-item" data-view="transactions">💳 Transactions</div>
        <div class="nav-item" data-view="categories">🏷️ Categories</div>
        <div class="nav-item" data-view="budgets">🎯 Budgets</div>
        <div class="nav-item" data-view="trends">📈 Trends</div>
    </div>

    <!-- Bottom navigation for mobile -->
    <nav class="bottom-nav" id="bottom-nav">
        <button class="bottom-nav-item active" data-view="dashboard">
            <span class="bottom-nav-icon">📊</span>
            <span class="bottom-nav-label">Dashboard</span>
        </button>
        <button class="bottom-nav-item" data-view="transactions">
            <span class="bottom-nav-icon">💳</span>
            <span class="bottom-nav-label">Transactions</span>
        </button>
        <button class="bottom-nav-item" data-view="categories">
            <span class="bottom-nav-icon">🏷️</span>
            <span class="bottom-nav-label">Categories</span>
        </button>
        <button class="bottom-nav-item" data-view="budgets">
            <span class="bottom-nav-icon">🎯</span>
            <span class="bottom-nav-label">Budgets</span>
        </button>
        <button class="bottom-nav-item" data-view="trends">
            <span class="bottom-nav-icon">📈</span>
            <span class="bottom-nav-label">Trends</span>
        </button>
    </nav>

    <main class="main-content">
        <!-- Dashboard View -->
        <div id="dashboard-view" class="view active">
            <div class="summary-cards">
                <div class="card income-card">
                    <h3>Total Income</h3>
                    <div class="amount" id="total-income">$0.00</div>
                </div>
                <div class="card expense-card">
                    <h3>Total Expenses</h3>
                    <div class="amount" id="total-expenses">$0.00</div>
                </div>
                <div class="card savings-card">
                    <h3>Net Savings</h3>
                    <div class="amount" id="net-savings">$0.00</div>
                </div>
            </div>
            
            <div class="chart-container">
                <h2>Spending by Category</h2>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <!-- Transactions View -->
        <div id="transactions-view" class="view">
            <div class="view-header">
                <h2>Transactions</h2>
                <div class="filters">
                    <select id="typeFilter">
                        <option value="">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="openTransactionModal()">+ Add Transaction</button>
            </div>
            
            <div class="transaction-list" id="transaction-list"></div>
        </div>

        <!-- Categories View -->
        <div id="categories-view" class="view">
            <div class="view-header">
                <h2>Categories</h2>
                <button class="btn btn-primary" onclick="openCategoryModal()">+ Add Category</button>
            </div>
            
            <div class="category-grid" id="category-grid"></div>
        </div>

        <!-- Budgets View -->
        <div id="budgets-view" class="view">
            <div class="view-header">
                <h2>Budget Limits</h2>
                <button class="btn btn-primary" onclick="openBudgetModal()">+ Set Budget</button>
            </div>
            
            <div class="budget-list" id="budget-list"></div>
        </div>

        <!-- Trends View -->
        <div id="trends-view" class="view">
            <h2>Monthly Trends</h2>
            <div class="chart-container">
                <canvas id="trendsChart"></canvas>
            </div>
        </div>
    </main>

    <!-- Transaction Modal -->
    <div id="transaction-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="transaction-modal-title">Add Transaction</h3>
                <span class="close" onclick="closeTransactionModal()">&times;</span>
            </div>
            <form id="transaction-form">
                <div class="form-group">
                    <label>Type</label>
                    <select name="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" name="amount" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select name="category_id" id="transaction-category-select" required></select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="date" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" name="description">
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="recurring">
                        Recurring transaction
                    </label>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeTransactionModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Category</h3>
                <span class="close" onclick="closeCategoryModal()">&times;</span>
            </div>
            <form id="category-form">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select name="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                        <option value="both">Both</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="color" name="color" value="#646cff" required>
                </div>
                <div class="form-group">
                    <label>Icon (emoji)</label>
                    <input type="text" name="icon" required placeholder="🏷️">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCategoryModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Budget Modal -->
    <div id="budget-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Set Budget</h3>
                <span class="close" onclick="closeBudgetModal()">&times;</span>
            </div>
            <form id="budget-form">
                <div class="form-group">
                    <label>Category</label>
                    <select name="category_id" id="budget-category-select" required></select>
                </div>
                <div class="form-group">
                    <label>Monthly Limit</label>
                    <input type="number" name="amount" step="0.01" min="0" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeBudgetModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js?v=1771353943"></script>
</body>
</html>
