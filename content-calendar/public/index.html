<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Calendar - Tech with Ray</title>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .calendar-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9em;
        }

        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #667eea;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .notes-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .note {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .note-date {
            color: #999;
            font-size: 0.8em;
        }

        .note-text {
            color: #333;
        }

        .fc-event {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Content Calendar</h1>
            <p class="subtitle">Plan, schedule, and track all your content</p>
        </header>

        <div class="stats" id="stats"></div>

        <div class="calendar-container">
            <div class="controls">
                <button class="btn" onclick="showCreateModal()">➕ New Event</button>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #e74c3c;"></div>
                        <span>Video Release</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #3498db;"></div>
                        <span>Sponsor Content</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #2ecc71;"></div>
                        <span>Social Post</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #9b59b6;"></div>
                        <span>Stream</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #f39c12;"></div>
                        <span>Collab</span>
                    </div>
                </div>
            </div>
            <div id="calendar"></div>
        </div>
    </div>

    <!-- Event Modal -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create Event</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <form id="eventForm">
                <input type="hidden" id="eventId">
                
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="eventTitle" required>
                </div>

                <div class="form-group">
                    <label>Type *</label>
                    <select id="eventType" required onchange="updateEventColor()">
                        <option value="video_release">Video Release</option>
                        <option value="sponsor_content">Sponsor Content</option>
                        <option value="social_post">Social Post</option>
                        <option value="stream">Stream</option>
                        <option value="collab">Collab</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Start Date & Time *</label>
                    <input type="datetime-local" id="eventStart" required>
                </div>

                <div class="form-group">
                    <label>End Date & Time</label>
                    <input type="datetime-local" id="eventEnd">
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="eventAllDay">
                    <label for="eventAllDay">All Day Event</label>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="eventStatus">
                        <option value="planned">Planned</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="eventDescription"></textarea>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn">Save Event</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="button" class="btn btn-danger" id="deleteBtn" style="display: none;" onclick="deleteEvent()">Delete</button>
                </div>
            </form>

            <div class="notes-section" id="notesSection" style="display: none;">
                <h3>Notes</h3>
                <div id="notesList"></div>
                <div class="form-group">
                    <textarea id="newNote" placeholder="Add a note..."></textarea>
                    <button class="btn" style="margin-top: 10px;" onclick="addNote()">Add Note</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';
        let calendar;
        let currentEventId = null;

        const eventColors = {
            video_release: '#e74c3c',
            sponsor_content: '#3498db',
            social_post: '#2ecc71',
            stream: '#9b59b6',
            collab: '#f39c12',
            other: '#95a5a6'
        };

        document.addEventListener('DOMContentLoaded', function() {
            initCalendar();
            loadStats();
            loadEvents();
        });

        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listMonth'
                },
                editable: true,
                droppable: true,
                eventClick: function(info) {
                    showEditModal(info.event.id);
                },
                eventDrop: function(info) {
                    updateEventDates(info.event);
                },
                eventResize: function(info) {
                    updateEventDates(info.event);
                }
            });
            calendar.render();
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/api/stats`);
                const stats = await response.json();
                
                let statsHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.total}</div>
                        <div class="stat-label">Total Events</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.upcoming}</div>
                        <div class="stat-label">Upcoming</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.this_month}</div>
                        <div class="stat-label">This Month</div>
                    </div>
                `;
                
                document.getElementById('stats').innerHTML = statsHTML;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadEvents() {
            try {
                const response = await fetch(`${API_URL}/api/events`);
                const events = await response.json();
                
                calendar.removeAllEvents();
                
                events.forEach(event => {
                    calendar.addEvent({
                        id: event.id,
                        title: event.title,
                        start: event.start_date,
                        end: event.end_date,
                        allDay: event.all_day,
                        backgroundColor: event.color || eventColors[event.event_type],
                        borderColor: event.color || eventColors[event.event_type]
                    });
                });
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }

        function showCreateModal() {
            document.getElementById('modalTitle').textContent = 'Create Event';
            document.getElementById('eventForm').reset();
            document.getElementById('eventId').value = '';
            document.getElementById('deleteBtn').style.display = 'none';
            document.getElementById('notesSection').style.display = 'none';
            document.getElementById('eventModal').classList.add('active');
            updateEventColor();
        }

        async function showEditModal(eventId) {
            try {
                const response = await fetch(`${API_URL}/api/events/${eventId}`);
                const event = await response.json();
                
                document.getElementById('modalTitle').textContent = 'Edit Event';
                document.getElementById('eventId').value = event.id;
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventType').value = event.event_type;
                document.getElementById('eventStart').value = formatDateTimeLocal(event.start_date);
                document.getElementById('eventEnd').value = event.end_date ? formatDateTimeLocal(event.end_date) : '';
                document.getElementById('eventAllDay').checked = event.all_day;
                document.getElementById('eventStatus').value = event.status;
                document.getElementById('eventDescription').value = event.description || '';
                
                document.getElementById('deleteBtn').style.display = 'block';
                document.getElementById('notesSection').style.display = 'block';
                
                currentEventId = event.id;
                loadNotes(event.notes || []);
                
                document.getElementById('eventModal').classList.add('active');
            } catch (error) {
                console.error('Error loading event:', error);
            }
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
            currentEventId = null;
        }

        function updateEventColor() {
            const type = document.getElementById('eventType').value;
            // Visual feedback could be added here
        }

        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const eventData = {
                title: document.getElementById('eventTitle').value,
                description: document.getElementById('eventDescription').value,
                event_type: document.getElementById('eventType').value,
                start_date: document.getElementById('eventStart').value,
                end_date: document.getElementById('eventEnd').value || null,
                all_day: document.getElementById('eventAllDay').checked,
                status: document.getElementById('eventStatus').value,
                color: eventColors[document.getElementById('eventType').value]
            };
            
            try {
                const eventId = document.getElementById('eventId').value;
                const url = eventId ? `${API_URL}/api/events/${eventId}` : `${API_URL}/api/events`;
                const method = eventId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(eventData)
                });
                
                if (response.ok) {
                    closeModal();
                    loadEvents();
                    loadStats();
                }
            } catch (error) {
                console.error('Error saving event:', error);
                alert('Failed to save event');
            }
        });

        async function deleteEvent() {
            if (!confirm('Are you sure you want to delete this event?')) return;
            
            const eventId = document.getElementById('eventId').value;
            
            try {
                const response = await fetch(`${API_URL}/api/events/${eventId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    closeModal();
                    loadEvents();
                    loadStats();
                }
            } catch (error) {
                console.error('Error deleting event:', error);
                alert('Failed to delete event');
            }
        }

        async function updateEventDates(event) {
            try {
                const response = await fetch(`${API_URL}/api/events/${event.id}`);
                const eventData = await response.json();
                
                eventData.start_date = event.start.toISOString();
                eventData.end_date = event.end ? event.end.toISOString() : null;
                
                await fetch(`${API_URL}/api/events/${event.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(eventData)
                });
                
                loadStats();
            } catch (error) {
                console.error('Error updating event dates:', error);
            }
        }

        function loadNotes(notes) {
            const notesList = document.getElementById('notesList');
            if (notes.length === 0) {
                notesList.innerHTML = '<p style="color: #999;">No notes yet</p>';
                return;
            }
            
            notesList.innerHTML = notes.map(note => `
                <div class="note">
                    <div class="note-header">
                        <span class="note-date">${new Date(note.created_at).toLocaleString()}</span>
                        <button onclick="deleteNote(${note.id})" style="background: none; border: none; cursor: pointer; color: #dc3545;">✕</button>
                    </div>
                    <div class="note-text">${note.note}</div>
                </div>
            `).join('');
        }

        async function addNote() {
            const noteText = document.getElementById('newNote').value.trim();
            if (!noteText) return;
            
            try {
                const response = await fetch(`${API_URL}/api/events/${currentEventId}/notes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note: noteText })
                });
                
                if (response.ok) {
                    document.getElementById('newNote').value = '';
                    showEditModal(currentEventId); // Reload to show new note
                }
            } catch (error) {
                console.error('Error adding note:', error);
            }
        }

        async function deleteNote(noteId) {
            try {
                const response = await fetch(`${API_URL}/api/notes/${noteId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showEditModal(currentEventId); // Reload to remove deleted note
                }
            } catch (error) {
                console.error('Error deleting note:', error);
            }
        }

        function formatDateTimeLocal(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }
    </script>
</body>
</html>
