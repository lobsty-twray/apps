<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Writer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .sidebar, .editor-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 20px;
        }

        .sidebar h2, .editor-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .script-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .script-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .script-item:hover {
            background: #efefef;
            border-left-color: #667eea;
        }

        .script-item.active {
            background: #667eea;
            color: white;
            border-left-color: white;
        }

        .script-title {
            font-weight: bold;
            font-size: 0.95em;
            margin-bottom: 5px;
        }

        .script-meta {
            font-size: 0.8em;
            opacity: 0.7;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .editor-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .editor-controls input, .editor-controls select {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .editor-controls input:focus, .editor-controls select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            width: 100%;
            height: 400px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .editor-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #e0e0e0;
        }

        .word-count {
            color: #666;
            font-size: 0.9em;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .btn-small:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .template-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .template-item {
            padding: 10px;
            background: white;
            border-radius: 5px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .template-item:hover {
            background: #e8e9ff;
            transform: translateX(5px);
        }

        @media (max-width: 800px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✍️ Script Writer</h1>
            <p>Create and manage video scripts</p>
        </header>

        <div class="stats" id="stats"></div>

        <div class="main-grid">
            <div class="sidebar">
                <h2>Scripts</h2>
                <button class="btn" onclick="newScript()">+ New Script</button>
                
                <div class="script-list" id="scriptList">
                    <div style="text-align: center; color: #999; padding: 20px;">Loading...</div>
                </div>

                <div class="template-section">
                    <h3 style="font-size: 0.95em; margin-bottom: 10px;">Templates</h3>
                    <div id="templateList"></div>
                </div>
            </div>

            <div class="editor-section">
                <h2>Editor</h2>
                
                <div class="editor-controls">
                    <input type="text" id="scriptTitle" placeholder="Script Title" required>
                    <input type="text" id="videoSeries" placeholder="Series (e.g., Reviews)">
                    <select id="scriptStatus">
                        <option value="draft">Draft</option>
                        <option value="review">In Review</option>
                        <option value="published">Published</option>
                    </select>
                </div>

                <textarea id="scriptContent" placeholder="Start writing your script..."></textarea>

                <div class="editor-footer">
                    <div class="word-count">
                        <span id="wordCount">0</span> words
                        <span id="duration" style="margin-left: 20px;">~0 min read</span>
                    </div>
                    <div class="editor-actions">
                        <button class="btn-small" onclick="saveScript()">Save</button>
                        <button class="btn-small btn-danger" id="deleteBtn" onclick="deleteScript()" style="display: none;">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '';
        let currentScriptId = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadScripts();
            loadTemplates();
            
            document.getElementById('scriptContent').addEventListener('input', updateWordCount);
        });

        async function loadStats() {
            try {
                const res = await fetch(`${API}/api/stats`);
                const stats = await res.json();
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_scripts}</div>
                        <div class="stat-label">Total Scripts</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.drafts}</div>
                        <div class="stat-label">Drafts</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.published}</div>
                        <div class="stat-label">Published</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.avg_word_count}</div>
                        <div class="stat-label">Avg Words</div>
                    </div>
                `;
            } catch (err) {
                console.error('Error loading stats:', err);
            }
        }

        async function loadScripts() {
            try {
                const res = await fetch(`${API}/api/scripts`);
                const scripts = await res.json();
                
                const html = scripts.map(s => `
                    <div class="script-item" onclick="editScript(${s.id})">
                        <div class="script-title">${s.title}</div>
                        <div class="script-meta">${s.video_series || 'Uncategorized'} • ${s.status} • ${s.word_count} words</div>
                    </div>
                `).join('');
                
                document.getElementById('scriptList').innerHTML = html || '<div style="text-align: center; color: #999; padding: 20px;">No scripts yet</div>';
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function loadTemplates() {
            try {
                const res = await fetch(`${API}/api/templates`);
                const templates = await res.json();
                
                const html = templates.map(t => `
                    <div class="template-item" onclick="loadTemplate(${t.id})">${t.name}</div>
                `).join('');
                
                document.getElementById('templateList').innerHTML = html;
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function loadTemplate(id) {
            try {
                const res = await fetch(`${API}/api/templates/${id}`);
                const template = await res.json();
                document.getElementById('scriptContent').value = template.structure;
                updateWordCount();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function newScript() {
            currentScriptId = null;
            document.getElementById('scriptTitle').value = '';
            document.getElementById('videoSeries').value = '';
            document.getElementById('scriptStatus').value = 'draft';
            document.getElementById('scriptContent').value = '';
            document.getElementById('deleteBtn').style.display = 'none';
            updateWordCount();
        }

        async function editScript(id) {
            try {
                const res = await fetch(`${API}/api/scripts/${id}`);
                const script = await res.json();
                
                currentScriptId = id;
                document.getElementById('scriptTitle').value = script.title;
                document.getElementById('videoSeries').value = script.video_series || '';
                document.getElementById('scriptStatus').value = script.status;
                document.getElementById('scriptContent').value = script.content;
                document.getElementById('deleteBtn').style.display = 'block';
                
                document.querySelectorAll('.script-item').forEach(el => el.classList.remove('active'));
                event.target.closest('.script-item')?.classList.add('active');
                
                updateWordCount();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function saveScript() {
            const title = document.getElementById('scriptTitle').value.trim();
            const content = document.getElementById('scriptContent').value.trim();
            
            if (!title || !content) {
                alert('Title and content are required');
                return;
            }
            
            const data = {
                title,
                video_series: document.getElementById('videoSeries').value || null,
                content,
                status: document.getElementById('scriptStatus').value
            };
            
            try {
                const method = currentScriptId ? 'PUT' : 'POST';
                const url = currentScriptId ? `${API}/api/scripts/${currentScriptId}` : `${API}/api/scripts`;
                
                await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                loadScripts();
                loadStats();
                alert('Saved successfully!');
            } catch (err) {
                console.error('Error:', err);
                alert('Failed to save');
            }
        }

        async function deleteScript() {
            if (!confirm('Delete this script?')) return;
            
            try {
                await fetch(`${API}/api/scripts/${currentScriptId}`, { method: 'DELETE' });
                newScript();
                loadScripts();
                loadStats();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function updateWordCount() {
            const content = document.getElementById('scriptContent').value;
            const words = content.trim().split(/\s+/).filter(w => w.length > 0).length;
            const duration = Math.ceil(words / 130);
            
            document.getElementById('wordCount').textContent = words;
            document.getElementById('duration').textContent = `~${duration} min read`;
        }
    </script>
</body>
</html>
