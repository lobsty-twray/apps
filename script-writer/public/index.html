<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="http://shared-assets:3000/design-tokens.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Script Writer - Tech with Ray</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root {
  --card:rgba(255,255,255,0.04);--card-h:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.15);
  --r:16px;--rs:10px;
}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes countUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* App Shell */
.app{display:flex;flex-direction:column;height:100vh}

/* Top Bar */
.top-bar{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glass-b);flex-shrink:0;backdrop-filter:blur(20px);background:rgba(10,10,15,.8);z-index:10}
.top-bar h1{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.top-bar h1 span{background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-actions{display:flex;gap:6px;align-items:center}
.icon-btn{background:var(--glass);border:1px solid var(--glass-b);color:var(--text2);border-radius:var(--rs);padding:8px 12px;font-size:.8rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px;min-height:44px}
.icon-btn:hover{background:var(--card-h);color:var(--text)}
.icon-btn.active{background:rgba(124,58,237,.15);color:var(--accent-h);border-color:rgba(124,58,237,.3)}

/* Stats */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px;border-bottom:1px solid var(--glass-b);flex-shrink:0}
.mini-stat{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:var(--rs);padding:10px;text-align:center;transition:all .3s}
.mini-stat .val{font-size:1.1rem;font-weight:700;animation:countUp .4s ease}
.mini-stat .lbl{font-size:.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.mini-stat:nth-child(1) .val{color:var(--purple)}
.mini-stat:nth-child(2) .val{color:var(--yellow)}
.mini-stat:nth-child(3) .val{color:var(--green)}
.mini-stat:nth-child(4) .val{color:var(--blue)}

/* Main layout */
.main{display:flex;flex:1;overflow:hidden;position:relative}

/* Sidebar */
.sidebar{width:100%;display:flex;flex-direction:column;border-right:1px solid var(--glass-b);overflow:hidden;background:var(--bg);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sidebar-header{padding:10px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--glass-b);flex-shrink:0}
.search-box{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--glass-b);color:var(--text);border-radius:var(--rs);padding:10px 12px;font-size:.8rem;font-family:inherit;outline:none;transition:border-color .2s;min-height:44px}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--text3)}
.new-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:10px 16px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;min-height:44px}
.new-btn:hover{background:var(--accent-h);box-shadow:0 0 20px var(--accent-g)}

.filter-row{padding:6px 16px;display:flex;gap:6px;border-bottom:1px solid var(--glass-b);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-chip{background:var(--glass);border:1px solid var(--glass-b);color:var(--text2);border-radius:20px;padding:5px 12px;font-size:.7rem;cursor:pointer;transition:all .2s;white-space:nowrap;min-height:32px;display:flex;align-items:center;gap:4px}
.filter-chip:hover,.filter-chip.active{background:rgba(124,58,237,.15);color:var(--accent-h);border-color:rgba(124,58,237,.3)}

.script-list{flex:1;overflow-y:auto;padding:6px 8px}
.script-item{padding:14px;border-radius:var(--rs);cursor:pointer;transition:all .2s;margin-bottom:4px;border:1px solid transparent;display:flex;flex-direction:column;gap:6px}
.script-item:hover{background:var(--card-h);border-color:var(--glass-b)}
.script-item.active{border-color:var(--accent);background:rgba(124,58,237,.08)}
.script-item-title{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.script-item-meta{display:flex;gap:8px;align-items:center;font-size:.7rem;color:var(--text3);flex-wrap:wrap}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:.65rem;font-weight:500}
.status-badge.draft{background:rgba(245,158,11,.12);color:var(--yellow)}
.status-badge.in_progress{background:rgba(96,165,250,.12);color:var(--blue)}
.status-badge.review{background:rgba(167,139,250,.12);color:var(--purple)}
.status-badge.published{background:rgba(16,185,129,.12);color:var(--green)}
.status-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.series-badge{background:rgba(124,58,237,.12);color:var(--accent-h);padding:2px 8px;border-radius:12px;font-size:.65rem;font-weight:500}
.script-item-date{font-size:.65rem;color:var(--text3);margin-left:auto}

/* Editor */
.editor-panel{flex:1;display:none;flex-direction:column;overflow:hidden;background:var(--bg)}
.editor-panel.active{display:flex}
.editor-top{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--glass-b);flex-shrink:0}
.back-btn{background:var(--glass);border:1px solid var(--glass-b);color:var(--text2);border-radius:8px;padding:8px 10px;cursor:pointer;transition:all .2s;font-size:.9rem;min-height:44px;display:flex;align-items:center}
.back-btn:hover{background:var(--card-h);color:var(--text)}
@media(min-width:768px){.back-btn{display:none}}
.editor-title-input{flex:1;background:transparent;border:none;color:var(--text);font-size:1.1rem;font-weight:700;outline:none;font-family:inherit}
.editor-title-input::placeholder{color:var(--text3)}
.auto-save-indicator{font-size:.7rem;color:var(--text3);display:flex;align-items:center;gap:4px;white-space:nowrap;transition:all .3s}
.auto-save-indicator.saving{color:var(--yellow)}
.auto-save-indicator.saved{color:var(--green)}
.auto-save-indicator .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.auto-save-indicator.saving .dot{animation:pulse 1s infinite}

/* Toolbar */
.editor-toolbar{padding:8px 16px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--glass-b);flex-shrink:0;flex-wrap:wrap}
.tb-group{display:flex;gap:4px;align-items:center}
.tb-group+.tb-group{padding-left:6px;border-left:1px solid var(--glass-b)}
.tb-select{background:rgba(255,255,255,.06);border:1px solid var(--glass-b);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.78rem;font-family:inherit;outline:none;min-height:36px;cursor:pointer}
.tb-select option{background:var(--bg3)}
.tb-input{background:rgba(255,255,255,.06);border:1px solid var(--glass-b);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.78rem;font-family:inherit;outline:none;min-height:36px}
.tb-btn{background:var(--glass);border:1px solid var(--glass-b);color:var(--text2);border-radius:8px;padding:6px 10px;font-size:.78rem;cursor:pointer;transition:all .2s;min-height:36px;display:flex;align-items:center;gap:4px}
.tb-btn:hover{background:var(--card-h);color:var(--text)}
.tb-btn.active{background:rgba(124,58,237,.15);color:var(--accent-h);border-color:rgba(124,58,237,.3)}

/* Editor content */
.editor-area{flex:1;overflow-y:auto;position:relative}
.editor-area textarea{width:100%;height:100%;background:transparent;border:none;color:var(--text);font-size:.9rem;line-height:1.85;resize:none;outline:none;font-family:'Inter',sans-serif;padding:20px 24px}
.editor-area textarea.mono{font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.9}
.editor-area .reading-view{padding:20px 24px;font-size:.95rem;line-height:2;color:rgba(255,255,255,.85);white-space:pre-wrap;word-wrap:break-word;max-width:720px}
.editor-area .reading-view.mono{font-family:'JetBrains Mono',monospace;font-size:.85rem}

/* Footer */
.editor-footer{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--glass-b);flex-shrink:0;font-size:.75rem;color:var(--text3);gap:8px}
.word-stats{display:flex;gap:12px;align-items:center}
.word-stats span{display:flex;align-items:center;gap:3px}
.word-stats .num{font-weight:600;color:var(--text2);transition:all .3s}
.editor-footer-actions{display:flex;gap:6px}
.save-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;min-height:44px}
.save-btn:hover{background:var(--accent-h);box-shadow:0 0 20px var(--accent-g)}
.del-btn{background:rgba(239,68,68,.08);color:var(--red);border:1px solid rgba(239,68,68,.15);border-radius:8px;padding:8px 12px;font-size:.8rem;cursor:pointer;transition:all .2s;min-height:44px}
.del-btn:hover{background:rgba(239,68,68,.2)}

/* Version History Panel */
.version-panel{position:absolute;right:0;top:0;bottom:0;width:300px;background:rgba(14,14,22,.97);backdrop-filter:blur(20px);border-left:1px solid var(--glass-b);z-index:20;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.version-panel.open{transform:translateX(0)}
.version-header{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glass-b)}
.version-header h3{font-size:.9rem;font-weight:600}
.version-list{flex:1;overflow-y:auto;padding:8px}
.version-item{padding:12px;border-radius:var(--rs);cursor:pointer;transition:all .2s;margin-bottom:4px;border:1px solid transparent}
.version-item:hover{background:var(--card-h);border-color:var(--glass-b)}
.version-item.active{border-color:var(--accent);background:rgba(124,58,237,.08)}
.version-item-ver{font-size:.8rem;font-weight:600}
.version-item-date{font-size:.7rem;color:var(--text3);margin-top:2px}
.version-item-words{font-size:.65rem;color:var(--text3)}

/* Mobile: swipe views */
.mobile-view .sidebar{position:absolute;inset:0;z-index:5;transform:translateX(0)}
.mobile-view .editor-panel{position:absolute;inset:0;z-index:5;transform:translateX(100%);display:flex!important}
.mobile-view.editing .sidebar{transform:translateX(-100%)}
.mobile-view.editing .editor-panel{transform:translateX(0)}

@media(min-width:768px){
  .sidebar{width:340px;position:relative!important;transform:none!important}
  .editor-panel{display:flex!important;position:relative!important;transform:none!important}
  .mobile-view .sidebar{transform:none!important}
  .mobile-view .editor-panel{transform:none!important}
  .mobile-view.editing .sidebar{transform:none!important}
  .fab{display:none!important}
  .version-panel{width:320px}
}
@media(max-width:479px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .version-panel{width:100%}
}

/* FAB */
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 24px var(--accent-g);z-index:50;display:flex;align-items:center;justify-content:center;transition:all .2s}
.fab:hover{transform:scale(1.1);box-shadow:0 6px 32px var(--accent-g)}
.editing .fab{display:none}
@media(min-width:768px){.fab{display:none}}

/* Template Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.overlay.active{display:flex}
@media(min-width:768px){.overlay.active{align-items:center}}
.modal{background:rgba(16,16,26,.97);backdrop-filter:blur(24px);border:1px solid var(--glass-b);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:640px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;animation:fadeIn .3s ease}
@media(min-width:768px){.modal{border-radius:var(--r)}}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--glass-b);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:1.1rem;font-weight:700}
.modal-close{background:none;border:none;color:var(--text3);font-size:1.2rem;cursor:pointer;padding:8px}
.modal-body{flex:1;overflow-y:auto;padding:16px}
.tmpl-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:480px){.tmpl-grid{grid-template-columns:repeat(2,1fr)}}
.tmpl-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--rs);padding:16px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.tmpl-card:hover{background:var(--card-h);border-color:var(--border-h);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tmpl-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--purple));opacity:0;transition:opacity .2s}
.tmpl-card:hover::before{opacity:1}
.tmpl-card-name{font-size:.9rem;font-weight:600;margin-bottom:4px}
.tmpl-card-cat{display:inline-block;font-size:.65rem;color:var(--accent-h);background:rgba(124,58,237,.1);padding:2px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.5px}
.tmpl-card-tips{font-size:.78rem;color:var(--text2);margin-top:8px;line-height:1.5}

/* Empty / loading */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.loading{display:flex;justify-content:center;padding:30px}
.spinner{width:28px;height:28px;border:3px solid var(--glass-b);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(16,16,26,.95);backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:var(--rs);padding:12px 24px;font-size:.85rem;z-index:300;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Teleprompter */
.tp-overlay{position:fixed;inset:0;background:#000;z-index:500;display:none;flex-direction:column;cursor:none}
.tp-overlay.active{display:flex}
.tp-overlay.mirror .tp-content{transform:scaleX(-1)}
.tp-countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:510;background:#000}
.tp-countdown .num{font-size:min(30vw,200px);font-weight:700;color:#fff;animation:tpPulse .8s ease}
@keyframes tpPulse{0%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
.tp-scroll-wrap{flex:1;overflow:hidden;position:relative}
.tp-content{padding:15vh 8vw 80vh;color:#fff;font-family:'Inter',sans-serif;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;transition:font-size .2s}
.tp-progress{position:fixed;top:0;left:0;height:3px;background:var(--accent,#7c3aed);z-index:520;transition:width .1s linear}
.tp-controls{position:fixed;bottom:0;left:0;right:0;padding:16px 20px;display:flex;align-items:center;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.9));z-index:520;transition:opacity .3s;flex-wrap:wrap;justify-content:center}
.tp-controls.hidden{opacity:0;pointer-events:none}
.tp-ctrl-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:8px 14px;font-size:.85rem;cursor:pointer;transition:all .2s;min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;gap:4px}
.tp-ctrl-btn:hover{background:rgba(255,255,255,.25)}
.tp-ctrl-btn.active{background:rgba(124,58,237,.4);border-color:rgba(124,58,237,.6)}
.tp-speed-label,.tp-size-label{color:rgba(255,255,255,.6);font-size:.7rem;white-space:nowrap}
.tp-range{-webkit-appearance:none;appearance:none;height:4px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;width:100px}
.tp-range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:#fff;border-radius:50%;cursor:pointer}
.tp-range::-moz-range-thumb{width:18px;height:18px;background:#fff;border-radius:50%;cursor:pointer;border:none}
.tp-exit{position:fixed;top:16px;right:16px;z-index:530;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:50%;width:44px;height:44px;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.tp-exit.hidden{opacity:0;pointer-events:none}
@media(max-width:479px){.tp-range{width:70px}.tp-controls{gap:8px;padding:12px}}
</style>
</head>
<body>
<div class="app mobile-view" id="app">
  <div class="top-bar">
    <h1>✍️ <span>Script Writer</span></h1>
    <div class="top-actions">
      <button class="icon-btn" onclick="openTemplates()">📋</button>
      <button class="icon-btn" id="statsToggle" onclick="toggleStats()">📊</button>
    </div>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="mini-stat"><div class="val" id="sTotal">—</div><div class="lbl">Scripts</div></div>
    <div class="mini-stat"><div class="val" id="sDrafts">—</div><div class="lbl">Drafts</div></div>
    <div class="mini-stat"><div class="val" id="sPub">—</div><div class="lbl">Published</div></div>
    <div class="mini-stat"><div class="val" id="sWords">—</div><div class="lbl">Avg Words</div></div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        <input class="search-box" id="searchBox" placeholder="Search scripts..." oninput="filterScripts()">
        <button class="new-btn" onclick="newScript()">＋ New</button>
      </div>
      <div class="filter-row" id="filterRow">
        <div class="filter-chip active" data-filter="all" onclick="setFilter('all',this)">All</div>
        <div class="filter-chip" data-filter="draft" onclick="setFilter('draft',this)"><span style="color:var(--yellow)">●</span> Draft</div>
        <div class="filter-chip" data-filter="in_progress" onclick="setFilter('in_progress',this)"><span style="color:var(--blue)">●</span> In Progress</div>
        <div class="filter-chip" data-filter="review" onclick="setFilter('review',this)"><span style="color:var(--purple)">●</span> Review</div>
        <div class="filter-chip" data-filter="published" onclick="setFilter('published',this)"><span style="color:var(--green)">●</span> Published</div>
      </div>
      <div class="script-list" id="scriptList"><div class="loading"><div class="spinner"></div></div></div>
    </div>

    <div class="editor-panel" id="editorPanel">
      <div class="editor-top">
        <button class="back-btn" onclick="backToList()">←</button>
        <input class="editor-title-input" id="eTitle" placeholder="Script title...">
        <div class="auto-save-indicator" id="autoSave"><div class="dot"></div><span>Saved</span></div>
      </div>
      <div class="editor-toolbar">
        <div class="tb-group">
          <input class="tb-input" id="eSeries" placeholder="Series..." style="width:120px">
          <select class="tb-select" id="eStatus">
            <option value="draft">📝 Draft</option>
            <option value="in_progress">🔄 In Progress</option>
            <option value="review">👀 Review</option>
            <option value="published">✅ Published</option>
          </select>
        </div>
        <div class="tb-group">
          <button class="tb-btn" id="fontToggle" onclick="toggleFont()" title="Toggle font">𝐴𝚊</button>
          <button class="tb-btn" id="readToggle" onclick="toggleReadMode()" title="Reading mode">👁</button>
          <button class="tb-btn" id="versionToggle" onclick="toggleVersions()" title="Version history">🕐</button>
          <button class="tb-btn" id="tpToggle" onclick="openTeleprompter()" title="Teleprompter mode">🎬</button>
        </div>
      </div>
      <div class="editor-area" id="editorArea" style="position:relative">
        <textarea id="eContent" placeholder="Start writing your script..."></textarea>
        <div class="reading-view" id="readView" style="display:none"></div>
        <div class="version-panel" id="versionPanel">
          <div class="version-header"><h3>🕐 Versions</h3><button class="tb-btn" onclick="toggleVersions()">✕</button></div>
          <div class="version-list" id="versionList"></div>
        </div>
      </div>
      <div class="editor-footer">
        <div class="word-stats">
          <span><span class="num" id="eWordCount">0</span> words</span>
          <span><span class="num" id="eCharCount">0</span> chars</span>
          <span>~<span class="num" id="eReadTime">0</span> min read</span>
        </div>
        <div class="editor-footer-actions">
          <button class="del-btn" id="delBtn" onclick="deleteScript()" style="display:none">🗑</button>
          <button class="save-btn" onclick="saveScript()">💾 Save</button>
        </div>
      </div>
    </div>
  </div>

  <button class="fab" id="fab" onclick="newScript()">＋</button>
</div>

<!-- Template Overlay -->
<div class="overlay" id="tmplOverlay" onclick="if(event.target===this)closeTemplates()">
  <div class="modal">
    <div class="modal-head"><h2>📋 Templates</h2><button class="modal-close" onclick="closeTemplates()">✕</button></div>
    <div class="modal-body"><div class="tmpl-grid" id="tmplGrid"><div class="loading"><div class="spinner"></div></div></div></div>
  </div>
</div>


<!-- Teleprompter Overlay -->
<div class="tp-overlay" id="tpOverlay">
  <div class="tp-progress" id="tpProgress"></div>
  <div class="tp-scroll-wrap" id="tpScrollWrap">
    <div class="tp-content" id="tpContent"></div>
  </div>
  <button class="tp-exit" id="tpExit" onclick="closeTeleprompter()">✕</button>
  <div class="tp-controls" id="tpControls">
    <button class="tp-ctrl-btn" id="tpPlayBtn" onclick="tpTogglePlay()">▶</button>
    <span class="tp-speed-label">Speed</span>
    <input type="range" class="tp-range" id="tpSpeed" min="0.2" max="5" step="0.2" value="1.2">
    <span class="tp-size-label">Size</span>
    <input type="range" class="tp-range" id="tpSize" min="24" max="72" step="2" value="36">
    <button class="tp-ctrl-btn" id="tpMirrorBtn" onclick="tpToggleMirror()" title="Mirror (M)">🪞</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let scripts=[],currentId=null,currentScript=null,templates=[];
let activeFilter='all',searchQuery='',autoSaveTimer=null,isMono=false,isReadMode=false;
const $=id=>document.getElementById(id);
const app=$('app');

// --- Data ---
async function loadScripts(){
  try{const r=await fetch('/api/scripts');scripts=await r.json();renderList()}
  catch(e){$('scriptList').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div>Failed to load</div>'}
}
async function loadStats(){
  try{
    const r=await fetch('/api/stats');const s=await r.json();
    animateNum('sTotal',s.total_scripts||0);animateNum('sDrafts',s.drafts||0);
    animateNum('sPub',s.published||0);animateNum('sWords',Math.round(s.avg_word_count||0));
  }catch(e){}
}
function animateNum(id,target){
  const el=$(id);const start=parseInt(el.textContent)||0;
  if(start===target){el.textContent=target;return}
  const dur=400,st=performance.now();
  function tick(now){
    const p=Math.min((now-st)/dur,1);
    el.textContent=Math.round(start+(target-start)*easeOut(p));
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function easeOut(t){return 1-Math.pow(1-t,3)}

// --- Filters ---
function setFilter(f,el){
  activeFilter=f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');renderList();
}
function filterScripts(){searchQuery=$('searchBox').value.toLowerCase();renderList()}

function getFiltered(){
  let list=scripts;
  if(activeFilter!=='all')list=list.filter(s=>(s.status||'draft')===activeFilter);
  if(searchQuery)list=list.filter(s=>(s.title||'').toLowerCase().includes(searchQuery)||(s.video_series||'').toLowerCase().includes(searchQuery));
  return [...list].sort((a,b)=>new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at));
}

function renderList(){
  const list=getFiltered();
  if(!list.length){$('scriptList').innerHTML='<div class="empty"><div class="empty-icon">✍️</div><p>No scripts found</p></div>';return}
  $('scriptList').innerHTML=list.map((s,i)=>`
    <div class="script-item ${s.id===currentId?'active':''}" onclick="selectScript(${s.id})" style="animation:fadeIn .3s ease ${i*30}ms both">
      <div class="script-item-title">${esc(s.title||'Untitled')}</div>
      <div class="script-item-meta">
        <span class="status-badge ${s.status||'draft'}">${statusLabel(s.status)}</span>
        ${s.video_series?`<span class="series-badge">${esc(s.video_series)}</span>`:''}
        <span>${s.word_count||0}w</span>
        <span class="script-item-date">${relTime(s.updated_at||s.created_at)}</span>
      </div>
    </div>`).join('');
}

function statusLabel(s){return{draft:'Draft',in_progress:'In Progress',review:'Review',published:'Published'}[s||'draft']||'Draft'}
function relTime(d){if(!d)return'';const ms=Date.now()-new Date(d);const m=ms/60000;if(m<60)return Math.floor(m)+'m ago';const h=m/60;if(h<24)return Math.floor(h)+'h ago';return Math.floor(h/24)+'d ago'}

// --- Editor ---
async function selectScript(id){
  currentId=id;
  try{
    const r=await fetch(`/api/scripts/${id}`);currentScript=await r.json();
    $('eTitle').value=currentScript.title||'';$('eSeries').value=currentScript.video_series||'';
    $('eStatus').value=currentScript.status||'draft';$('eContent').value=currentScript.content||'';
    $('delBtn').style.display='inline-flex';updateWordCount();updateReadView();renderList();renderVersions();
    app.classList.add('editing');showSaveState('saved');
  }catch(e){toast('Error loading script')}
}

function newScript(){
  currentId=null;currentScript=null;
  $('eTitle').value='';$('eSeries').value='';$('eStatus').value='draft';$('eContent').value='';
  $('delBtn').style.display='none';updateWordCount();updateReadView();renderList();renderVersions();
  app.classList.add('editing');showSaveState('');
}
function backToList(){app.classList.remove('editing')}

// Auto-save
function scheduleAutoSave(){
  showSaveState('saving');
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(()=>{if(currentId&&$('eTitle').value)saveScript(true)},2000);
}
function showSaveState(state){
  const el=$('autoSave');
  el.className='auto-save-indicator'+(state?' '+state:'');
  el.querySelector('span').textContent=state==='saving'?'Saving...':state==='saved'?'Saved':'';
}

async function saveScript(auto=false){
  const body={title:$('eTitle').value||'Untitled',video_series:$('eSeries').value,content:$('eContent').value,status:$('eStatus').value};
  try{
    const r=await fetch(currentId?`/api/scripts/${currentId}`:'/api/scripts',{method:currentId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const saved=await r.json();
    if(!currentId&&saved.id){currentId=saved.id;$('delBtn').style.display='inline-flex'}
    if(saved.versions)currentScript=saved;
    showSaveState('saved');
    if(!auto)toast('Saved ✓');
    
// --- Teleprompter ---
let tpPlaying=false,tpScrollPos=0,tpRafId=null,tpHideTimer=null,tpMirrored=false;

function openTeleprompter(){
  const text=$('eContent').value.trim();
  if(!text){toast('Write something first!');return}
  const ov=$('tpOverlay');
  $('tpContent').textContent=text;
  $('tpContent').style.fontSize=$('tpSize').value+'px';
  tpScrollPos=0;tpPlaying=false;tpMirrored=false;
  ov.classList.remove('mirror');
  $('tpPlayBtn').textContent='▶';
  $('tpScrollWrap').scrollTop=0;
  $('tpProgress').style.width='0%';
  ov.classList.add('active');
  document.body.style.overflow='hidden';
  tpShowControls();
  // Countdown
  tpCountdown(3);
}

function tpCountdown(n){
  if(n<=0){tpStartScroll();return}
  let cd=document.createElement('div');
  cd.className='tp-countdown';cd.innerHTML='<div class="num">'+n+'</div>';
  $('tpOverlay').appendChild(cd);
  setTimeout(()=>{cd.remove();tpCountdown(n-1)},900);
}

function tpStartScroll(){tpPlaying=true;$('tpPlayBtn').textContent='⏸';tpAnimate()}

function tpAnimate(){
  if(!tpPlaying)return;
  const wrap=$('tpScrollWrap');
  const speed=parseFloat($('tpSpeed').value);
  wrap.scrollTop+=speed;
  tpUpdateProgress();
  tpRafId=requestAnimationFrame(tpAnimate);
}

function tpTogglePlay(){
  tpPlaying=!tpPlaying;
  $('tpPlayBtn').textContent=tpPlaying?'⏸':'▶';
  if(tpPlaying)tpAnimate();else if(tpRafId)cancelAnimationFrame(tpRafId);
  tpShowControls();
}

function tpToggleMirror(){
  tpMirrored=!tpMirrored;
  $('tpOverlay').classList.toggle('mirror',tpMirrored);
  $('tpMirrorBtn').classList.toggle('active',tpMirrored);
  tpShowControls();
}

function tpUpdateProgress(){
  const wrap=$('tpScrollWrap');
  const max=wrap.scrollHeight-wrap.clientHeight;
  const pct=max>0?(wrap.scrollTop/max)*100:0;
  $('tpProgress').style.width=Math.min(pct,100)+'%';
}

function closeTeleprompter(){
  tpPlaying=false;if(tpRafId)cancelAnimationFrame(tpRafId);
  $('tpOverlay').classList.remove('active','mirror');
  document.body.style.overflow='';
  // Remove any leftover countdowns
  $('tpOverlay').querySelectorAll('.tp-countdown').forEach(e=>e.remove());
}

function tpShowControls(){
  $('tpControls').classList.remove('hidden');
  $('tpExit').classList.remove('hidden');
  clearTimeout(tpHideTimer);
  tpHideTimer=setTimeout(()=>{
    if(tpPlaying){$('tpControls').classList.add('hidden');$('tpExit').classList.add('hidden')}
  },3000);
}

// Size/speed changes
$('tpSize').addEventListener('input',function(){$('tpContent').style.fontSize=this.value+'px';tpShowControls()});
$('tpSpeed').addEventListener('input',function(){tpShowControls()});

// Mouse/touch show controls
$('tpOverlay').addEventListener('mousemove',tpShowControls);
$('tpOverlay').addEventListener('touchstart',function(e){
  if(e.target.closest('.tp-controls,.tp-exit'))return;
  tpTogglePlay();
},{passive:true});

// Keyboard
document.addEventListener('keydown',function(e){
  if(!$('tpOverlay').classList.contains('active'))return;
  if(e.code==='Space'){e.preventDefault();tpTogglePlay()}
  else if(e.code==='Escape')closeTeleprompter();
  else if(e.key==='m'||e.key==='M')tpToggleMirror();
  else if(e.code==='ArrowUp'){e.preventDefault();const s=$('tpSpeed');s.value=Math.min(5,parseFloat(s.value)+0.2).toFixed(1);tpShowControls()}
  else if(e.code==='ArrowDown'){e.preventDefault();const s=$('tpSpeed');s.value=Math.max(0.2,parseFloat(s.value)-0.2).toFixed(1);tpShowControls()}
});
loadScripts();loadStats();
    if(currentId&&!auto){const r2=await fetch(`/api/scripts/${currentId}`);currentScript=await r2.json();renderVersions()}
  }catch(e){showSaveState('');if(!auto)toast('Error saving')}
}

async function deleteScript(){
  if(!currentId||!confirm('Delete this script?'))return;
  try{await fetch(`/api/scripts/${currentId}`,{method:'DELETE'});currentId=null;currentScript=null;newScript();backToList();toast('Deleted');loadScripts();loadStats()}catch(e){toast('Error deleting')}
}

// Word count
function updateWordCount(){
  const t=$('eContent').value.trim();const w=t?t.split(/\s+/).length:0;const c=t.length;
  $('eWordCount').textContent=w;$('eCharCount').textContent=c;
  $('eReadTime').textContent=Math.max(1,Math.round(w/150));
}
$('eContent').addEventListener('input',()=>{updateWordCount();updateReadView();scheduleAutoSave()});
$('eTitle').addEventListener('input',scheduleAutoSave);
$('eSeries').addEventListener('input',scheduleAutoSave);
$('eStatus').addEventListener('change',scheduleAutoSave);

// Font toggle
function toggleFont(){
  isMono=!isMono;
  $('eContent').classList.toggle('mono',isMono);
  $('readView').classList.toggle('mono',isMono);
  $('fontToggle').classList.toggle('active',isMono);
}

// Reading mode
function toggleReadMode(){
  isReadMode=!isReadMode;
  $('readToggle').classList.toggle('active',isReadMode);
  $('eContent').style.display=isReadMode?'none':'block';
  $('readView').style.display=isReadMode?'block':'none';
  updateReadView();
}
function updateReadView(){if(isReadMode)$('readView').textContent=$('eContent').value}

// Version history
function toggleVersions(){$('versionPanel').classList.toggle('open')}
function renderVersions(){
  const vl=$('versionList');
  if(!currentScript||!currentScript.versions||!currentScript.versions.length){vl.innerHTML='<div class="empty" style="padding:20px"><p style="font-size:.8rem">No versions yet</p></div>';return}
  vl.innerHTML=currentScript.versions.map((v,i)=>`
    <div class="version-item" onclick="loadVersion(${i})">
      <div class="version-item-ver">v${v.version||i+1}</div>
      <div class="version-item-date">${v.saved_at?new Date(v.saved_at).toLocaleString():''}</div>
      <div class="version-item-words">${v.word_count||0} words</div>
    </div>`).join('');
}
function loadVersion(i){
  if(!currentScript||!currentScript.versions)return;
  const v=currentScript.versions[i];
  if(v&&v.content!=null){$('eContent').value=v.content;updateWordCount();updateReadView();toast('Version loaded')}
}

// Stats toggle
let statsVisible=true;
function toggleStats(){statsVisible=!statsVisible;$('statsBar').style.display=statsVisible?'':'none';$('statsToggle').classList.toggle('active',statsVisible)}

// Templates
async function openTemplates(){
  $('tmplOverlay').classList.add('active');
  if(!templates.length){try{const r=await fetch('/api/templates');templates=await r.json()}catch(e){templates=[]}}
  if(!templates.length){$('tmplGrid').innerHTML='<div class="empty"><p>No templates available</p></div>';return}
  $('tmplGrid').innerHTML=templates.map(t=>`
    <div class="tmpl-card" onclick="applyTemplate(${t.id})">
      <div class="tmpl-card-name">${esc(t.name)}</div>
      <div class="tmpl-card-cat">${esc(t.category||'')}</div>
      ${t.tips?`<div class="tmpl-card-tips">${esc(t.tips)}</div>`:''}
    </div>`).join('');
}
function closeTemplates(){$('tmplOverlay').classList.remove('active')}
async function applyTemplate(id){
  try{const r=await fetch(`/api/templates/${id}`);const t=await r.json();newScript();$('eTitle').value=t.name||'';$('eContent').value=t.structure||'';updateWordCount();closeTemplates();app.classList.add('editing');toast('Template applied')}catch(e){toast('Error')}
}

// Touch swipe
let touchStartX=0;
app.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX},{passive:true});
app.addEventListener('touchend',e=>{
  if(window.innerWidth>=768)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)<60)return;
  if(dx<0&&!app.classList.contains('editing')&&currentId)app.classList.add('editing');
  if(dx>0&&app.classList.contains('editing'))backToList();
},{passive:true});

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

let tpPlaying=false,tpScrollPos=0,tpRafId=null,tpHideTimer=null,tpMirrored=false;

}

}

  $('tpMirrorBtn').classList.toggle('active',tpMirrored);
  tpShowControls();
}

  const pct=max>0?(wrap.scrollTop/max)*100:0;
  $('tpProgress').style.width=Math.min(pct,100)+'%';
}

  $('tpOverlay').classList.remove('active','mirror');
  document.body.style.overflow='';
  // Remove any leftover countdowns
  $('tpOverlay').querySelectorAll('.tp-countdown').forEach(e=>e.remove());
}

function tpShowControls(){
  $('tpControls').classList.remove('hidden');
  $('tpExit').classList.remove('hidden');
  clearTimeout(tpHideTimer);
  tpHideTimer=setTimeout(()=>{
    if(tpPlaying){$('tpControls').classList.add('hidden');$('tpExit').classList.add('hidden')}
  },3000);
}

// Size/speed changes
$('tpSize').addEventListener('input',function(){$('tpContent').style.fontSize=this.value+'px';tpShowControls()});
$('tpSpeed').addEventListener('input',function(){tpShowControls()});

// Mouse/touch show controls
$('tpOverlay').addEventListener('mousemove',tpShowControls);
$('tpOverlay').addEventListener('touchstart',function(e){
  if(e.target.closest('.tp-controls,.tp-exit'))return;
  tpTogglePlay();
},{passive:true});

document.addEventListener('keydown',function(e){
  if(!$('tpOverlay').classList.contains('active'))return;
  if(e.code==='Space'){e.preventDefault();tpTogglePlay()}
  else if(e.code==='Escape')closeTeleprompter();
  else if(e.key==='m'||e.key==='M')tpToggleMirror();
  else if(e.code==='ArrowUp'){e.preventDefault();const s=$('tpSpeed');s.value=Math.min(5,parseFloat(s.value)+0.2).toFixed(1);tpShowControls()}
  else if(e.code==='ArrowDown'){e.preventDefault();const s=$('tpSpeed');s.value=Math.max(0.2,parseFloat(s.value)-0.2).toFixed(1);tpShowControls()}

loadScripts();loadStats();
</script>
