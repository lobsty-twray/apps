<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="http://shared-assets:3000/design-tokens.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Video Pipeline | Tech With Ray</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root {
      --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--purple:#a855f7;
      --blur:blur(20px);--radius:16px;--radius-sm:10px;--radius-xs:8px;
      --safe-b:env(safe-area-inset-bottom,0px);
}
    html,body{height:100%;overflow:hidden}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
    input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
    button{cursor:pointer;border:none;background:none}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

    /* ===== GLASS UTILITIES ===== */
    .glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius)}
    .glass-strong{background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius)}

    /* ===== LOGIN ===== */
    #login-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg);position:relative;overflow:hidden}
    #login-screen::before{content:'';position:absolute;width:300px;height:300px;background:var(--accent);filter:blur(120px);opacity:0.15;top:20%;left:30%;border-radius:50%}
    #login-screen::after{content:'';position:absolute;width:250px;height:250px;background:var(--purple);filter:blur(100px);opacity:0.1;bottom:20%;right:20%;border-radius:50%}
    .login-box{width:min(380px,90vw);padding:40px 32px;position:relative;z-index:1}
    .login-logo{font-size:48px;text-align:center;margin-bottom:8px}
    .login-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:2px}
    .login-sub{color:var(--text2);text-align:center;font-size:13px;margin-bottom:28px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
    .input{width:100%;padding:11px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:var(--radius-sm);color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
    .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
    .input::placeholder{color:var(--text3)}
    .btn-accent{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-weight:600;font-size:15px;transition:all .15s;margin-top:8px}
    .btn-accent:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 20px var(--accent-glow)}
    .btn-accent:active{transform:scale(.98)}
    .login-error{color:var(--danger);font-size:13px;text-align:center;margin-top:10px;min-height:18px}

    /* ===== APP SHELL ===== */
    #app{display:none;height:100vh;flex-direction:column}
    .topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-shrink:0;border-bottom:1px solid var(--glass-border);background:rgba(10,10,15,0.8);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);z-index:50}
    .topbar-title{font-size:17px;font-weight:700;white-space:nowrap}
    .topbar-spacer{flex:1}
    .topbar-search{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-xs);padding:8px 12px;min-width:0;flex:1;max-width:260px;transition:border .15s}
    .topbar-search:focus-within{border-color:var(--accent)}
    .topbar-search svg{flex-shrink:0;opacity:.4;width:16px;height:16px}
    .topbar-search input{background:none;border:none;outline:none;color:var(--text);width:100%;font-size:13px}
    .topbar-search input::placeholder{color:var(--text3)}
    .icon-btn{width:40px;height:40px;min-width:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-xs);color:var(--text2);transition:all .15s}
    .icon-btn:hover{background:var(--glass-hover);color:var(--text)}
    .icon-btn svg{width:20px;height:20px}

    /* ===== MAIN AREA ===== */
    .main-area{flex:1;overflow:hidden;position:relative}
    .view{display:none;height:100%;overflow:hidden}
    .view.active{display:flex;flex-direction:column}

    /* ===== BOTTOM NAV (mobile) ===== */
    .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;padding:6px 8px calc(6px + var(--safe-b));background:rgba(10,10,15,0.85);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--glass-border)}
    .bottom-nav-inner{display:flex;justify-content:space-around}
    .bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-width:56px;color:var(--text3);font-size:10px;font-weight:600;transition:color .15s;-webkit-tap-highlight-color:transparent}
    .bnav-item.active{color:var(--accent)}
    .bnav-item svg{width:22px;height:22px}
    @media(max-width:768px){
      .bottom-nav{display:block}
      #app{padding-bottom:calc(60px + var(--safe-b))}
    }

    /* ===== FAB ===== */
    .fab{position:fixed;z-index:55;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px var(--accent-glow);transition:all .2s;right:20px;bottom:24px}
    .fab:hover{transform:scale(1.08);box-shadow:0 6px 30px var(--accent-glow)}
    .fab:active{transform:scale(.95)}
    .fab svg{width:24px;height:24px}
    @media(max-width:768px){.fab{bottom:calc(72px + var(--safe-b))}}

    /* ===== PIPELINE / KANBAN ===== */
    .pipeline-wrap{flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
    .pipeline-cols{display:flex;gap:14px;padding:16px;height:100%;min-width:min-content}
    .stage-col{width:290px;min-width:290px;display:flex;flex-direction:column;height:100%}
    .stage-hdr{display:flex;align-items:center;gap:8px;padding:0 4px 10px;flex-shrink:0}
    .stage-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .stage-dot.ideas{background:#a855f7}.stage-dot.scripting{background:#f59e0b}.stage-dot.filming{background:#ef4444}.stage-dot.editing{background:#3b82f6}.stage-dot.review{background:#8b5cf6}.stage-dot.scheduled{background:#06b6d4}.stage-dot.published{background:#10b981}
    .stage-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2)}
    .stage-cnt{font-size:11px;color:var(--text3);background:var(--glass);padding:1px 7px;border-radius:10px;font-weight:600}
    .stage-cards{flex:1;overflow-y:auto;padding:2px;border-radius:var(--radius-sm);transition:background .15s}
    .stage-cards.drag-over{background:rgba(124,58,237,0.06);outline:2px dashed rgba(124,58,237,0.3);outline-offset:-2px}

    /* ===== VIDEO CARD ===== */
    .vcard{padding:14px;margin-bottom:8px;cursor:pointer;transition:all .2s;position:relative}
    .vcard:hover{background:var(--glass-hover);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
    .vcard:active{transform:scale(.98)}
    .vcard-thumb{width:100%;height:130px;background:rgba(255,255,255,0.02);border-radius:var(--radius-xs);margin-bottom:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .vcard-thumb img{width:100%;height:100%;object-fit:cover}
    .vcard-thumb-empty{color:var(--text3);font-size:28px}
    .vcard-priority{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%}
    .vcard-priority.high{background:var(--danger);box-shadow:0 0 8px rgba(239,68,68,0.5)}
    .vcard-priority.medium{background:var(--warning)}
    .vcard-priority.low{background:var(--success)}
    .vcard-title{font-size:13px;font-weight:600;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
    .vcard-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
    .vtag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600}
    .vtag.sponsor{background:rgba(168,85,247,0.15);color:#c084fc}
    .vtag.series{background:rgba(124,58,237,0.15);color:#818cf8}
    .vtag.collab{background:rgba(16,185,129,0.15);color:#34d399}
    .vtag.default{background:var(--glass);color:var(--text2)}
    .vcard-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text3)}
    .vcard-due.overdue{color:var(--danger)}.vcard-due.soon{color:var(--warning)}
    .vcard-progress{display:flex;align-items:center;gap:5px}
    .pbar{width:44px;height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
    .pbar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

    /* ===== MOBILE PIPELINE: vertical list ===== */
    @media(max-width:768px){
      .pipeline-wrap{overflow-x:hidden;overflow-y:auto}
      .pipeline-cols{flex-direction:column;min-width:0;padding:12px;gap:16px;height:auto}
      .stage-col{width:100%;min-width:0;height:auto}
      .stage-cards{max-height:none;overflow-y:visible}
    }

    /* ===== DASHBOARD VIEW ===== */
    .dash-wrap{flex:1;overflow-y:auto;padding:16px}
    .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
    .dash-card{padding:16px;text-align:center}
    .dash-val{font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:2px}
    .dash-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.3px}
    .dash-section-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .stage-bars{display:flex;gap:10px;align-items:flex-end;height:120px;padding:0 4px}
    .sbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
    .sbar{width:100%;max-width:40px;border-radius:6px 6px 0 0;min-height:4px;transition:height .3s}
    .sbar.ideas{background:linear-gradient(to top,#a855f7,#c084fc)}.sbar.scripting{background:linear-gradient(to top,#f59e0b,#fbbf24)}.sbar.filming{background:linear-gradient(to top,#ef4444,#f87171)}.sbar.editing{background:linear-gradient(to top,#3b82f6,#60a5fa)}.sbar.review{background:linear-gradient(to top,#8b5cf6,#a78bfa)}.sbar.scheduled{background:linear-gradient(to top,#06b6d4,#22d3ee)}.sbar.published{background:linear-gradient(to top,#10b981,#34d399)}
    .sbar-cnt{font-size:12px;font-weight:700}.sbar-lbl{font-size:10px;color:var(--text3);text-align:center}
    .activity-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--glass-border)}
    .activity-item:last-child{border:none}
    .adot{width:8px;height:8px;border-radius:50%;background:var(--glass-border);margin-top:5px;flex-shrink:0}
    .adot.created{background:var(--success)}.adot.stage_changed{background:var(--accent)}.adot.note_added{background:var(--purple)}
    .atext{font-size:13px;color:var(--text2)}.atime{font-size:11px;color:var(--text3);margin-top:1px}

    /* ===== MODAL / BOTTOM SHEET ===== */
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
    .modal-bg.active{display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal-panel{background:rgba(18,18,28,0.95);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);width:min(960px,94vw);max-height:90vh;display:flex;flex-direction:column;animation:slideUp .3s ease-out;box-shadow:0 24px 80px rgba(0,0,0,0.5)}
    @keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .modal-hdr{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--glass-border);flex-shrink:0}
    .modal-hdr-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
    .modal-hdr-spacer{flex:1}
    .modal-body{display:flex;flex:1;overflow:hidden;min-height:0}
    .modal-left{flex:6;padding:20px;overflow-y:auto;border-right:1px solid var(--glass-border)}
    .modal-right{flex:4;padding:20px;overflow-y:auto}
    .modal-footer{display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid var(--glass-border);flex-shrink:0}
    .modal-footer .spacer{flex:1}
    .msection{margin-bottom:20px}
    .msection-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
    .mtitle-input{width:100%;font-size:22px;font-weight:700;background:none;border:none;outline:none;color:var(--text);padding:0;margin-bottom:12px}
    .mtitle-input::placeholder{color:var(--text3)}
    .mdesc-input{width:100%;min-height:70px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:var(--radius-xs);padding:10px;color:var(--text);resize:vertical;outline:none;font-size:13px;line-height:1.6;transition:border .15s}
    .mdesc-input:focus{border-color:var(--accent)}
    .mrow{display:flex;gap:10px;margin-bottom:10px}
    .mfield{flex:1}
    .mfield label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
    .mselect,.mdate{width:100%;padding:9px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:var(--radius-xs);color:var(--text);outline:none;cursor:pointer;transition:border .15s;appearance:none;font-size:13px}
    .mselect:focus,.mdate:focus{border-color:var(--accent)}
    .mselect option{background:#1a1a2e}

    /* thumb area */
    .thumb-area{width:100%;height:180px;background:rgba(255,255,255,0.02);border:2px dashed var(--glass-border);border-radius:var(--radius-xs);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;overflow:hidden;position:relative}
    .thumb-area:hover{border-color:var(--accent);background:rgba(124,58,237,0.04)}
    .thumb-area img{width:100%;height:100%;object-fit:cover;position:absolute}
    .thumb-placeholder{color:var(--text3);font-size:13px;text-align:center}

    /* tags */
    .tags-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
    .tag-chip{display:flex;align-items:center;gap:3px;padding:3px 9px;background:var(--glass);border-radius:6px;font-size:11px;font-weight:500;color:var(--text2)}
    .tag-x{font-size:13px;color:var(--text3);cursor:pointer;line-height:1}.tag-x:hover{color:var(--danger)}
    .tag-inp{padding:6px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:var(--radius-xs);color:var(--text);font-size:12px;outline:none;width:130px}

    /* checklist */
    .cl-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--glass-border)}
    .cl-item:last-child{border:none}
    .cl-cb{width:20px;height:20px;min-width:20px;border-radius:5px;border:2px solid var(--glass-border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .cl-cb:hover{border-color:var(--accent)}
    .cl-cb.checked{background:var(--accent);border-color:var(--accent)}
    .cl-cb.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
    .cl-text{flex:1;font-size:13px;color:var(--text2)}
    .cl-text.done{text-decoration:line-through;color:var(--text3)}
    .cl-del{opacity:0;color:var(--text3);cursor:pointer;font-size:14px;transition:all .15s;padding:4px}
    .cl-item:hover .cl-del{opacity:1}.cl-del:hover{color:var(--danger)}
    .cl-add{display:flex;align-items:center;gap:6px;padding:8px 0;color:var(--text3);font-size:13px;cursor:pointer;transition:color .15s}
    .cl-add:hover{color:var(--accent)}
    .cl-add-input{width:100%;padding:6px 0;background:none;border:none;border-bottom:1px solid var(--glass-border);color:var(--text);font-size:13px;outline:none}

    /* notes */
    .note-card{background:rgba(255,255,255,0.03);border-radius:var(--radius-xs);padding:10px;margin-bottom:6px}
    .note-hdr{display:flex;justify-content:space-between;margin-bottom:4px}
    .note-author{font-size:11px;font-weight:600;color:var(--text2)}
    .note-time{font-size:10px;color:var(--text3)}
    .note-body{font-size:12px;color:var(--text2);line-height:1.5;white-space:pre-wrap}
    .note-del{color:var(--text3);font-size:11px;cursor:pointer;margin-top:4px;display:inline-block}.note-del:hover{color:var(--danger)}
    .note-input-row{display:flex;gap:6px;margin-bottom:10px}
    .note-inp{flex:1;padding:8px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:var(--radius-xs);color:var(--text);font-size:12px;outline:none;resize:none;min-height:36px}
    .note-inp:focus{border-color:var(--accent)}

    /* sponsors */
    .sponsor-card{background:rgba(255,255,255,0.03);border-radius:var(--radius-xs);padding:12px;margin-bottom:6px}
    .sponsor-name{font-size:13px;font-weight:600;margin-bottom:4px}
    .sponsor-row{font-size:11px;color:var(--text2);display:flex;justify-content:space-between;margin-bottom:2px}
    .sponsor-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
    .sponsor-badge.pending{background:rgba(245,158,11,0.15);color:var(--warning)}
    .sponsor-badge.confirmed{background:rgba(16,185,129,0.15);color:var(--success)}
    .sponsor-badge.paid{background:rgba(124,58,237,0.15);color:var(--accent)}

    /* buttons */
    .btn-sm{padding:7px 14px;border-radius:var(--radius-xs);font-size:13px;font-weight:600;transition:all .15s}
    .btn-fill{background:var(--accent);color:#fff}.btn-fill:hover{background:var(--accent-hover)}
    .btn-ghost{background:var(--glass);color:var(--text2);border:1px solid var(--glass-border)}.btn-ghost:hover{background:var(--glass-hover);color:var(--text)}
    .btn-danger-o{background:rgba(239,68,68,0.1);color:var(--danger)}.btn-danger-o:hover{background:rgba(239,68,68,0.18)}
    .btn-success{background:var(--success);color:#fff}.btn-success:hover{filter:brightness(1.1)}

    /* stage badge colors */
    .sbadge-ideas{background:rgba(168,85,247,0.15);color:#c084fc}
    .sbadge-scripting{background:rgba(245,158,11,0.15);color:#fbbf24}
    .sbadge-filming{background:rgba(239,68,68,0.15);color:#f87171}
    .sbadge-editing{background:rgba(59,130,246,0.15);color:#60a5fa}
    .sbadge-review{background:rgba(139,92,246,0.15);color:#a78bfa}
    .sbadge-scheduled{background:rgba(6,182,212,0.15);color:#22d3ee}
    .sbadge-published{background:rgba(16,185,129,0.15);color:#34d399}

    /* ===== TOAST ===== */
    .toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;align-items:center;gap:6px}
    @media(max-width:768px){.toast-wrap{bottom:calc(72px + var(--safe-b))}}
    .toast{padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,0.4);animation:toastIn .2s;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
    .toast.success{background:rgba(16,185,129,0.2);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7}
    .toast.error{background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
    .toast.info{background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);color:#c7d2fe}
    @keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .toast-exit{animation:toastOut .2s forwards}
    @keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

    /* ===== NEW VIDEO MODAL ===== */
    .nv-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:250;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);align-items:center;justify-content:center}
    .nv-overlay.active{display:flex}
    .nv-modal{background:rgba(18,18,28,0.95);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:28px;width:min(440px,92vw);animation:slideUp .2s ease-out}
    .nv-title{font-size:18px;font-weight:700;margin-bottom:20px}

    /* ===== CONTEXT MENU ===== */
    .ctx-menu{position:fixed;background:rgba(18,18,28,0.95);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius-sm);min-width:180px;z-index:280;padding:4px;animation:fadeIn .1s}
    .ctx-item{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;color:var(--text2);border-radius:var(--radius-xs);cursor:pointer;transition:all .1s;width:100%;text-align:left}
    .ctx-item:hover{background:var(--glass-hover);color:var(--text)}
    .ctx-item.danger{color:var(--danger)}.ctx-item.danger:hover{background:rgba(239,68,68,0.1)}
    .ctx-sep{height:1px;background:var(--glass-border);margin:3px 0}
    .ctx-sub{position:relative}
    .ctx-sub-content{display:none;position:absolute;left:100%;top:0;background:rgba(18,18,28,0.95);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius-sm);min-width:150px;padding:4px}
    .ctx-sub:hover .ctx-sub-content{display:block}

    /* mobile modal */
    @media(max-width:768px){
      .modal-panel{width:100%;max-height:100vh;border-radius:var(--radius) var(--radius) 0 0;position:fixed;bottom:0;left:0;right:0;max-height:92vh;animation:sheetUp .3s ease-out}
      @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
      .modal-bg.active{align-items:flex-end}
      .modal-body{flex-direction:column}
      .modal-left{border-right:none;border-bottom:1px solid var(--glass-border)}
      .modal-right{max-height:40vh}
    }

    /* ===== DESKTOP SIDEBAR ===== */
    @media(min-width:769px){
      .app-row{display:flex;height:100%}
      .sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--glass-border);display:flex;flex-direction:column;background:rgba(10,10,15,0.6);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
      .sb-header{padding:16px;border-bottom:1px solid var(--glass-border)}
      .sb-logo{display:flex;align-items:center;gap:8px}
      .sb-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
      .sb-name{font-size:15px;font-weight:700}.sb-sub{font-size:10px;color:var(--text3)}
      .sb-nav{flex:1;padding:8px;overflow-y:auto}
      .sb-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:10px 10px 4px}
      .sb-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--radius-xs);color:var(--text2);font-size:13px;font-weight:500;transition:all .15s;cursor:pointer;width:100%;text-align:left;position:relative}
      .sb-item:hover{background:var(--glass-hover);color:var(--text)}
      .sb-item.active{background:rgba(124,58,237,0.1);color:var(--accent)}
      .sb-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 2px 2px 0}
      .sb-badge{margin-left:auto;font-size:10px;background:var(--glass);padding:1px 6px;border-radius:8px;font-weight:600;color:var(--text3)}
      .sb-item.active .sb-badge{background:rgba(124,58,237,0.15);color:var(--accent)}
      .sb-footer{padding:10px;border-top:1px solid var(--glass-border)}
      .sb-user{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-xs)}
      .sb-avatar{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
      .sb-uname{font-size:12px;font-weight:600}.sb-uemail{font-size:10px;color:var(--text3)}
      .sb-logout{margin-left:auto;color:var(--text3);font-size:14px;padding:4px;border-radius:4px;transition:all .15s}
      .sb-logout:hover{color:var(--danger);background:rgba(239,68,68,0.1)}
      .app-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    }
    @media(max-width:768px){
      .sidebar{display:none}
      .app-row{display:flex;flex-direction:column;height:100%}
      .app-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    }

    
    /* ===== TEMPLATE SELECTOR ===== */
    .tpl-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .tpl-row::-webkit-scrollbar{display:none}
    .tpl-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;min-width:80px;border-radius:var(--radius-sm);background:var(--glass);border:2px solid transparent;cursor:pointer;transition:all .15s;flex-shrink:0}
    .tpl-card:hover{background:var(--glass-hover);border-color:var(--glass-border)}
    .tpl-card.selected{border-color:var(--accent);background:rgba(124,58,237,0.1);box-shadow:0 0 12px var(--accent-glow)}
    .tpl-icon{font-size:24px;line-height:1}
    .tpl-name{font-size:10px;font-weight:600;color:var(--text2);white-space:nowrap}
    .tpl-card.selected .tpl-name{color:var(--accent)}
    .tpl-desc{font-size:11px;color:var(--text3);margin-bottom:8px;min-height:16px}

    /* ===== LOADING ===== */
    .spinner{width:20px;height:20px;border:2px solid var(--glass-border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ===== TIME TRACKING ===== */
    .timer-section{margin-bottom:20px}
    .timer-active{background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.25);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
    .timer-active::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);animation:timerPulse 2s ease-in-out infinite}
    @keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.4}}
    .timer-active-stage{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
    .timer-active-time{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;color:var(--text);margin-bottom:8px}
    .timer-active-note{font-size:11px;color:var(--text2);margin-bottom:8px}
    .timer-stop-btn{width:100%;padding:12px;background:var(--danger);color:#fff;border:none;border-radius:var(--radius-xs);font-weight:700;font-size:15px;min-height:48px;cursor:pointer;transition:all .15s}
    .timer-stop-btn:hover{filter:brightness(1.1)}
    .timer-stop-btn:active{transform:scale(.98)}
    .timer-start-row{display:flex;gap:8px;margin-bottom:12px}
    .timer-start-row select{flex:1;padding:10px 12px;min-height:44px}
    .timer-start-btn{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-xs);font-weight:600;font-size:13px;min-height:44px;cursor:pointer;transition:all .15s;white-space:nowrap}
    .timer-start-btn:hover{background:var(--accent-hover)}
    .timer-total{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .timer-total-chip{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;background:var(--glass);color:var(--text2)}
    .timer-total-chip.grand{background:rgba(124,58,237,0.15);color:var(--accent)}
    .timer-log-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--glass-border);font-size:12px}
    .timer-log-item:last-child{border:none}
    .timer-log-stage{font-weight:600;color:var(--text2);min-width:70px}
    .timer-log-dur{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;min-width:60px}
    .timer-log-date{color:var(--text3);flex:1}
    .timer-log-del{color:var(--text3);cursor:pointer;padding:4px;font-size:14px;min-width:28px;min-height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:all .15s}
    .timer-log-del:hover{color:var(--danger);background:rgba(239,68,68,0.1)}
    .timer-manual-row{display:none;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:end}
    .timer-manual-row.show{display:flex}
    .timer-manual-row .mfield{min-width:60px}
    .timer-manual-row input,.timer-manual-row select{min-height:44px;padding:8px 10px}
    .timer-manual-btn{padding:6px 12px;background:var(--glass);color:var(--text2);border:1px solid var(--glass-border);border-radius:var(--radius-xs);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;min-height:36px}
    .timer-manual-btn:hover{background:var(--glass-hover);color:var(--text)}
    .timer-toggle-manual{font-size:11px;color:var(--text3);cursor:pointer;transition:color .15s;margin-bottom:8px;display:inline-block}
    .timer-toggle-manual:hover{color:var(--accent)}
  </style>
</head>

<!-- Video Detail Modal -->
<div class="modal-bg" id="video-modal">
  <div class="modal-panel" id="video-modal-panel">
    <div class="modal-hdr">
      <div class="modal-hdr-badge" id="m-stage-badge"></div>
      <div class="modal-hdr-spacer"></div>
      <button class="btn-sm btn-success" id="m-move-next">Next →</button>
      <button class="icon-btn" id="m-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>

      <div class="modal-left">

          <div class="thumb-area" id="m-thumb"><div class="thumb-placeholder" id="m-thumb-ph">📷 Click to upload thumbnail</div></div>

<!-- Context Menu -->

<!-- Toast -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>
const API='';
let token=localStorage.getItem('vp_token'),currentUser=null,allVideos=[],currentView='pipeline',currentVideoId=null,calendarDate=new Date(),dragData=null;

const STAGES=[
  {id:'ideas',name:'Ideas',icon:'💡'},
  {id:'scripting',name:'Scripting',icon:'✍️'},
  {id:'filming',name:'Filming',icon:'🎬'},
  {id:'editing',name:'Editing',icon:'✂️'},
  {id:'review',name:'Review',icon:'🔍'},
  {id:'scheduled',name:'Scheduled',icon:'📅'},
  {id:'published',name:'Published',icon:'🚀'}
];

const TAG_CLS={sponsor:'sponsor',series:'series',collab:'collab'};

// Populate stage selects
function populateStageSelects(){
  ['m-stage','nv-stage'].forEach(id=>{
    const s=document.getElementById(id);
    s.innerHTML=STAGES.map(st=>`<option value="${st.id}">${st.icon} ${st.name}</option>`).join('');
  });
}
populateStageSelects();

// Helpers
function hdrs(){return{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'}}
async function api(url,opts={}){
  const r=await fetch(API+url,{...opts,headers:{...hdrs(),...opts.headers}});
  if(r.status===401){logout();throw new Error('Unauthorized')}
  return r.json();
}
function toast(msg,type='info'){
  const c=document.getElementById('toast-wrap'),el=document.createElement('div');
  el.className=`toast ${type}`;el.textContent=msg;c.appendChild(el);
  setTimeout(()=>{el.classList.add('toast-exit');setTimeout(()=>el.remove(),200)},3000);
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function timeAgo(d){const s=(Date.now()-new Date(d))/1e3;if(s<60)return'just now';if(s<3600)return`${Math.floor(s/60)}m ago`;if(s<86400)return`${Math.floor(s/3600)}h ago`;if(s<604800)return`${Math.floor(s/86400)}d ago`;return fmtDate(d)}
function dueClass(d){if(!d)return'';const now=new Date();now.setHours(0,0,0,0);const due=new Date(d);due.setHours(0,0,0,0);const diff=(due-now)/864e5;if(diff<0)return'overdue';if(diff<=3)return'soon';return''}
function stageInfo(id){return STAGES.find(s=>s.id===id)||STAGES[0]}
function nextStage(id){const i=STAGES.findIndex(s=>s.id===id);return i<STAGES.length-1?STAGES[i+1]:null}

// Auth
async function checkAuth(){
  if(!token){showLogin();return}
  try{currentUser=await api('/api/auth/me');showApp();loadVideos();loadTemplates()}catch{showLogin()}
}
function showLogin(){document.getElementById('login-screen').style.display='flex';document.getElementById('app').style.display='none'}
function showApp(){
  document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='flex';
  document.getElementById('sb-uname').textContent=currentUser.name;
  document.getElementById('sb-uemail').textContent=currentUser.email;
  document.getElementById('sb-avatar').textContent=currentUser.name.charAt(0).toUpperCase();
}
function logout(){token=null;localStorage.removeItem('vp_token');currentUser=null;showLogin()}

document.getElementById('login-form').addEventListener('submit',async e=>{
  e.preventDefault();const errEl=document.getElementById('login-error');errEl.textContent='';
  try{
    const d=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('login-email').value,password:document.getElementById('login-password').value})}).then(r=>r.json());
    if(d.error){errEl.textContent=d.error;return}
    token=d.token;localStorage.setItem('vp_token',token);currentUser=d.user;showApp();loadVideos();loadTemplates();
  }catch{errEl.textContent='Connection error'}
});
document.getElementById('sb-logout').addEventListener('click',logout);

// Load
async function loadVideos(){
  try{
    const p=new URLSearchParams();const s=document.getElementById('search-input').value;if(s)p.set('search',s);
    allVideos=await api(`/api/videos?${p}`);
    document.getElementById('sb-total').textContent=allVideos.length;
    renderView();
  }catch(e){console.error(e)}
}

// Navigation
function switchView(v){
  currentView=v;
  document.querySelectorAll('.sb-item[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.querySelectorAll('.bnav-item[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  const vel=document.getElementById(`view-${v}`);if(vel)vel.classList.add('active');
  const titles={pipeline:'Pipeline',dashboard:'Dashboard',calendar:'Calendar'};
  document.getElementById('topbar-title').textContent=titles[v]||'Pipeline';
  renderView();
}
function renderView(){
  if(currentView==='pipeline')renderPipeline();
  else if(currentView==='dashboard')renderDashboard();
  else if(currentView==='calendar')renderCalendar();
}

document.querySelectorAll('.sb-item[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
document.querySelectorAll('.bnav-item[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));

// Pipeline
function renderPipeline(){
  const c=document.getElementById('pipeline-cols');c.innerHTML='';
  STAGES.forEach(stage=>{
    const vids=allVideos.filter(v=>v.stage===stage.id).sort((a,b)=>a.position-b.position);
    const col=document.createElement('div');col.className='stage-col';
    col.innerHTML=`
      <div class="stage-hdr">
        <div class="stage-dot ${stage.id}"></div>
        <span class="stage-name">${stage.name}</span>
        <span class="stage-cnt">${vids.length}</span>
      </div>
      <div class="stage-cards" data-stage="${stage.id}">
        ${vids.map(v=>renderCard(v)).join('')}
        ${!vids.length?'<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">No videos</div>':''}
      </div>`;
    c.appendChild(col);
  });

  c.querySelectorAll('.vcard').forEach(card=>{
    card.addEventListener('click',e=>{if(!e.target.closest('.ctx-trigger'))openVideoModal(+card.dataset.id)});
    card.addEventListener('contextmenu',e=>{e.preventDefault();showCtx(e,+card.dataset.id)});
    card.setAttribute('draggable','true');
    card.addEventListener('dragstart',function(e){dragData={id:+this.dataset.id};this.style.opacity='.4';e.dataTransfer.effectAllowed='move'});
    card.addEventListener('dragend',function(){this.style.opacity='';document.querySelectorAll('.stage-cards').forEach(z=>z.classList.remove('drag-over'));dragData=null});
  });
  c.querySelectorAll('.stage-cards').forEach(zone=>{
    zone.addEventListener('dragover',function(e){e.preventDefault();e.dataTransfer.dropEffect='move';this.classList.add('drag-over')});
    zone.addEventListener('dragleave',function(){this.classList.remove('drag-over')});
    zone.addEventListener('drop',async function(e){
      e.preventDefault();this.classList.remove('drag-over');if(!dragData)return;
      const cards=Array.from(this.querySelectorAll('.vcard'));let pos=0;
      for(let i=0;i<cards.length;i++){const r=cards[i].getBoundingClientRect();if(e.clientY>r.top+r.height/2)pos=i+1}
      try{await api(`/api/videos/${dragData.id}/stage`,{method:'PATCH',body:JSON.stringify({stage:this.dataset.stage,position:pos})});await loadVideos();toast('Moved','success')}catch{toast('Failed','error')}
    });
  });
}

function renderCard(v){
  const tags=(Array.isArray(v.tags)?v.tags:[]).filter(Boolean);
  const total=+v.checklist_total||0,done=+v.checklist_done||0,pct=total?Math.round(done/total*100):0;
  const dc=dueClass(v.due_date);
  return`<div class="vcard glass" data-id="${v.id}">
    <div class="vcard-priority ${v.priority}"></div>
    ${v.thumbnail_url?`<div class="vcard-thumb"><img src="${esc(v.thumbnail_url)}" loading="lazy"></div>`:''}
    <div class="vcard-title">${esc(v.title)}</div>
    ${tags.length?`<div class="vcard-tags">${tags.map(t=>`<span class="vtag ${TAG_CLS[t]||'default'}">${esc(t)}</span>`).join('')}</div>`:''}
    <div class="vcard-meta">
      ${v.due_date?`<span class="vcard-due ${dc}">📅 ${fmtDate(v.due_date)}</span>`:'<span></span>'}
      ${total?`<span class="vcard-progress"><div class="pbar"><div class="pbar-fill" style="width:${pct}%"></div></div><span>${done}/${total}</span></span>`:''}
    </div>
  </div>`;
}

// Context menu
function showCtx(e,videoId){
  const menu=document.getElementById('ctx-menu'),v=allVideos.find(x=>x.id===videoId);if(!v)return;
  const ns=nextStage(v.stage);
  menu.innerHTML=`
    <button class="ctx-item" data-a="open">📋 Open</button>
    ${ns?`<button class="ctx-item" data-a="next">→ ${ns.icon} ${ns.name}</button>`:''}
    <div class="ctx-sub"><button class="ctx-item">📂 Move to ▸</button><div class="ctx-sub-content">${STAGES.map(s=>`<button class="ctx-item" data-a="move" data-st="${s.id}">${s.icon} ${s.name}</button>`).join('')}</div></div>
    <div class="ctx-sep"></div>
    <button class="ctx-item danger" data-a="del">🗑️ Delete</button>`;
  menu.style.left=Math.min(e.clientX,innerWidth-200)+'px';
  menu.style.top=Math.min(e.clientY,innerHeight-250)+'px';
  menu.style.display='block';

  menu.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',async()=>{
    hideCtx();
    if(b.dataset.a==='open')openVideoModal(videoId);
    else if(b.dataset.a==='next'&&ns){await api(`/api/videos/${videoId}/stage`,{method:'PATCH',body:JSON.stringify({stage:ns.id})});await loadVideos();toast(`Moved to ${ns.name}`,'success')}
    else if(b.dataset.a==='move'){await api(`/api/videos/${videoId}/stage`,{method:'PATCH',body:JSON.stringify({stage:b.dataset.st})});await loadVideos();toast('Moved','success')}
    else if(b.dataset.a==='del'){if(confirm('Delete this video?')){await api(`/api/videos/${videoId}`,{method:'DELETE'});await loadVideos();toast('Deleted','success')}}
  }));
  setTimeout(()=>document.addEventListener('click',hideCtx,{once:true}),0);
}
function hideCtx(){document.getElementById('ctx-menu').style.display='none'}

// Video modal
async function openVideoModal(id){
  currentVideoId=id;
  try{const v=await api(`/api/videos/${id}`);renderModal(v);document.getElementById('video-modal').classList.add('active');loadTimeEntries(id)}catch{toast('Failed to load','error')}
}
function closeModal(){document.getElementById('video-modal').classList.remove('active');currentVideoId=null}

function renderModal(v){
  const st=stageInfo(v.stage),ns=nextStage(v.stage);
  const badge=document.getElementById('m-stage-badge');
  badge.className=`modal-hdr-badge sbadge-${v.stage}`;badge.textContent=`${st.icon} ${st.name}`;

  const mb=document.getElementById('m-move-next');
  if(ns){mb.textContent=`${ns.icon} ${ns.name} →`;mb.style.display='';mb.onclick=async()=>{await api(`/api/videos/${v.id}/stage`,{method:'PATCH',body:JSON.stringify({stage:ns.id})});await loadVideos();const u=await api(`/api/videos/${v.id}`);renderModal(u);toast(`Moved to ${ns.name}`,'success')}}
  else mb.style.display='none';

  document.getElementById('m-title').value=v.title;
  document.getElementById('m-desc').value=v.description||'';
  document.getElementById('m-stage').value=v.stage;
  document.getElementById('m-priority').value=v.priority;
  document.getElementById('m-due').value=v.due_date?v.due_date.split('T')[0]:'';
  document.getElementById('m-yt').value=v.youtube_url||'';

  // Thumb
  const ta=document.getElementById('m-thumb'),ph=document.getElementById('m-thumb-ph');
  if(v.thumbnail_url){let img=ta.querySelector('img');if(!img){img=document.createElement('img');ta.prepend(img)}img.src=v.thumbnail_url;ph.style.display='none'}
  else{const img=ta.querySelector('img');if(img)img.remove();ph.style.display=''}

  // Tags
  const tc=document.getElementById('m-tags'),tags=(Array.isArray(v.tags)?v.tags:[]).filter(Boolean);
  tc.innerHTML=tags.map(t=>`<span class="tag-chip">${esc(t)}<span class="tag-x" data-t="${esc(t)}">×</span></span>`).join('');
  tc.querySelectorAll('.tag-x').forEach(b=>b.addEventListener('click',async()=>{await api(`/api/videos/${v.id}/tags/${encodeURIComponent(b.dataset.t)}`,{method:'DELETE'});const u=await api(`/api/videos/${v.id}`);renderModal(u)}));

  renderChecklist(v.checklist||[],v.id);renderNotes(v.notes||[],v.id);renderSponsors(v.sponsors||[],v.id);renderActivity(v.activity||[]);

  document.getElementById('m-save').onclick=async()=>{
    await api(`/api/videos/${v.id}`,{method:'PUT',body:JSON.stringify({title:document.getElementById('m-title').value,description:document.getElementById('m-desc').value,stage:document.getElementById('m-stage').value,priority:document.getElementById('m-priority').value,due_date:document.getElementById('m-due').value||null,youtube_url:document.getElementById('m-yt').value||null})});
    await loadVideos();toast('Saved','success');closeModal();
  };
  document.getElementById('m-delete').onclick=async()=>{if(confirm('Delete permanently?')){await api(`/api/videos/${v.id}`,{method:'DELETE'});await loadVideos();toast('Deleted','success');closeModal()}};
}

function renderChecklist(items,vid){
  const c=document.getElementById('m-checklist');
  c.innerHTML=items.map(i=>`<div class="cl-item"><div class="cl-cb ${i.completed?'checked':''}" data-id="${i.id}"></div><span class="cl-text ${i.completed?'done':''}">${esc(i.item)}</span><span class="cl-del" data-id="${i.id}">×</span></div>`).join('');
  c.querySelectorAll('.cl-cb').forEach(cb=>cb.addEventListener('click',async()=>{
    await api(`/api/checklist/${cb.dataset.id}`,{method:'PATCH',body:JSON.stringify({completed:!cb.classList.contains('checked')})});
    const u=await api(`/api/videos/${vid}`);renderChecklist(u.checklist,vid);renderActivity(u.activity);loadVideos();
  }));
  c.querySelectorAll('.cl-del').forEach(b=>b.addEventListener('click',async()=>{await api(`/api/checklist/${b.dataset.id}`,{method:'DELETE'});const u=await api(`/api/videos/${vid}`);renderChecklist(u.checklist,vid)}));

  const addBtn=document.getElementById('cl-add-btn');
  addBtn.onclick=()=>{
    const inp=document.createElement('input');inp.className='cl-add-input';inp.placeholder='New item...';addBtn.replaceWith(inp);inp.focus();
    const save=async()=>{const val=inp.value.trim();if(val){await api(`/api/videos/${vid}/checklist`,{method:'POST',body:JSON.stringify({item:val})});const u=await api(`/api/videos/${vid}`);renderChecklist(u.checklist,vid);loadVideos()}else inp.replaceWith(addBtn)};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')save();if(e.key==='Escape')inp.replaceWith(addBtn)});inp.addEventListener('blur',save);
  };
}

function renderNotes(notes,vid){
  const c=document.getElementById('m-notes');
  c.innerHTML=notes.map(n=>`<div class="note-card"><div class="note-hdr"><span class="note-author">${esc(n.author_name||'')}</span><span class="note-time">${timeAgo(n.created_at)}</span></div><div class="note-body">${esc(n.note)}</div><span class="note-del" data-id="${n.id}">Delete</span></div>`).join('');
  c.querySelectorAll('.note-del').forEach(b=>b.addEventListener('click',async()=>{await api(`/api/notes/${b.dataset.id}`,{method:'DELETE'});const u=await api(`/api/videos/${vid}`);renderNotes(u.notes,vid)}));
  document.getElementById('btn-add-note').onclick=async()=>{const inp=document.getElementById('note-input'),val=inp.value.trim();if(!val)return;await api(`/api/videos/${vid}/notes`,{method:'POST',body:JSON.stringify({note:val})});inp.value='';const u=await api(`/api/videos/${vid}`);renderNotes(u.notes,vid);renderActivity(u.activity)};
}

function renderSponsors(sponsors,vid){
  const c=document.getElementById('m-sponsors');
  c.innerHTML=sponsors.map(s=>`<div class="sponsor-card"><div class="sponsor-name">${esc(s.name)}</div>${s.deliverables?`<div class="sponsor-row"><span>Deliverables</span><span>${esc(s.deliverables)}</span></div>`:''}${s.amount?`<div class="sponsor-row"><span>Amount</span><span>$${parseFloat(s.amount).toLocaleString()}</span></div>`:''}${s.due_date?`<div class="sponsor-row"><span>Due</span><span>${fmtDate(s.due_date)}</span></div>`:''}<div class="sponsor-row"><span>Status</span><span class="sponsor-badge ${s.status}">${s.status}</span></div><button class="btn-sm btn-ghost" style="margin-top:6px;font-size:11px;padding:3px 8px" data-sd="${s.id}">Remove</button></div>`).join('');
  c.querySelectorAll('[data-sd]').forEach(b=>b.addEventListener('click',async()=>{await api(`/api/sponsors/${b.dataset.sd}`,{method:'DELETE'});const u=await api(`/api/videos/${vid}`);renderSponsors(u.sponsors,vid)}));
  document.getElementById('btn-add-sponsor').onclick=async()=>{const name=prompt('Sponsor name:');if(!name)return;const amount=prompt('Amount ($):');const del=prompt('Deliverables:');await api(`/api/videos/${vid}/sponsors`,{method:'POST',body:JSON.stringify({name,amount:parseFloat(amount)||0,deliverables:del||''})});const u=await api(`/api/videos/${vid}`);renderSponsors(u.sponsors,vid);toast('Sponsor added','success')};
}

function renderActivity(act){
  const c=document.getElementById('m-activity');
  if(!act.length){c.innerHTML='<div style="color:var(--text3);font-size:12px">No activity</div>';return}
  c.innerHTML=act.map(a=>`<div class="activity-item"><div class="adot ${a.action}"></div><div><div class="atext"><strong>${esc(a.user_name||'')}</strong> ${esc(a.details||a.action)}</div><div class="atime">${timeAgo(a.created_at)}</div></div></div>`).join('');
}

document.getElementById('m-close').addEventListener('click',closeModal);
document.getElementById('video-modal').addEventListener('click',e=>{if(e.target===document.getElementById('video-modal'))closeModal()});

// Thumbnail
document.getElementById('m-thumb').addEventListener('click',()=>document.getElementById('thumb-file').click());
document.getElementById('thumb-file').addEventListener('change',async e=>{

  e.target.value='';
});

// Tag input
document.getElementById('m-tag-input').addEventListener('keydown',async e=>{
  if(e.key==='Enter'){e.preventDefault();const val=e.target.value.trim().toLowerCase();if(!val||!currentVideoId)return;await api(`/api/videos/${currentVideoId}/tags`,{method:'POST',body:JSON.stringify({tag:val})});e.target.value='';const u=await api(`/api/videos/${currentVideoId}`);renderModal(u)}
});

// Calendar
function renderCalendar(){
  const c=document.getElementById('cal-container');
  const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
  const mName=calendarDate.toLocaleString('en-US',{month:'long',year:'numeric'});
  const firstDay=new Date(y,m,1),lastDay=new Date(y,m+1,0);
  const startOff=firstDay.getDay(),totalDays=lastDay.getDate();
  const today=new Date();today.setHours(0,0,0,0);
  const days=[];
  const prevLast=new Date(y,m,0).getDate();
  for(let i=startOff-1;i>=0;i--)days.push({d:prevLast-i,other:true,date:new Date(y,m-1,prevLast-i)});
  for(let d=1;d<=totalDays;d++)days.push({d,other:false,date:new Date(y,m,d)});
  const rem=42-days.length;for(let d=1;d<=rem;d++)days.push({d,other:true,date:new Date(y,m+1,d)});

  c.innerHTML=`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <button class="icon-btn" id="cal-prev">←</button>
      <span style="font-size:16px;font-weight:700">${mName}</span>
      <button class="icon-btn" id="cal-next">→</button>
      <button class="btn-sm btn-ghost" id="cal-today" style="margin-left:4px">Today</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--glass-border);border:1px solid var(--glass-border);border-radius:var(--radius-sm);overflow:hidden">
      ${['S','M','T','W','T','F','S'].map(d=>`<div style="padding:8px;text-align:center;font-size:11px;font-weight:600;color:var(--text3);background:var(--bg)">${d}</div>`).join('')}
      ${days.map(d=>{
        const isToday=d.date.getTime()===today.getTime();
        const ds=d.date.toISOString().split('T')[0];
        const vids=allVideos.filter(v=>v.due_date&&v.due_date.split('T')[0]===ds);
        return`<div style="min-height:80px;padding:6px;background:var(--bg);${d.other?'opacity:.3;':''}${isToday?'background:rgba(124,58,237,0.05);':''}cursor:pointer">
          <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:3px;${isToday?'background:var(--accent);color:#fff;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;':''}">${d.d}</div>
          ${vids.slice(0,2).map(v=>`<div style="padding:1px 4px;margin-bottom:1px;border-radius:3px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer" class="sbadge-${v.stage}" data-vid="${v.id}">${esc(v.title)}</div>`).join('')}
          ${vids.length>2?`<div style="font-size:9px;color:var(--text3)">+${vids.length-2}</div>`:''}
        </div>`}).join('')}
    </div>`;

  document.getElementById('cal-prev').addEventListener('click',()=>{calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendar()});
  document.getElementById('cal-next').addEventListener('click',()=>{calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendar()});
  document.getElementById('cal-today').addEventListener('click',()=>{calendarDate=new Date();renderCalendar()});
  c.querySelectorAll('[data-vid]').forEach(el=>el.addEventListener('click',()=>openVideoModal(+el.dataset.vid)));
}

// Export
function doExport(){fetch(`${API}/api/export/csv`,{headers:hdrs()}).then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='video-pipeline.csv';a.click();URL.revokeObjectURL(u)}).catch(()=>toast('Export failed','error'))}
document.getElementById('btn-export-top').addEventListener('click',doExport);
document.getElementById('sb-export')?.addEventListener('click',doExport);

// Search
let sTO;document.getElementById('search-input').addEventListener('input',()=>{clearTimeout(sTO);sTO=setTimeout(loadVideos,300)});

// Keyboard
document.addEventListener('keydown',e=>{
  const isInp=['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable;
  if(e.key==='Escape'){if(document.getElementById('video-modal').classList.contains('active'))closeModal();else if(document.getElementById('nv-modal').classList.contains('active'))closeNV();return}
  if(isInp)return;
  if(e.key==='n'){e.preventDefault();openNV()}
  else if(e.key==='k'){e.preventDefault();document.getElementById('search-input').focus()}
});


// ==================== TIME TRACKING ====================
let timerInterval=null;

function fmtDuration(s){
  if(!s||s<0)s=0;
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  if(h>0)return `${h}h ${m}m`;
  if(m>0)return `${m}m`;
  return `${Math.floor(s)}s`;
}

function fmtTimerLive(startedAt){
  const elapsed=Math.floor((Date.now()-new Date(startedAt).getTime())/1000);
  const h=Math.floor(elapsed/3600),m=Math.floor((elapsed%3600)/60),s=elapsed%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

async function loadTimeEntries(videoId){
  try{
    const entries=await api(`/api/videos/${videoId}/time`);
    renderTimerUI(entries,videoId);
  }catch(e){console.error('Time load error:',e)}
}

function renderTimerUI(entries,videoId){
  const activeEntry=entries.find(e=>!e.ended_at);
  const completed=entries.filter(e=>e.ended_at);
  const activeEl=document.getElementById('m-timer-active');
  const startRow=document.getElementById('m-timer-start-row');

  // Clear old interval
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}

  if(activeEntry){
    startRow.style.display='none';
    activeEl.innerHTML=`<div class="timer-active">
      <div class="timer-active-stage">⏱ ${esc(activeEntry.stage)}</div>
      <div class="timer-active-time" id="timer-live">${fmtTimerLive(activeEntry.started_at)}</div>
      ${activeEntry.note?`<div class="timer-active-note">${esc(activeEntry.note)}</div>`:''}
      <button class="timer-stop-btn" id="timer-stop-btn">⏹ Stop Timer</button>
    </div>`;
    timerInterval=setInterval(()=>{
      const el=document.getElementById('timer-live');
      if(el)el.textContent=fmtTimerLive(activeEntry.started_at);
    },1000);
    document.getElementById('timer-stop-btn').addEventListener('click',async()=>{
      await api(`/api/videos/${videoId}/time/stop`,{method:'POST'});
      toast('Timer stopped','success');
      loadTimeEntries(videoId);
      loadVideos();
    });
  }else{
    startRow.style.display='flex';
    activeEl.innerHTML='';
  }

  // Totals
  const totals={};let grand=0;
  completed.forEach(e=>{
    totals[e.stage]=(totals[e.stage]||0)+e.duration_seconds;
    grand+=e.duration_seconds;
  });
  const totalsEl=document.getElementById('m-timer-totals');
  if(grand>0){
    totalsEl.innerHTML=`<span class="timer-total-chip grand">Total: ${fmtDuration(grand)}</span>`+
      Object.entries(totals).map(([s,sec])=>`<span class="timer-total-chip">${esc(s)}: ${fmtDuration(sec)}</span>`).join('');
  }else{
    totalsEl.innerHTML='';
  }

  // Log
  const logEl=document.getElementById('m-timer-log');
  if(completed.length){
    logEl.innerHTML=completed.map(e=>`<div class="timer-log-item">
      <span class="timer-log-stage">${esc(e.stage)}</span>
      <span class="timer-log-dur">${fmtDuration(e.duration_seconds)}</span>
      <span class="timer-log-date">${fmtDate(e.started_at)}</span>
      <span class="timer-log-del" data-tid="${e.id}" title="Delete">×</span>
    </div>`).join('');
    logEl.querySelectorAll('.timer-log-del').forEach(b=>b.addEventListener('click',async()=>{
      await api(`/api/videos/${videoId}/time/${b.dataset.tid}`,{method:'DELETE'});
      loadTimeEntries(videoId);
    }));
  }else{
    logEl.innerHTML='<div style="color:var(--text3);font-size:12px;padding:4px 0">No time entries yet</div>';
  }
}

// Start timer
document.getElementById('m-timer-start').addEventListener('click',async()=>{
  if(!currentVideoId)return;
  const stage=document.getElementById('m-timer-stage').value;
  try{
    await api(`/api/videos/${currentVideoId}/time/start`,{method:'POST',body:JSON.stringify({stage})});
    toast('Timer started','success');
    loadTimeEntries(currentVideoId);
  }catch(e){toast(e.message||'Failed','error')}
});

// Toggle manual entry
document.getElementById('m-timer-toggle-manual').addEventListener('click',()=>{
  document.getElementById('m-timer-manual').classList.toggle('show');
});

// Add manual entry
document.getElementById('m-manual-add').addEventListener('click',async()=>{
  if(!currentVideoId)return;
  const stage=document.getElementById('m-manual-stage').value;
  const hrs=parseInt(document.getElementById('m-manual-hrs').value)||0;
  const mins=parseInt(document.getElementById('m-manual-mins').value)||0;
  const secs=hrs*3600+mins*60;
  if(secs<=0){toast('Enter a duration','error');return}
  const note=document.getElementById('m-manual-note').value.trim();
  await api(`/api/videos/${currentVideoId}/time/manual`,{method:'POST',body:JSON.stringify({stage,duration_seconds:secs,note:note||null})});
  document.getElementById('m-manual-hrs').value='0';
  document.getElementById('m-manual-mins').value='30';
  document.getElementById('m-manual-note').value='';
  document.getElementById('m-timer-manual').classList.remove('show');
  toast('Time added','success');
  loadTimeEntries(currentVideoId);
});

// Clean up timer interval on modal close
const origCloseModal=closeModal;
closeModal=function(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}origCloseModal()};


// ==================== TEMPLATES ====================
let allTemplates = [];
let selectedTemplateId = null;

async function loadTemplates() {
  try {
    allTemplates = await api('/api/templates');
    renderTemplateSelector();
  } catch(e) {
    // Templates endpoint may not need auth
    try {
      const r = await fetch(API + '/api/templates');
      allTemplates = await r.json();
      renderTemplateSelector();
    } catch(e2) { console.error('Failed to load templates:', e2); }
  }
}

function renderTemplateSelector() {
  const row = document.getElementById('nv-tpl-row');
  if (!row) return;
  row.innerHTML = '<div class="tpl-card selected" data-tpl=""><div class="tpl-icon">\u{1f4cb}</div><div class="tpl-name">Blank</div></div>' +
    allTemplates.map(t => {
      const icon = t.icon || '\u{1f3ac}';
      return '<div class="tpl-card" data-tpl="' + t.id + '"><div class="tpl-icon">' + icon + '</div><div class="tpl-name">' + esc(t.name) + '</div></div>';
    }).join('');
  
  selectedTemplateId = null;
  document.getElementById('nv-tpl-desc').textContent = 'No template \u2014 default checklist';
  
  row.querySelectorAll('.tpl-card').forEach(card => {
    card.addEventListener('click', () => {
      row.querySelectorAll('.tpl-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      const tid = card.dataset.tpl;
      selectedTemplateId = tid ? +tid : null;
      const tpl = allTemplates.find(t => t.id === selectedTemplateId);
      const descEl = document.getElementById('nv-tpl-desc');
      if (tpl) {
        const items = Array.isArray(tpl.checklist_items) ? tpl.checklist_items : JSON.parse(tpl.checklist_items || '[]');
        descEl.textContent = (tpl.description || tpl.name) + ' \u2014 ' + items.length + ' checklist items';
        // Auto-set priority from template
        if (tpl.default_priority) document.getElementById('nv-priority').value = tpl.default_priority;
      } else {
        descEl.textContent = 'No template \u2014 default checklist';
      }
    });
  });
}
