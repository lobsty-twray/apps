<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech With Ray - Premium 3D Prints</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <a href="/" class="logo" data-link>Tech With Ray</a>
        <nav class="nav" id="mainNav">
          <a href="/" class="nav-link" data-link>Home</a>
          <a href="/catalog" class="nav-link" data-link>Catalog</a>
          <a href="/custom-quote" class="nav-link" data-link>Custom Print</a>
          <a href="/contact" class="nav-link" data-link>Contact</a>
        </nav>
        <div class="header-actions">
          <button class="cart-btn" id="cartBtn" onclick="app.openCart()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <span class="cart-count" id="cartCount">0</span>
          </button>
          <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="app.toggleMobileMenu()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="mainContent"></main>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cartOverlay" onclick="app.closeCart()"></div>
    <aside class="cart-sidebar" id="cartSidebar">
      <div class="cart-header">
        <h2>Shopping Cart</h2>
        <button class="close-btn" onclick="app.closeCart()">&times;</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-footer" id="cartFooter"></div>
    </aside>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <h3>Tech With Ray</h3>
          <p>Premium 3D printed accessories and custom printing services.</p>
        </div>
        <div class="footer-links">
          <h4>Shop</h4>
          <a href="/catalog" data-link>All Products</a>
          <a href="/custom-quote" data-link>Custom Printing</a>
        </div>
        <div class="footer-links">
          <h4>Support</h4>
          <a href="/contact" data-link>Contact Us</a>
          <a href="/shipping" data-link>Shipping Info</a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 Tech With Ray. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
